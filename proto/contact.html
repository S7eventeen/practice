<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>联系方式 · 样张</title>
<!-- 联系方式页参考 wodniack.dev 的平面网格和切片字效。
     微信/QQ 圆支持悬停或点击展开；圆内点击复制，底部保留可选中的真实文本。
     ?pal=mint 使用薄荷绿底，?pal=ash 反转为炭灰底。 -->
<style>
  /* 别用 font 简写：`font:700 1rem/1 inherit` 里 inherit 只能当整个 font 的值，
     当 family 用会让整条声明被静默丢弃，字号退回 16px，而代码看着一字不错。 */
  :root{
    --bg:#00F5A0; --gridline:#06231A; --discbg:#0A0D10; --discink:#00F5A0;
    --ink:#06231A; --ink2:rgba(6,35,26,.72); --ink3:rgba(6,35,26,.5);
    --line:rgba(6,16,12,.30); --hot:#0A0D10; --onhot:#00F5A0;
    --ff:"Arial Black","Helvetica Neue",Impact,"Segoe UI",sans-serif;
    --mono:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
    --ui:"Microsoft YaHei",system-ui,-apple-system,sans-serif;
    /* 小圆直径。原片 `.s__button` 是 6rem，这里收小到 4.5rem；`.go` 的字号照原片
       比例 3.75/6 = .625 跟着它算，改这一处两边一起动。 */
    --dot:4.5rem;
    /* 小圆位置由 setGrid() 按网格交点设置；此处为 1440×900 的首帧兜底。 */
    --pxL:600px; --pxR:840px; --py:417.5px;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
            font-family:var(--ui);overflow:hidden;overscroll-behavior:none}

  /* ── 网格：一条 path 铺满，z-index:1 ─────────────────────────────── */
  #grid{position:fixed;top:-1px;left:-1px;z-index:1;
        width:calc(100% + 2px);height:calc(100% + 2px);pointer-events:none}
  #gp{fill:none;stroke:var(--gridline);stroke-width:1px}

  /* ── 两个小圆（微信 V / QQ Q）。大圆是各自小圆的子元素：mouseleave 只在离开元素
        和它的所有后代时才触发，放到外面的话鼠标移到展开的大圆上会被判成"离开"而收起 ── */
  /* #hovers 保持零尺寸且不设 transform，避免改变 .disc 的定位包含块。 */
  #hovers{position:fixed;left:0;top:0;width:0;height:0;z-index:3}
  /* 小圆位置来自 --pxL/--pxR/--py。用 margin 居中，避免 transform 新建层叠上下文。 */
  .dot{position:absolute;top:var(--py);cursor:pointer;
       width:var(--dot);height:var(--dot);
       margin-left:calc(var(--dot) / -2);margin-top:calc(var(--dot) / -2)}
  .dot[data-ch="wechat"]{left:var(--pxL)}
  .dot[data-ch="qq"]{left:var(--pxR)}
  /* 小圆点击区设 z-index:3，保持大圆展开后仍能切换另一个渠道。 */
  .dot .go{position:relative;z-index:3;
      width:100%;height:100%;background:var(--discbg);border-radius:999rem;color:var(--discink);
      display:flex;align-items:center;justify-content:center;
      /* .625 = 原片的 3.75rem / 6rem，跟着 `--dot` 一起缩 */
      font-weight:700;font-size:calc(var(--dot) * .625);line-height:1;font-family:var(--ff);
      letter-spacing:.05em;text-transform:uppercase;
      transition:scale .6s cubic-bezier(.755,.05,.855,.06),background .2s linear}
  .dot .goTx{display:block;transition:scale .6s cubic-bezier(.55,.055,.675,.19),opacity .2s linear}
  .dot.on .go{scale:1.5}
  .dot.on .goTx{scale:2}
  /* 任一大圆展开时，两小圆视觉透明但保留点击区域；未选渠道也隐藏字形。 */
  body.disc-open .dot .go{background:transparent}
  body.disc-open .dot .goTx{opacity:0}
  /* 另一盘正在收（.6s）时鼠标已经到了这一盘，两个大圆会短暂重叠 —— 不管它：
     一次只点一个，收的那盘本来就快散尽了。 */

  /* ── 展开的大圆（一盘一个）──────────────────────────────────────── */
  /* 大圆使用 absolute，以所属 .dot 为包含块，保持各自圆心。 */
  .disc{--size:64rem;
        position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;
        width:var(--size);height:var(--size);
        background:var(--discbg);border-radius:999rem;
        clip-path:circle(0 at 50% 50%);overflow:hidden;color:var(--discink);
        /* 字号 = 直径 × .3743。设在这一层是有意的：里面所有 .15em 之类都跟着它算 */
        font-weight:700;font-size:calc(var(--size) * .3743);line-height:1;
        font-family:var(--ff);text-align:center;text-transform:uppercase;
        transition:clip-path .6s cubic-bezier(.86,0,.07,1);pointer-events:none;will-change:clip-path}
  .dot.on .disc{clip-path:circle(50% at 50% 50%);
        transition:clip-path 1s cubic-bezier(1,0,0,1) .2s;pointer-events:auto}
  /* 展开瞬间那一圈：外环从 size*.5 收到 1rem，内环从 size*.5 收到 1px */
  .disc::before,.disc::after{position:absolute;inset:0;z-index:4;border-radius:999rem;
        content:"";pointer-events:none;transition:border-width .6s cubic-bezier(.86,0,.07,1)}
  .disc::before{border:calc(var(--size) * .5) solid var(--discink)}
  .disc::after {border:calc(var(--size) * .5) solid var(--discbg)}
  .dot.on .disc::before{border-width:1rem;transition:border-width 1.1s cubic-bezier(1,0,0,1) .2s}
  .dot.on .disc::after {border-width:1px; transition:border-width 1.005s cubic-bezier(1,0,0,1) .2s}

  /* ── 圆心那两行字：重叠 + 各露一半 ⇒ 看着像一个词在融化 ──────────── */
  /* top 是 45%，不是 50% —— 原片 `.s__cta__line{top:45%}` 写在整屏容器里，
     两行字的中心和大圆的几何中心差 5% 屏高。 */
  .ln{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);
      scale:.5;transition:scale 1.8s cubic-bezier(.23,1,.32,1) .6s;
      white-space:nowrap;z-index:2;will-change:scale}
  .dot.on .ln{scale:1}
  .ln--top{clip-path:inset(-100% 0 calc(50% + .01em) 0)}   /* 只露上半 */
  /* 下排有 +.014em 的字距、上排没有 —— 原片 `.s__cta__line--bottom` 就是这么写的。 */
  .ln--bot{clip-path:inset(calc(50% + .01em) 0 -100% 0);letter-spacing:.014em}  /* 只露下半 */
  /* 文字盒高 .8em、顶对齐；分界线位于 .4em，配合溢出实现上下切片。 */
  .tx{display:flex;flex-direction:row;align-items:flex-start;justify-content:center;height:.8em}
  .ch{position:relative;height:100%}
  .ch:nth-child(1){--delay:.1s} .ch:nth-child(2){--delay:.2s}
  .ch:nth-child(3){--delay:.3s} .ch:nth-child(4){--delay:.4s}
  .sl{--offset:0s;--move-delay:calc(var(--delay) + var(--offset));
      position:relative;display:block;height:100%;
      animation:s-cta-char-up-down 2s infinite var(--move-delay);will-change:transform}
  .sl:not(:first-child){position:absolute;top:0;left:0;
      animation:s-cta-char-up-down 2s infinite var(--move-delay),
                s-cta-char-toggle  2s linear infinite var(--toggle-delay)}
  .sl:nth-child(2){--offset:.14s} .sl:nth-child(3){--offset:.10s} .sl:nth-child(4){--offset:.06s}
  .ln--top .sl:not(:first-child){--toggle-delay:calc(var(--delay) + var(--offset) + .45s)}
  .ln--bot .sl:not(:first-child){--toggle-delay:calc(var(--delay) + var(--offset) + 1.45s)}
  .sl:nth-child(2){clip-path:inset(0 0 calc(100% - .03em) 0)}
  .sl:nth-child(3){clip-path:inset(0 0 calc(100% - .06em) 0)}
  .sl:nth-child(4){clip-path:inset(0 0 calc(100% - .09em) 0)}
  .ln--bot .sl:nth-child(2){clip-path:inset(calc(100% - .03em) 0 0 0)}
  .ln--bot .sl:nth-child(3){clip-path:inset(calc(100% - .06em) 0 0 0)}
  .ln--bot .sl:nth-child(4){clip-path:inset(calc(100% - .09em) 0 0 0)}
  @keyframes s-cta-char-up-down{
    0%{transform:translateZ(0);animation-timing-function:cubic-bezier(.215,.61,.355,1)}
    25%{transform:translate3d(0,-52%,0);animation-timing-function:cubic-bezier(.645,.045,.355,1)}
    75%{transform:translate3d(0,52%,0);animation-timing-function:cubic-bezier(.55,.055,.675,.19)}
    to{transform:translateZ(0)}}
  @keyframes s-cta-char-toggle{0%{opacity:1}50%{opacity:1}50.01%{opacity:0}to{opacity:0}}

  /* ── 四颗星（原片的 path 照抄）────────────────────────────────────── */
  .stars{position:absolute;inset:0;z-index:1;scale:1.25;
         transition:scale 2s cubic-bezier(.23,1,.32,1) .4s}
  .dot.on .stars{scale:1}
  .stars svg{position:absolute;width:.15em;height:auto;fill:var(--discink);
             animation:s-cta-star-float 10s infinite cubic-bezier(.455,.03,.515,.955)}
  .stars svg:nth-child(1){top:12%;left:25%;animation-duration:8s}
  .stars svg:nth-child(2){top:33%;left:85%;animation-duration:9s}
  .stars svg:nth-child(3){top:60%;left:11%;animation-duration:7s}
  .stars svg:nth-child(4){top:83%;left:74%}
  @keyframes s-cta-star-float{
    0%{transform:translateZ(0)}50%{transform:translate3d(0,-15%,0) scale(.5)}to{transform:translateZ(0)}}

  /* 半调点阵使用 --discink，间距 24px；小点尺寸保持约 1.1×1.6px。 */
  .dots{position:absolute;top:-10%;left:-10%;width:120%;height:120%;z-index:0;
        scale:1.1;transition:scale 1.8s cubic-bezier(.23,1,.32,1) .6s;
        background:radial-gradient(circle,var(--discink) .75px,transparent 1.25px) 0 0/24px 24px repeat}
  .dot.on .dots{scale:1}

  /* ── 圆里那两条真链接（一盘一条）─────────────────────────────────── */
  .links{position:absolute;top:calc(50% + var(--size) * .36);left:50%;z-index:3;
         transform:translate3d(-50%,1em,0);opacity:0;
         display:flex;flex-direction:column;gap:.5rem;align-items:center;
         transition:transform 0s linear .3s,opacity 0s linear .3s}
  .dot.on .links{opacity:1;transform:translate3d(-50%,0,0);
         transition:transform .6s cubic-bezier(.19,1,.22,1) 1s,opacity .3s cubic-bezier(.19,1,.22,1) 1s}
  /* text-transform 必须显式写回 none：`.disc` 上那句 uppercase 会继承下来，
     把微信号 sc15706810262 变成 SC15706810262 —— 看着没毛病，照着输加错人。 */
  .links a{position:relative;display:block;padding:1em 1em 1em 2em;
           background:var(--discink);color:var(--discbg);text-decoration:none;
           font:700 14px/1 var(--mono);letter-spacing:.05em;text-transform:none;cursor:pointer}
  .links a::before{position:absolute;top:calc(50% - 3px);left:.6em;
           border-top:3px solid transparent;border-left:6px solid currentColor;
           border-bottom:3px solid transparent;content:""}
  .links a:hover,.links a:focus-visible{background:var(--discbg);color:var(--discink);
           box-shadow:inset 0 0 0 1px var(--discink);outline:none}

  /* ── 页头 ────────────────────────────────────────────────────────── */
  #hdr{position:fixed;z-index:4;left:clamp(20px,4vw,56px);top:clamp(18px,3.6vh,40px);
       pointer-events:none}
  #kick{font:11px/1 var(--mono);letter-spacing:.24em;color:var(--ink3)}

  /* 网格截止 H−128，底带显示左右账号与中央 S7。
       账号层 z=6 高于圆盘，标记 z=2 低于圆盘；窄屏账号底片保持可读性。 */
  #footbar{position:fixed;z-index:6;left:0;right:0;bottom:0;height:128px;
           display:flex;align-items:center;justify-content:space-between;
           padding:0 clamp(20px,4vw,56px);pointer-events:none}
  .fbTx{font:700 14px/1 var(--mono);letter-spacing:.05em;text-transform:none;
        color:var(--ink);background:var(--bg);padding:5px 7px;
        user-select:all;opacity:0;transform:translateY(6px);
        transition:opacity .45s cubic-bezier(.2,.8,.2,1),transform .45s cubic-bezier(.2,.8,.2,1)}
  .fbTx.on{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
  .fbTx.done{background:var(--hot);color:var(--onhot)}
  /* 圆盘展开时隐藏中央 S7，避免高层圆盘把标记裁成半截。 */
  #footicon{position:fixed;z-index:2;left:50%;bottom:0;transform:translateX(-50%);
            height:128px;display:flex;align-items:center;pointer-events:none;
            transition:opacity .45s cubic-bezier(.2,.8,.2,1)}
  #footicon svg{display:block;height:42px;width:auto;fill:var(--ink)}
  body.disc-open #footicon{opacity:0}

  /* 出口：只在 iframe 里露出来（单独打开样张时没东西可退）—— 和井 / 游戏厅同一套。 */
  #exit{position:fixed;z-index:5;right:clamp(20px,4vw,56px);top:clamp(18px,3.6vh,40px);
        display:none;align-items:center;gap:7px;min-height:40px;padding:0 12px;
        font:12px var(--ui);letter-spacing:.08em;color:var(--ink2);
        background:transparent;border:1px solid var(--line);border-radius:2px;
        cursor:pointer;transition:color .15s,border-color .15s}
  #exit::before{content:"";width:14px;height:5px;border:1px solid currentColor;border-radius:3px}
  #exit:hover,#exit:focus-visible{color:var(--hot);border-color:var(--hot);outline:none}
  #exit:active::before{background:currentColor}

  #hud{position:fixed;z-index:7;right:10px;bottom:10px;display:none;
       color:#8FA3B8;font:12px/1.45 var(--mono);background:#12171Cd9;
       padding:6px 9px;border-radius:6px;white-space:pre;pointer-events:none}
  body.probe #hud{display:block}
  @media(prefers-reduced-motion:reduce){
    .sl,.stars svg{animation:none}
    .disc,.go,.goTx,.ln,.stars,.dots,.fbTx,#footicon{transition:none}
  }
</style>
</head>
<body>

<svg id="grid" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path id="gp"></path></svg>

<div id="hovers">
  <div class="dot" data-ch="wechat">
    <div class="go"><span class="goTx">V</span></div>
    <div class="disc">
      <div class="dots"></div>
      <div class="stars">
        <svg viewBox="0 0 49 49"><path d="m24.5 0 3.3 21.2L49 24.5l-21.2 3.3L24.5 49l-3.3-21.2L0 24.5l21.2-3.3L24.5 0z"/></svg>
        <svg viewBox="0 0 49 49"><path d="m24.5 0 3.3 21.2L49 24.5l-21.2 3.3L24.5 49l-3.3-21.2L0 24.5l21.2-3.3L24.5 0z"/></svg>
        <svg viewBox="0 0 49 49"><path d="m24.5 0 3.3 21.2L49 24.5l-21.2 3.3L24.5 49l-3.3-21.2L0 24.5l21.2-3.3L24.5 0z"/></svg>
        <svg viewBox="0 0 49 49"><path d="m24.5 0 3.3 21.2L49 24.5l-21.2 3.3L24.5 49l-3.3-21.2L0 24.5l21.2-3.3L24.5 0z"/></svg>
      </div>
      <!-- 两行字重叠在圆心，上排只露上半、下排只露下半 —— 原片是 "Let's"/"Rock"。
           这里一盘一套：上排是代号、下排是它落到中文里的写法。 -->
      <div class="ln ln--top"><div class="tx" data-txt="VX"></div></div>
      <div class="ln ln--bot"><div class="tx" data-txt="微信"></div></div>
      <div class="links"></div>
    </div>
  </div>

  <div class="dot" data-ch="qq">
    <div class="go"><span class="goTx">Q</span></div>
    <div class="disc">
      <div class="dots"></div>
      <div class="stars">
        <svg viewBox="0 0 49 49"><path d="m24.5 0 3.3 21.2L49 24.5l-21.2 3.3L24.5 49l-3.3-21.2L0 24.5l21.2-3.3L24.5 0z"/></svg>
        <svg viewBox="0 0 49 49"><path d="m24.5 0 3.3 21.2L49 24.5l-21.2 3.3L24.5 49l-3.3-21.2L0 24.5l21.2-3.3L24.5 0z"/></svg>
        <svg viewBox="0 0 49 49"><path d="m24.5 0 3.3 21.2L49 24.5l-21.2 3.3L24.5 49l-3.3-21.2L0 24.5l21.2-3.3L24.5 0z"/></svg>
        <svg viewBox="0 0 49 49"><path d="m24.5 0 3.3 21.2L49 24.5l-21.2 3.3L24.5 49l-3.3-21.2L0 24.5l21.2-3.3L24.5 0z"/></svg>
      </div>
      <div class="ln ln--top"><div class="tx" data-txt="QQ"></div></div>
      <div class="ln ln--bot"><div class="tx" data-txt="Q"></div></div>
      <div class="links"></div>
    </div>
  </div>
</div>

<!-- 仅保留 CONTACT 标题。 -->
<div id="hdr">
  <div id="kick">CONTACT</div>
</div>

     修改首页标记后运行 scripts/mk-contact-mark.py 同步路径。 -->
<div id="footbar">
  <span class="fbTx" data-ch="wechat"></span>
  <span class="fbTx" data-ch="qq"></span>

<script>
(function(){
"use strict";

/* 联系方式在 LINKS 数据与 DOM 文本中保持一致，保证可复制、搜索和读取。 */
var CHANNELS = [
  { key:"wechat", label:"微信", value:"sc15706810262" },
  { key:"qq",     label:"QQ",   value:"1239486160"   }
];

var Q = new URLSearchParams(location.search);
function num(k, d){ var v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; }
var REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches || Q.get("reduce") === "1";
if (Q.get("probe") !== null) document.body.classList.add("probe");

/* mint 使用薄荷绿底与深色圆，ash 反转为深底、绿字与绿线。 */
var PALS = {
  mint: {
    vars:{ "--bg":"#00F5A0", "--gridline":"#06231A",
           "--discbg":"#0A0D10", "--discink":"#00F5A0",
           "--ink":"#06231A", "--ink2":"rgba(6,35,26,.72)", "--ink3":"rgba(6,35,26,.5)",
           "--line":"rgba(6,16,12,.30)", "--hot":"#0A0D10", "--onhot":"#00F5A0" }
  },
  ash: {
    vars:{ "--bg":"#282D32", "--gridline":"rgba(0,245,160,.26)",
           "--discbg":"#0E1216", "--discink":"#00F5A0",
           "--ink":"#E7EDF3", "--ink2":"#9FABB8", "--ink3":"#6E7A87",
           "--line":"#39414A", "--hot":"#00F5A0", "--onhot":"#0A0D10" }
  }
};
var palName = Q.get("pal") === "ash" ? "ash" : "mint";
(function(){ var R = document.documentElement.style, v = PALS[palName].vars;
  for (var k in v) R.setProperty(k, v[k]); })();

/* ── 旋钮（?xxx= 可现场调）───────────────────────────────────────── */
var P = {
  vlines: num("vl", 0),      // 0 = 自动：>767px 用 12 列，否则 8
  wspeed: num("ws", 15),     // 波动扫的速度（px/帧 @60fps）
  wstr:   num("wstr", 1),    // 波动强度
  dsz:    num("dsz", 0)      // 0 = 自动：min(宽,高)-32
};

var stage = document.body;
var gp = document.getElementById("gp");
var hud = document.getElementById("hud");
var footEl = document.getElementById("footbar");
/* 一个渠道一份：小圆 · 大圆 · 圆里那条链接 · 底部那个号。全按 `data-ch` 取，
   不靠 DOM 顺序 —— 顺序错了两盘会静默对调，要发现得两个渠道都点一遍。 */
function q(sel, key){ return document.querySelector(sel.replace("%k", key)); }
var dotOf   = function(k){ return q('.dot[data-ch="%k"]', k); };
var discOf  = function(k){ return q('.dot[data-ch="%k"] .disc', k); };
var goTxOf  = function(k){ return q('.dot[data-ch="%k"] .goTx', k); };
var fbOf    = function(k){ return q('#footbar .fbTx[data-ch="%k"]', k); };

/* 每行字排成 4 层切片（原片每个字符 4 个 s__cta__char__slice） */
document.querySelectorAll(".tx").forEach(function(box){
  var word = box.dataset.txt || "";
  box.textContent = "";
  for (var i = 0; i < word.length; i++){
    var ch = document.createElement("span"); ch.className = "ch";
    for (var k = 0; k < 4; k++){
      var sl = document.createElement("span"); sl.className = "sl";
      sl.textContent = word[i];
      ch.appendChild(sl);
    }
    box.appendChild(ch);
  }
});

/* 账号同时存在于圆内复制链接与底部可选择文本中，检查内容时需覆盖两处。 */
CHANNELS.forEach(function(ch){
  var a = document.createElement("a");
  a.href = "#" + ch.key;
  a.textContent = ch.label + "：" + ch.value;
  /* 必须 stopPropagation：这条链接在 `.dot` 里面，点它会冒泡到小圆那个 click
     （开/合开关）—— 不拦的话点复制等于顺手把盘收了，看到的是"闪了一下"。 */
  a.addEventListener("click", function(ev){
    ev.preventDefault(); ev.stopPropagation(); doCopy(ch.value, a); });
  discOf(ch.key).querySelector(".links").appendChild(a);

  var t = fbOf(ch.key);
  t.textContent = ch.label + "：" + ch.value;
  t.addEventListener("click", function(){ doCopy(ch.value, t); });
});

/* 网格 gapX=宽/列数，gapY=(高−8rem−2px)/8，圆心位于 (W/2,.45H)。
   点沿径向按反距离外推，缓动按 dt 折算，保持刷新率无关。 */
var S = { vLines:12, gapX:0, gapY:0, hLines:0, W:0, H:0, contH:0, ctaMaxSize:0,
          cx:0, cy:0, reach:0, pts:[] };
var WAVE = { progress:0, op:0, speed:15, strength:1, state:"pulse" };
var BAND = 30;                 /* 波动那圈有多宽（原片：|dist - progress| < 30） */

/* 波动上限需大于圆心到最远网格点的距离加 BAND，确保扫过全部点后回到矩形。 */
function waveReach(){
  var far = Math.hypot(Math.max(S.cx, S.W - S.cx), Math.max(S.cy, S.H - S.cy));
  return far + BAND + 1;
}

function setSize(){
  S.W = document.documentElement.clientWidth;
  S.H = document.documentElement.clientHeight;
  S.contH = Math.max(200, S.H - 128);        /* 原片：calc(100vh - 8rem - 2px)，1rem=16px 时是 128 */
  S.ctaMaxSize = P.dsz > 0 ? Math.min(S.W, S.H) * P.dsz : Math.min(S.W, S.H) - 32;
  /* 两盘的 `--size` 得一起设 —— 只设一盘的症状是"另一盘的字小一半"，
     而它在收起状态下完全看不出来（`--size` 只影响展开后的字号和圆半径）。 */
  CHANNELS.forEach(function(ch){ discOf(ch.key).style.setProperty("--size", S.ctaMaxSize + "px"); });
}

function setGrid(){
  var e = S.W, i = S.H;
  S.vLines = P.vlines > 0 ? (P.vlines | 0) : (window.innerWidth > 767 ? 12 : 8);
  S.gapX = e / S.vLines;
  S.gapY = S.contH / 8;
  S.hLines = Math.floor(i / S.gapY);
  var rem = i - S.gapY * S.hLines;           /* 除不尽的余数补在最后一格 */
  S.cx = e / 2;
  S.cy = i * 0.45;                           /* 从原片截图量的：1440x900 下圆心在 y≈404 */
  S.reach = waveReach();                     /* 必须在 cx/cy/W/H 都定好之后再算 */
  S.pts = [];
  for (var n = 0; n <= S.vLines; n++){
    var col = [];
    for (var a = 0; a <= S.hLines; a++){
      var l = { x:S.gapX*n, y:S.gapY*a + (a !== 0 ? rem : 0),
                vx:0, vy:0, wx:0, wy:0, mx:0, my:0, ox:0, oy:0, dx:0, dy:0, dist:0 };
      var h = l.x - S.cx, c = l.y - S.cy, p = Math.atan2(c, h);
      l.dist = Math.hypot(h, c);
      if (l.dist === 0){ l.dx = 0; l.dy = 0; }
      else { l.dx = Math.cos(p) * (e/2/l.dist) * 5;
             l.dy = Math.sin(p) * (e/2/l.dist) * 5; }
      col.push(l);
    }
    S.pts.push(col);
  }
  /* 小圆位于中线左右各一列、最接近 cy 的网格行；y 需加 setGrid 的余数 rem。
       所有 resize 共用此处位置计算。 */
  var nc = Math.round(S.vLines / 2), na = Math.max(1, Math.round((S.cy - rem) / S.gapY));
  var rv = document.documentElement.style;
  rv.setProperty("--pxL", (S.gapX * (nc - 1)).toFixed(2) + "px");
  rv.setProperty("--pxR", (S.gapX * (nc + 1)).toFixed(2) + "px");
  rv.setProperty("--py",  (S.gapY * na + rem).toFixed(2) + "px");
}

function easeOut(t){ return t === 1 ? 1 : 1 - Math.pow(2, -10*t); }

function movePoints(k){
  var diag = Math.hypot(S.W, S.H);
  var live = WAVE.state !== "paused";            /* 扫完了就只让弹簧回弹，不再给冲量 */
  for (var ci = 0; ci < S.pts.length; ci++){
    var col = S.pts[ci];
    for (var o = 0; o < col.length; o++){
      var n = col[o];
      if (o === 0 || n.dist === 0) continue;      /* 顶行不参与 */
      if (live){
        var a = Math.abs(n.dist - WAVE.progress);
        if (a < BAND){
          var hh = 1 - a/BAND, cc = Math.atan2(n.dy, n.dx), pp = Math.cos(a*.01) * hh;
          n.vx += Math.cos(cc) * pp * BAND*.5 * WAVE.strength * k;
          n.vy += Math.sin(cc) * pp * BAND*.5 * WAVE.strength * k;
        }
      }
      n.vx += (0 - n.wx) * .001 * k;
      n.vy += (0 - n.wy) * .001 * k;
      var d = Math.pow(.9, k);
      n.vx *= d;  n.vy *= d;
      n.wx += n.vx * 3 * k;
      n.wy += n.vy * 3 * k;
      n.wx *= d;  n.wy *= d;
      n.mx = n.wx * .1;  n.my = n.wy * .1;
      var ox = easeOut(n.dx / diag), oy = easeOut(n.dy / diag);
      n.ox = ox * S.gapX * 75 * (n.dist / S.ctaMaxSize);
      n.oy = oy * S.gapY * 75 * (n.dist / S.ctaMaxSize);
    }
  }
}

function movedPoint(t){ return { x: t.x + t.mx + t.ox * WAVE.op, y: t.y + t.my + t.oy * WAVE.op }; }

function drawLines(){
  var d = "", k, q;
  for (var ci = 0; ci < S.pts.length; ci++){            /* 竖线 */
    var col = S.pts[ci];
    for (k = 0; k < col.length; k++){
      q = movedPoint(col[k]);
      d += (k === 0 ? "M " : "L ") + q.x.toFixed(1) + " " + q.y.toFixed(1) + " ";
    }
  }
  for (var i = 0; i < S.hLines; i++)                     /* 横线 */
    for (k = 0; k < S.pts.length; k++){
      q = movedPoint(S.pts[k][i]);
      d += (k === 0 ? "M " : "L ") + q.x.toFixed(1) + " " + q.y.toFixed(1) + " ";
    }
  gp.setAttribute("d", d);
}

/* ══ 圆里 "GO" 的呼吸 + 每轮触发一次波动 ══════════════════════════
   原片用 GSAP：fromTo(scale .85→1.05, 2.7s, power2.in) → call(wavePulse) →
   to(scale .85, .15s, power4.out)，repeat:-1 repeatDelay:.5 ⇒ 一轮 3.35s */
var T0 = 0;
var noAuto = false;          /* 探针/出图用：临时掐掉自动波动，好拍"干净窗口" */
function pulse(now){
  if (!T0) T0 = now;
  var t = (now - T0) % 3350, sc;
  if (t < 2700) sc = .85 + .20 * Math.pow(t/2700, 2);                    /* power2.in */
  else {
    /* 将 u 夹在 [0,1]，防止 .15s 缩放结束后四次方继续增大并覆盖另一渠道。 */
    var u = Math.min(1, (t - 2700) / 150);
    sc = 1.05 - .20 * (1 - Math.pow(1 - u, 4));                          /* power4.out */
    if (!pulse.fired && !openCh && !noAuto) wavePulse();
  }
  pulse.fired = t >= 2700;
  /* 呼吸只给没展开的那个圆。展开那盘的缩放由 CSS 管（`.dot.on .goTx{scale:2}`），
     这里是 `transform` —— 两个是独立属性、互不覆盖，所以可以各管各的。 */
  CHANNELS.forEach(function(ch){
    goTxOf(ch.key).style.transform =
      (openCh === ch.key) ? "" : "scale(" + sc.toFixed(4) + ")";
  });
}
pulse.fired = false;

function wavePulse(){ WAVE.progress = 0; WAVE.state = "pulse"; WAVE.speed = P.wspeed; WAVE.strength = P.wstr; }
function waveShock(){ WAVE.progress = 0; WAVE.state = "shock"; WAVE.speed = P.wspeed*2; WAVE.strength = P.wstr*5; }

/* 悬停或点击均展开，指针离开收起；openCh 存渠道 key，null 表示全关。 */
var openCh = null, opTween = null;

function expoInOut(p){
  if (p <= 0 || p >= 1) return p;
  return p < .5 ? Math.pow(2, 20*p - 10) / 2 : (2 - Math.pow(2, -20*p + 10)) / 2;
}
function tweenOp(to, dur){
  if (opTween) cancelAnimationFrame(opTween);
  var from = WAVE.op, t0 = 0;
  opTween = requestAnimationFrame(function stepOp(now){
    /* 动画起点使用首帧 rAF 时间戳，避免 performance.now() 较晚导致首帧进度为负。 */
    if (!t0) t0 = now;
    var p = Math.min(1, (now - t0) / dur);
    WAVE.op = from + (to - from) * expoInOut(p);
    opTween = (p < 1) ? requestAnimationFrame(stepOp) : null;
  });
}
/* `key` = 要开的那一盘；`null` = 都收着。 */
function setOpen(key){
  if (key === openCh) return;
  openCh = key;
  /* disc-open 统一在 setOpen() 更新，同时控制小圆透明、中央标记让位和探针状态。 */
  document.body.classList.toggle("disc-open", !!key);
  CHANNELS.forEach(function(ch){
    dotOf(ch.key).classList.toggle("on", ch.key === key);
  });
  if (key){
    /* 点开哪一盘，底部那个号就现出来。圆里的链接不算数 —— 它是 DOM 图形，选不中、
       Ctrl+F 搜不到；底部那份才是真文本。 */
    reveal(key);
    setTimeout(function(){ if (openCh === key) waveShock(); }, 600);
    tweenOp(1, 1200);
  } else {
    tweenOp(0, 700);
  }
}

CHANNELS.forEach(function(ch){
  var d = dotOf(ch.key);
  d.addEventListener("mouseenter", function(){ setOpen(ch.key); });
  /* 必须判 `openCh === ch.key` 才收：鼠标从 V 划到 Q 时，V 的 mouseleave 可能排在
     Q 的 mouseenter 之后 —— 不判的话刚开的 Q 会被 V 的离开顺手关掉。 */
  d.addEventListener("mouseleave", function(){ if (openCh === ch.key) setOpen(null); });
  d.addEventListener("click", function(e){
    e.stopPropagation(); setOpen(openCh === ch.key ? null : ch.key);
  });
  /* 触屏：touchstart 里 mouseenter 不会来，得自己开 */
  d.addEventListener("touchstart", function(e){ e.stopPropagation(); setOpen(ch.key); }, {passive:true});
});

/* 账号文本从初始化起保留在 DOM，展开仅改变视觉透明度。 */
var shown = {};
function reveal(key){
  if (shown[key]) return;
  shown[key] = true;
  var t = fbOf(key);
  if (REDUCE) t.style.transition = "none";   /* `?reduce=1` 是 JS 变量，踩不到 CSS 那条 media */
  t.classList.add("on");
}
function doCopy(text, btn){
  /* 只变色、不改文本 —— 底部那个号本身就是内容（"微信：sc15…"），换成"已复制"
     等于把号擦掉了。 */
  function ok(){ if(!btn) return; btn.classList.add("done");
    setTimeout(function(){ btn.classList.remove("done"); }, 1300); }
  function fallback(){
    /* file:// / iframe 里 navigator.clipboard 可能不给用，退回老办法；
       再不行就把值选中让人自己 Ctrl+C —— 反正它是真文本。 */
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly","");
    ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    var done = false;
    try { done = document.execCommand("copy"); } catch(e){ done = false; }
    document.body.removeChild(ta);
    if (!done){
      var el = btn || document.querySelector(".fbTx.on"), sel = getSelection();
      if (el && sel){ sel.removeAllRanges(); var rg = document.createRange();
                      rg.selectNodeContents(el); sel.addRange(rg); }
    }
    ok();
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, fallback);
  } else fallback();
}

/* Esc 先收起圆盘，再请求退出；本地键盘与父页 well-esc 共用 onEsc()。 */
function onEsc(){ if (openCh) setOpen(null); else wellSay("well-exit"); }
addEventListener("keydown", function(e){ if (e.key === "Escape") onEsc(); });

/* ── 每帧 ───────────────────────────────────────────────────────── */
var T = 0, last = 0;
function step(dt){
  T += dt;
  if (REDUCE) return;
  if (WAVE.state === "paused") return;
  WAVE.progress += WAVE.speed * (dt / (1/60));
  /* 扫到头就把状态钉死成 paused —— 与其靠"progress 够不够大"间接判断，
     不如让"这一发结束了"成为一件明确的事。movePoints 认的就是这个状态。 */
  if (WAVE.progress >= S.reach){ WAVE.progress = S.reach; WAVE.state = "paused"; }
}
function frame(now){
  var dt = last ? Math.min(0.05, (now - last) / 1000) : 1/60;
  last = now;
  step(dt);
  movePoints(dt / (1/60));
  if (REDUCE) WAVE.op = openCh ? 1 : 0;
  drawLines();
  pulse(now);
  if (Q.get("probe") !== null){
    hud.textContent =
      "open  " + (openCh || "-") + "\nwave  " + WAVE.progress.toFixed(0) + " / " + WAVE.state +
      "\nop    " + WAVE.op.toFixed(3) +
      "\nopts  " + (typeof OffscreenCanvas !== "undefined" ? "-" : "-") +
      "\ngot   " + Object.keys(shown).join(",") +
      "\ngrid  " + S.vLines + " x " + S.hLines + "  gap " + S.gapX.toFixed(0) + "x" + S.gapY.toFixed(1) +
      "\nd     " + gp.getAttribute("d").length + " chars" +
      "\nT     " + T.toFixed(2);
  }
  raf = requestAnimationFrame(frame);
}

/* 探针从接口读取实际矩形作为点击坐标，不在脚本内复制布局公式。 */
window.__contactProbe = {
  /* 两个读数都要：`open` 是布尔判据（"有没有盘开着"），`openCh` 才是"开的是哪一盘"
      —— 两盘长得一模一样，只看布尔分不出开错了哪盘。 */
  get open(){ return !!openCh; },
  get openCh(){ return openCh; },
  get shown(){ return Object.keys(shown); },
  get collected(){ return Object.keys(shown); },   /* 旧名，向后兼容 */
  /* gate/running 与两次采样的 t 共同验证冻结，避免仅依赖状态标志。 */
  get gate(){ return GATE; },
  get running(){ return raf > 0; },
  get t(){ return +T.toFixed(3); },
  get grid(){ return { W:S.W, H:S.H, vLines:S.vLines, gapX:+S.gapX.toFixed(2), gapY:+S.gapY.toFixed(2),
                       hLines:S.hLines, cx:+S.cx.toFixed(1), cy:+S.cy.toFixed(1), cols:S.pts.length }; },
  get wave(){ return { progress:+WAVE.progress.toFixed(1), op:+WAVE.op.toFixed(3),
                       speed:WAVE.speed, strength:WAVE.strength, state:WAVE.state }; },
  /* 不过 toFixed 的原始读数：`wave.op` 是三位小数，0.0004 会读成 0 —— 排查"网格
     为什么不是直的"时，四位和三位小数的区别就是"看不见"和"看得见"。 */
  get opRaw(){ return WAVE.op; },
  /* 统计全网格最大位置偏差，同时覆盖 x/y；op=0 且余波结束后应趋近 0。 */
  maxDev: function(){
    var m0 = 0;
    for (var ci = 0; ci < S.pts.length; ci++)
      for (var ai = 0; ai < S.pts[ci].length; ai++){
        var p = S.pts[ci][ai], m = movedPoint(p);
        var d = Math.hypot(m.x - p.x, m.y - p.y);
        if (d > m0) m0 = d;
      }
    return +m0.toFixed(2);
  },
  /* 一个控制点的实际坐标。op=0 且余波衰减完时，第 n 列第 a 行必须精确等于
     (gapX*n, gapY*a)。 */
  ptAt: function(ci, ai){
    var p = S.pts[ci] && S.pts[ci][ai]; if (!p) return null;
    var m = movedPoint(p);
    return { x:+m.x.toFixed(2), y:+m.y.toFixed(2),
             wantX:+(S.gapX*ci).toFixed(2),
             wantY:+(S.gapY*ai + (ai !== 0 ? S.H - S.gapY*S.hLines : 0)).toFixed(2),
             mx:+p.mx.toFixed(3), my:+p.my.toFixed(3), op:+WAVE.op.toFixed(4) };
  },
  get dLen(){ return gp.getAttribute("d").length; },
  get discSize(){ return S.ctaMaxSize; },
  /* 返回小圆、大圆、链接和账号的真实 getBoundingClientRect；ci=0 微信，1 QQ。 */
  pixRect: function(ci){ var r = dotOf(CHANNELS[ci||0].key).getBoundingClientRect();
    return [Math.round(r.left + r.width/2), Math.round(r.top + r.height/2), Math.round(r.width/2)]; },
  discRect: function(ci){ var r = discOf(CHANNELS[ci||0].key).getBoundingClientRect();
    return [Math.round(r.left + r.width/2), Math.round(r.top + r.height/2), Math.round(r.width/2)]; },
  linkRect: function(ci){
    var a = discOf(CHANNELS[ci||0].key).querySelector(".links").children[0]; if (!a) return null;
    var r = a.getBoundingClientRect();
    return [Math.round(r.left + r.width/2), Math.round(r.top + r.height/2),
            Math.round(r.width), Math.round(r.height)];
  },
  href: function(ci){
    var a = discOf(CHANNELS[ci||0].key).querySelector(".links").children[0];
    return a ? a.textContent : null;
  },
  /* 账号探针同时返回矩形与 computed opacity，区分 .on 已设置和 .45s 过渡完成。 */
  footRect: function(ci){
    var t = fbOf(CHANNELS[ci||0].key), r = t.getBoundingClientRect();
    return [Math.round(r.left + r.width/2), Math.round(r.top + r.height/2),
            Math.round(r.width), Math.round(r.height)];
  },
  footOp: function(ci){
    var t = fbOf(CHANNELS[ci||0].key);
    return +parseFloat(getComputedStyle(t).opacity).toFixed(3);
  },
  footText: function(ci){ return fbOf(CHANNELS[ci||0].key).textContent; },
  /* snap() 复用 setOpen() 固定展开终态，缺省选择第一渠道。 */
  snap: function(key){ setOpen(key || CHANNELS[0].key); WAVE.op = 1; return this.grid; },
  shut: function(){ setOpen(null); WAVE.op = 0; return true; },
  setWave: function(o){ for (var k in o) WAVE[k] = o[k]; return this.wave; },
  /* 关闭每 3.35s 的自动波动以便稳定截图；手动 pulse()/shock() 仍可用。 */
  setAuto: function(on){ noAuto = !on; return noAuto; },
  pulse: wavePulse, shock: waveShock,
  step: function(dt){ step(dt); movePoints(dt/(1/60)); drawLines(); return true; },
  geom: function(){ return { pix:this.pixRect(), disc:this.discRect(),
                             size:S.ctaMaxSize, pal:palName }; }
};

/* 消息约定：well-hello 报到、well-go 解闸、well-esc 退出键、well-exit 请求返回。
   按 what 识别；parent===window 时不向自身发消息。 */
function wellSay(what){
  if (window.parent && window.parent !== window)
    window.parent.postMessage({ what: what }, "*");
}

/* ── 初始化 ─────────────────────────────────────────────────────── */
var raf = 0;

function resized(){
  setSize(); setGrid(); drawLines();
  /* 圆的大小变了，`--size` 跟着变，但小圆的尺寸是 CSS 死的 6rem —— 不冲突。
     这里只重画网格：pts 整个换掉了，不重画就是一张旧网格挂在新尺寸上。 */
}
addEventListener("resize", resized);

resized();

/* ?open=wechat|qq|1 初始化到展开终态；其他非 0/false 真值兼容为第一渠道。 */
(function(){
  var a = Q.get("open");
  if (a === null || a === "0" || a === "false") return;
  setOpen(a === "qq" ? "qq" : "wechat"); WAVE.op = 1;
})();

/* ?gate=1 不启动 rAF，冻结波动、呼吸和展开缓动。
   resized() 仍先绘制静态网格与小圆，收到 well-go 后再启动。 */
var GATE = Q.has("gate");
if (REDUCE){
  /* 减少动态：两个号直接在底部摆出来（无过渡），网格画好摆着不动 */
  CHANNELS.forEach(function(ch){ reveal(ch.key); });
} else if (!GATE){
  raf = requestAnimationFrame(frame);
}

addEventListener("message", function(e){
  var d = e.data;
  if (!d || typeof d !== "object") return;
  if (d.what === "well-go"){
    /* well-go 启动时钟；raf 已存在时不再排程，避免重复循环。 */
    if (GATE){ GATE = false; if (!REDUCE && !raf) raf = requestAnimationFrame(frame); }
  }
  else if (d.what === "well-esc"){ onEsc(); }
});

/* 出口只在 iframe 里露出来 —— 单独打开样张时没东西可退。 */
if (window.parent && window.parent !== window){
  var exitEl = document.getElementById("exit");
  exitEl.style.display = "inline-flex";
  exitEl.addEventListener("click", function(){ wellSay("well-exit"); });
}

/* 双 rAF 再报到：等第一帧真画完。父页在黑幕落下的同一刻就填了 src，早报会被
   当成"已经就绪"。 */
requestAnimationFrame(function(){ requestAnimationFrame(function(){
  wellSay("well-hello");
}); });

addEventListener("pagehide", function(){ cancelAnimationFrame(raf); });
})();
</script>
</body>
</html>
