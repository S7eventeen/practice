<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文字墙 · 样张（准备用在小镇）</title>
<style>
  /* background 是兜底值（= C.bg 的默认）。真实值在 JS 里按 `?bg=` 设，JS 会在启动
     时把这一层也同步过去。两处不一致时以 JS 为准。 */
  html,body{margin:0;height:100%;background:#160000;overflow:hidden;
            font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  #cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #cv.drag{cursor:grabbing}
  /* 默认不显示（`display:none`）—— 读数是给开发和探针看的，不是页面内容。
     `?probe` 才开，和 `town.html` / `street.html` / `break.html` 同一条约定。
     这一批样张页原来一直挂着它，现在一个个在往正页里接，所以默认关掉。 */
  #hud{position:fixed;left:10px;bottom:10px;color:#8FA3B8;
       font:12px/1.45 ui-monospace,Consolas,monospace;background:#0B1017cc;
       padding:6px 9px;border-radius:6px;white-space:pre;pointer-events:none;
       display:none}

  /* 左上退出键仅在 iframe 内显示，提供鼠标和触屏返回入口；HUD 位于左下。 */
  /* 颜色不再照抄 desk 的蓝灰（原来是 `#8fb6c9` / `#1c2f3d`）。本页换成黑底红字那
     一套（见下面 C 表）—— 一个蓝灰小方块坐在黑底上，是整个画面里唯一的冷色，一眼
     就是个外来户。改成同一族的暗红，它才像这面墙自带的。
     （兄弟场景仍是蓝灰，所以这是本页自己的偏差，不是三处一起改。） */
  /* Select 小长键语汇：只用本页红/黑，不引入浮层面板或手柄装饰。 */
  #exit{position:fixed;left:16px;top:14px;z-index:9;min-width:68px;min-height:40px;
        display:none;align-items:center;justify-content:center;gap:7px;
        font:11px/1 ui-monospace,Consolas,monospace;letter-spacing:.08em;
        color:#e8b9c4;background:transparent;border:1px solid transparent;
        border-radius:2px;padding:0 8px;cursor:pointer;
        transition:color .15s,border-color .15s}
  #exit::before{content:"";width:15px;height:5px;border:1px solid currentColor;border-radius:3px}
  #exit:hover{color:#ffdfe6;border-color:#8a2440}
  #exit:focus-visible{outline:2px solid #ffdfe6;outline-offset:3px}
  #exit:active::before{background:currentColor}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="exit" type="button" aria-label="退出游戏厅">退出</button>
<div id="hud"></div>
<script>
"use strict";
/* 探针规矩：出图脚本一律先挂 window.__errs。这里自己也挂一份。 */
window.__errs = [];
addEventListener("error", function(e){ window.__errs.push(String(e.message)); });

var Q = new URLSearchParams(location.search);

/* 黑底红字取自首页红/墨配色反态。bg 为画布，panel 为展开面板，两者独立。
   默认同色，墙边界由 line 描边；?bg/?panel 可分别覆盖。 */
var C = {
  bg:    Q.get("bg")    || "#160000",
  panel: Q.get("panel") || "#160000",
  warm:"#FFC95F", glow:"#FFBE63", snow:"#F2F7FC",
  stone:"#9FAFC0",
  /* 面板那圈 1px 细框（`P.glow>0` 那条，起始 p 很小时画）。
     它经历过三种能见度：深墨蓝面板上几乎看不见 → 柠黄面板上是一条明确的深色轮廓
     → 现在黑面板上，它是唯一交代"墙有个边界"的东西。所以不能再是深色（压在黑底上
     = 看不见），改成半透明的红。`?line=%23160000` 就等于不画（涂成和底一样）。 */
  line:  Q.get("line")  || "rgba(244,12,63,.30)",

  /* 入场层：平直的暖灰外框 + 米白手柄，红色只落在两个操作键。
     padHi 保留 query 契约，但现在只给连接线用，不再是机身高光。 */
  screen: Q.get("screen") || "#0A0000",
  bezel:  Q.get("bezel")  || "#756C69",
  pad:    Q.get("pad")    || "#E5DDD1",
  padHi:  Q.get("padHi")  || "#756C69",
  dpad:   Q.get("dpad")   || "#211A19",
  key:    Q.get("key")    || "#F40C3F"
};

/* html/body 的底色跟着 C.bg 走。CSS 里那个值只是"JS 没跑起来"时的兜底 ——
   canvas 是 100%×100% 铺满的，正常看不见它，但 resize 那一帧、以及第一帧
   画出来之前，露出来的就是它（不跟就会闪一下深色）。 */
document.documentElement.style.background = C.bg;
document.body.style.background = C.bg;

/* 每个参数都必须走 num()，不能写 `parseFloat(Q.get(k)) || 默认`。
   那个写法静默地把 0 吃掉：`parseFloat("0") || 0.32` 得 0.32。于是 `?glow=0`
   关不掉辉光，`curl=0`、`fsh=0` 同理，全是"设了没用"。 */
function num(k, def){
  var v = Q.get(k);
  if (v === null || v === "") return def;
  var x = parseFloat(v);
  return isFinite(x) ? x : def;
}
var P = {
  /* 接进小镇的游戏厅，词是 GAME。恰好也是 4 个字母 —— `rows = word.length`
     （217/326 行），所以行数、行距、`block/ph` 那些几何量一个都不用重调。
     换个长度的词就得重看一遍。 */
  word:  Q.get("word")  || "GAME",
  track: num("track", 1.15),    // 字距，相对字宽（决定"占空比"）
  persp: num("persp", 900),     // 透视距离（px）
  lean:  num("lean",  0.24),    // 每个字按弧位额外倾斜
  fsh:   num("fsh",   0.15),    // 横向缩短掺多少（1=全量 cosφ）
  curl:  num("curl",  1.0),     // 曲率总开关，0=纯平
  fill:  num("fill",  0.92),    // 字的墨迹高 / 行距
  squeeze: num("sq",  0.67),    // 合成窄体：横向压到几成
  /* 入场先推近屏幕 P.ip，再按 hold/dur 停顿和展开。 */
  ip:    num("ip",    0.55),    // 推近屏幕（秒）
  hold:  num("hold",  0.85),    // 推完之后，墙在胶囊上先停多久（秒）
  dur:   num("dur",   0.75),    // 展开时长（秒）
  /* 单位换过了：原来是"字/秒"，现在是屏幕像素/秒。旧单位在曲面上根本说不清 ——
     四行的字宽不同（advR 差 1.33×），同一个"字/秒"在四行上是四个不同的速度；
     而拖动和惯性天生就是像素。 */
  drift: num("drift", 20),      // 不碰鼠标时的低速左移
  vsp:   num("vsp",   0.10),    // 上下两行比中间快多少（相对）—— 见 rateOf()
  /* 不按键、只横扫鼠标时带墙的力度。0.08 太弱 —— 鼠标横扫一下墙只走 11px，还不到
     自动左移半秒的量，跟"转动主要是因为鼠标移动"这句对不上。 */
  /* 鼠标横扫带墙转的那一份。默认关（0）—— 墙的转动该由"抓着它拖"来驱动，鼠标只是
     从上面路过不算交互，而且它和自动左移叠在一起，手一抖墙就飘。
     参数留着不删：`?mv=0.35` 能把它放回来对照。 */
  mv:    num("mv",    0),
  fric:  num("fric",  3.2),     // 松手后惯性的衰减（1/s）
  res:   num("res",   1),       // 墙上贴的游戏图（0=关）—— 见 PHOTOS 那段
  /* 卡片名义高度为 rowH 的 .90 倍，与行距和 capH 比例匹配；?cardh= 可覆盖。 */
  cardh: num("cardh", 0.90),
  /* 宽高比超过 capw 时按 hf=arS/ar 同时缩小高度，保持图像比例；capw=0 关闭限制。 */
  capw:  num("capw",  2.0),
  /* 竖条数。canvas 只有仿射没有单应，整张贴进弧面会歪，所以切条。
     切几条是看出来的：6 条时每条内部的 k 变化 <1%。`?strip=` 可以现场比。 */
  strip: num("strip", 6),
  /* 字色为首页红 #F40C3F，辉光使用 lighter 加法混合。
       ?ink/?inkglow/?glow 可分别调整，深底下需检查笔画是否过度融合。 */
  ink:     Q.get("ink")     || "#F40C3F",
  inkGlow: Q.get("inkglow") || "#8E0725",
  glow:  num("glow",  0.32),    // 辉光强度（0=关）
  fg: Math.max(1, Math.round(num("fg", 8))), // 首末行每 N 列压在图片前，?fg=6/8
  gblur: num("gblur", 4)        // 辉光模糊半径（px）
};
var FONT = Q.get("font") ||
  '"Bahnschrift SemiBold Condensed","Bahnschrift Condensed","Arial Narrow",' +
  'Impact,"Arial Black",sans-serif';

/* 确定性：截图要能逐个字节复现。这个样张其实没用随机数，
   但保留签名，免得以后加"每行错峰"时忘了这回事。 */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
var rnd = mulberry32(20261006);

/* ── 画布 / DPR ──────────────────────────────────────────────────── */
var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
var W = 0, H = 0, DPR = 1;
/* 辉光走离屏低分辨率再放大贴回来：逐个 fillText 开 shadowBlur 的话一百多个字
   每帧都算一次模糊，60fps 直接崩。降到 1/3 分辨率画一遍、放大时本来就糊，
   再补一点点 blur 就够。 */
var gcv = document.createElement("canvas"), gx = gcv.getContext("2d");
/* 倍数不能再低了。1/3 分辨率下笔画只剩七八像素，模糊完一放大整片糊开，把字与字
   之间的缝也点亮了 —— 而那四条缝正是"这是四条独立带子"的证据，糊掉之后整面墙
   读成一块。 */
var GSC = 2;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width  = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  gcv.width  = Math.max(1, Math.round(W * DPR / GSC));
  gcv.height = Math.max(1, Math.round(H * DPR / GSC));
}
addEventListener("resize", resize);

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeInOut(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

/* ── 形状 ────────────────────────────────────────────────────────── */
function roundRect(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.arcTo(x+w,y,x+w,y+r,r);
  g.lineTo(x+w,y+h-r); g.arcTo(x+w,y+h,x+w-r,y+h,r);
  g.lineTo(x+r,y+h); g.arcTo(x,y+h,x,y+h-r,r);
  g.lineTo(x,y+r); g.arcTo(x,y,x+r,y,r);
  g.closePath();
}

/* ── 时间轴 ──────────────────────────────────────────────────────── */
/* T0 初始 null，停在手柄态；replay() 设置起点后才运行入场。 */
var T0 = null;                   // 入场起点；null = 还停在手柄态
var PIN_Q = Q.get("t") !== null ? parseFloat(Q.get("t"))/1000 : null;  // ?t=毫秒
/* ?gate=1 通过 PIN 冻结入场和滚动，well-go 解闸。显式 ?t= 优先于 gate。 */
var GATE = Q.has("gate") && PIN_Q === null;
var PIN = GATE ? 0 : PIN_Q;
/* armed 仅控制是否接受手柄点击：单独打开默认 true，iframe 等待 well-go。 */
var armed = (window.parent === window);
var REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* q 为推近进度，p 为墙展开进度，共用一条钟。
   gu 使用统一 u 单位累积四行滚动，屏幕像素仅在 addWallPx() 换算。 */
var T = { q:0, p:0, gu:0, iu:0 }; // gu 只自动；iu 是整排图片共同的水平 phase

/* 展开采用先 hold 再 dur 的三次缓动，前接 P.ip 推近阶段。
   定格总时间需计入 ip，当前完整入场约 2.15 秒。 */
function setT(t){                 // t = 入场开始后过了几秒
  if (GATE){ T.q = 0; T.p = 0; return; }
  T.q = REDUCE ? 1 : easeInOut(clamp(t / P.ip, 0, 1));
  var x = REDUCE ? 1 : clamp((t - P.ip - P.hold) / P.dur, 0, 1);
  T.p = easeInOut(x);
  /* 滚动（T.gu）不在这里算。原来它是 t 的纯函数（时间 × 速度），
     但墙现在要能被鼠标抓住 —— 抓一下就断开了"时间→位置"这个关系。见 stepWall()。 */
}

/* 墙模拟从内侧观看竖轴弧面：中心远、两端近，字高与行距共用投影 k。
   面板展开主要增加可见宽度，字母保持正立；横向 fsh 仅轻微补偿，避免过度压扁边缘。 */
var LAY = { pw:0, ph:0, rowH:0, block:0, fs:0, adv:0, advR:[], inkW:[], capH:0,
            inkH:0, cx:0, cy:0, half:0, du:0, bow:0, k0:1, comp:1,
            iMax:2, iMaxMax:2 };
var CAPR = null;                  // 字体的 cap height / 字号，只量一次

function capRatio(){
  if (CAPR === null){
    ctx.font = "700 100px " + FONT;
    var m = ctx.measureText("H");
    CAPR = (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) / 100;
    if (!isFinite(CAPR) || CAPR < 0.2) CAPR = 0.70;   // 字体没加载时的兜底
  }
  return CAPR;
}

function layout(){
  var e = T.p;
  /* 面板：窄竖条 → 满屏。起始那两个数是参考帧量的：胶囊 142/1280 = 0.111
     屏宽、503/720 = 0.70 屏高。 */
  LAY.pw = REDUCE ? W : lerp(W*0.11, W, e);
  LAY.ph = lerp(H*0.70, H*1.00, e);
  LAY.cx = W/2; LAY.cy = H/2;
  LAY.half = LAY.pw/2;

  /* 面板高度与字母块高度分开；按块高=(行数−1)×行距+cap 高反解行距。 */
  var rows = Math.max(1, P.word.length);
  LAY.block = LAY.ph * lerp(0.760, 0.708, e);
  LAY.rowH  = LAY.block / Math.max(0.5, (rows - 1) + P.fill);

  /* 字号由实际 cap 墨高反推；目标墨高约为行距 .94 倍，保留行间细缝。 */
  var cr = capRatio();
  LAY.capH = LAY.rowH * P.fill;
  LAY.fs = LAY.capH / cr;

  ctx.font = "700 " + LAY.fs.toFixed(1) + "px " + FONT;
  var m = ctx.measureText("W");
  /* 自检：把量到的墨迹高回填到 HUD。目标是 LAY.capH，这两个数对不上就说明
     capRatio() 量的字体和真正渲染的不是同一个（字体没就绪、或者 font 串被解析器
     丢了），字号就是错的 —— 这个错很难用眼睛发现，因为"字大了一点"看起来永远像
     "参数没调好"。 */
  LAY.inkH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;

  /* 各行按自身 advance 计算字距，使 W/O 等不同宽度自然错位。
       合成窄体同时缩字形与字距，保持比例。 */
  LAY.advR = []; LAY.inkW = [];
  var widest = 0;
  for (var r = 0; r < rows; r++){
    var mr = ctx.measureText(P.word.charAt(r));
    LAY.inkW.push(mr.actualBoundingBoxRight + mr.actualBoundingBoxLeft);   // 墨迹宽
    LAY.advR.push(Math.max(1, mr.width) * P.squeeze * (1 + P.track));
    widest = Math.max(widest, LAY.advR[r]);
  }
  LAY.adv = LAY.advR[0];                          // HUD 用
  LAY.du  = LAY.adv / LAY.half;                   // 一个字占多少个 u
  LAY.iMaxMax = Math.ceil(1 / (Math.min.apply(null, LAY.advR) / LAY.half)) + 2;

  /* 凹深按半宽的比例给：面板一变宽弧就自动配平。比例随展开而变小 —— 参考帧 67.3
     （半宽）弧度夸张，67.6（满宽）平掉不少。终态 k0 = P/(P+0.42·half)，取 P=900、
     half=720 得 0.749，正落在参考帧的 0.73~0.78 里。 */
  LAY.bow = LAY.half * lerp(0.95, 0.50, e) * P.curl;
  LAY.k0 = P.persp / (P.persp + LAY.bow);
  LAY.comp = 1 / Math.max(0.05, LAY.k0);          // 中段被透视缩掉了，补回名义尺寸
  LAY.iMax = LAY.iMaxMax;
}

/* 推近阶段独立绘制黑屏与手柄，共用 introBox/padRect；
   宽度随视口连续插值，竖屏保留足够点击尺寸。 */
function introBox(){
  var S = Math.min(W, H*1.6);
  var narrow = clamp((760 - W)/360, 0, 1);
  var sw = S*lerp(0.44, 0.78, narrow), sh = sw*0.75;
  var gw = S*lerp(0.30, 0.64, narrow), gh = gw*0.38;
  var gap = S*lerp(0.055, 0.09, narrow);
  var top = Math.max(H*0.06, (H - (sh+gap+gh))/2 - H*0.04);
  return {
    S: S, sw: sw, sh: sh, gw: gw, gh: gh, gap: gap,
    scy: top + sh/2,                        // 屏幕中心 y
    pcy: top + sh + gap + gh/2,             // 手柄中心 y
    /* 取 max 不是 min。4:3 的屏要铺满 16:9 的视口，必须上下溢出（被裁掉）—— 那是
       故意的：镜头推进屏幕里，就不该还看得见屏幕的边。取 min 的话 q=1 那一帧屏幕
       盖不满视口，四边各露一条底色的缝，而这条缝只在"推到底"那一瞬间存在。 */
    scMax: Math.max(W/sw, H/sh)
  };
}
/* 手柄当前的屏幕矩形。入场的两个坐标（画和判定命中）都从这里来 ——
   两边各写一份的话，改了拖动幅度就会出现"看得见但点不着"。 */
function padRect(){
  var B = introBox();
  var dy = H*0.08*T.q;                      // 往下飘一点，读成"镜头在往上推"
  return { x: W/2 - B.gw/2, y: B.pcy + dy - B.gh/2, w: B.gw, h: B.gh };
}

function intro(g, q){
  var B = introBox(), S = B.S;
  var s  = lerp(1, B.scMax, q);
  var cy = lerp(B.scy, H/2, q);
  var sw = B.sw*s, sh = B.sh*s;
  var x0 = W/2 - sw/2, y0 = cy - sh/2;
  var bez = Math.max(6, B.sw*0.027);

  /* 外框和电源灯在 q∈[0.45,0.80] 之间淡完。不能拖到最后 —— q=1 那一帧手换到墙
     那条路，两边得无缝接上（屏幕和底色都是近黑，跳过不画也不跳变）。 */
  var ia = 1 - clamp((q - 0.45)/0.35, 0, 1);
  /* 手柄淡得更早。它是前景，镜头一往前走就该先出画；和外框同一条时间的话，
     屏幕都推到眼前了手柄还挂在那儿，像贴纸。 */
  var pa = 1 - clamp((q - 0.30)/0.32, 0, 1);

  /* 硬朗的等宽外框，没有玻璃反光或额外电源灯。
     外框按原时序淡出，黑屏保持不透明，仍是镜头推进的落点。 */
  roundRect(g, x0-bez, y0-bez, sw+bez*2, sh+bez*2, Math.max(2, B.sw*0.006));
  g.fillStyle = C.bezel; g.globalAlpha = ia; g.fill();
  roundRect(g, x0, y0, sw, sh, Math.max(1, B.sw*0.002));
  g.globalAlpha = 1;
  g.fillStyle = C.screen; g.fill();

  if (pa > 0.01){
    var R = padRect(), px = R.x, py = R.y, gw = R.w, gh = R.h;
    g.globalAlpha = pa;

    /* 顶边中线 → 屏幕底边中线的那根线。它才是把两件东西绑成"一套设备"的唯一线索 ——
       少了它，黑屏和手柄就是两个不相干的图形摆在一起。
       屏幕底边跟着推近往下跑，追上柄的时候线要自己消失：不判的话终点跑到起点上面去
       了，画出来是一根倒着长的线，半透明期间很显眼。 */
    if (cy + sh/2 < py - 4){
      g.beginPath();
      g.moveTo(px + gw/2, py);
      g.quadraticCurveTo(px + gw/2, (py + cy + sh/2)/2, W/2, cy + sh/2);
      g.strokeStyle = C.padHi; g.lineWidth = Math.max(1, S*0.0035); g.stroke();
    }

    /* 米白单块机身，小圆角。画与命中仍完全共用 padRect。 */
    roundRect(g, px, py, gw, gh, gh*0.045);
    g.fillStyle = C.pad; g.fill();

    /* 十字键：两矩形叠出来的十字，外扩 12px 的命中判定包得住它。
       位置在左边 —— 红白机的手感一半来自这个不对称构图。 */
    var dcx = px + gw*0.22, dcy = py + gh*0.50;
    var da = gh*0.46, db = gh*0.26;
    g.fillStyle = C.dpad;
    g.fillRect(dcx - da/2, dcy - db/2, da, db);
    g.fillRect(dcx - db/2, dcy - da/2, db, da);

    /* 两个红圆键：画面上唯一的饱和色（`C.key`）。同高并排，红白机就这样。 */
    var br = Math.max(2, gh*0.17);
    g.fillStyle = C.key;
    [0.66, 0.82].forEach(function(fx){
      g.beginPath(); g.arc(px + gw*fx, py + gh*0.50, br, 0, 6.2832); g.fill();
    });

    /* Start / Select：中间偏下的两颗深色小长条，和十字键同色。 */
    g.fillStyle = C.dpad;
    [0.44, 0.56].forEach(function(fx){
      roundRect(g, px + gw*fx - gw*0.025, py + gh*0.68, gw*0.05, gh*0.14, gh*0.05);
      g.fill();
    });

    g.globalAlpha = 1;
  }

  /* 收口：屏幕色 `C.screen`(.0A0000) 和墙的底色 `C.bg`(.160000) 差 12 级红，在暗
     环境里那一级跳变看得见（"画面闪了一下"）。这里用 alpha 把屏幕染成底色，q 走到
     1 时正好同色 ⇒ 换到墙那条路完全无缝，不是靠"两个颜色碰巧像"。 */
  if (q > 0.55){
    g.globalAlpha = clamp((q - 0.55)/0.40, 0, 1);
    g.fillStyle = C.bg; g.fillRect(0,0,W,H);
    g.globalAlpha = 1;
  }
}

/* ── 画 ──────────────────────────────────────────────────────────── */
function draw(){
  nVis = 0; INSTANCES = []; // 入场、res=0 时也不能遗留上一帧的可见数
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);

  /* 分叉。`q < 1` 时画的是入场层，墙一个字都不画 —— 包括面板、辉光、字、资源，
     整段跳过。`q` 走到 1 才交给下面那条老路，而那之前 intro() 已经把画面染成
     `C.bg` 了，两边接得上。 */
  if (T.q < 1){ intro(ctx, T.q); return; }

  var pw = LAY.pw, ph = LAY.ph;
  var x0 = LAY.cx - pw/2, y0 = LAY.cy - ph/2;

  /* 圆角：起始是胶囊（半径=半宽），终态近方角。
     半径必须自己插值，不能写 min(pw,ph)/2 —— 那样满宽时会被算成 300+，
     整面墙变成一个大药丸。 */
  var rad = lerp(Math.min(pw,ph)*0.5, Math.min(26, ph*0.05), T.p);

  roundRect(ctx, x0, y0, pw, ph, rad);
  ctx.fillStyle = C.panel; ctx.fill();
  if (P.glow > 0){                       // 起始那枚胶囊有一圈细亮框
    ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    roundRect(ctx, x0+0.5, y0+0.5, pw-1, ph-1, rad); ctx.stroke();
  }

  var clip = function(g){
    g.beginPath();
    roundRect(g, x0, y0, pw, ph, rad);
    g.clip();
  };

  /* 辉光层：先在离屏上按 1/GSC 画一遍，再放大贴回来。 */
  if (P.glow > 0){
    gx.setTransform(1,0,0,1,0,0);
    gx.clearRect(0,0,gcv.width,gcv.height);
    gx.setTransform(DPR/GSC,0,0,DPR/GSC,0,0);
    gx.save(); clip(gx);
    gx.fillStyle = P.inkGlow;          // 跟着字母色走，别留橙晕
    glyphs(gx, x0, y0, pw, ph);
    gx.restore();
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = P.glow;
    ctx.filter = "blur(" + P.gblur + "px)";
    ctx.drawImage(gcv, 0, 0, W, H);
    ctx.filter = "none";
    ctx.restore();
  }

  ctx.save(); clip(ctx);
  ctx.fillStyle = P.ink;
  glyphs(ctx, x0, y0, pw, ph);
  /* 资源画在字之后（盖在字上）—— 它是贴在墙上的内容，字是墙面纹理。
     只在主层画、不进辉光层：辉光只属于字。 */
  resources(ctx);
  ctx.fillStyle = P.ink;
  glyphs(ctx, x0, y0, pw, ph, true); // 只重绘首末行稀疏前景，不再加一次辉光
  ctx.restore();
}

/* 把字铺到弧面上。g 是目标上下文（主画布或辉光离屏）。 */
function glyphs(g, x0, y0, pw, ph, foreground){
  var rows = Math.max(1, P.word.length);
  var half = LAY.half, bow = LAY.bow;

  g.font = "700 " + LAY.fs.toFixed(1) + "px " + FONT;
  g.textAlign = "center";
  /* 基线用 alphabetic 而不是 middle：middle 是按 em 框算的，各字体差很多，
     摆出来会整体偏上/偏下。改成把墨迹自己居中，就是往上挪半个 cap height。 */
  g.textBaseline = "alphabetic";

  for (var r = 0; r < rows; r++){
    if (foreground && r !== 0 && r !== rows-1) continue;
    var ch = P.word.charAt(r);
    /* 每行用它自己那个字母的 advance（见 layout() 里的长注释）。
       行内只有一个字母在重复，所以行距是常数，不用做累加。 */
    var adv = LAY.advR[r], du = adv / half;
    var yLocal = LAY.rowH * (r + 0.5 - rows/2);   // 相对画面中心的纵向偏移
    /* 这一行滚了多少 = 墙的滚动 × 这一行的速率（上下快、中间慢，见 rateOf）。
       列的范围按当前滚动位置现算，盖住可视区就停 —— 原来是 -iMax..iMax 那固定几列，
       滚够久整面墙就空了。 */
    var roll = T.gu * rateOf(r, rows);
    var i0 = Math.floor((-1.12 - roll) / du) - 1;
    var i1 = Math.ceil (( 1.12 - roll) / du) + 1;
    for (var i = i0; i <= i1; i++){
      if (foreground && ((i % P.fg) + P.fg) % P.fg !== 0) continue;
      var u = i*du + roll;
      var k = kAt(u);
      if (!(k > 0.02) || !isFinite(k)) continue;
      var slope = 2*bow*u/half;                 // dz/dx = 弧面切线的斜率
      var phi   = Math.atan(slope);
      var sx = LAY.cx + u*half*k;
      /* 行距与字号共用 k·comp，保持两端和中间的字高/行距比例一致。
         仅行距用 k 会导致两端字号放大后文字重叠。 */
      var sy = LAY.cy + yLocal*k*LAY.comp;
      if (sx < x0 - adv || sx > x0 + pw + adv) continue;

      var s = k * LAY.comp;
      /* 横向按 cosφ 缩短 = rotateY 的投影结果。但这里只掺一点：全量的话两端会被压得
         比中间还窄，而参考帧量到的恰恰相反（边缘的字两个方向都更大）。
         `?fsh=1` 可以看全量的样子。 */
      var fx = 1 - P.fsh * (1 - Math.cos(phi));
      g.save();
      g.translate(sx, sy);
      g.rotate(P.lean * phi);                   // 字跟着弧走，但不横躺
      g.scale(s * fx * P.squeeze, s);           // 横向再压一道（见 P.squeeze）
      g.fillText(ch, 0, LAY.capH/2);
      g.restore();
    }
  }
}

/* 自动左移、鼠标横扫和拖动共用 T.gu；松手后叠加惯性。
   输入按中心列像素/u 换算，中心行跟手，上下行保留弧面速差。 */
function rateOf(r, rows){
  /* 上下两行同速、中间两行同速、上下更快。这不是挑的数，是墙的几何：墙在两个方向
     上都凹（球面内侧，见 layout 那段），越靠上下离观察者越近，同一个转角下屏幕位移
     越大。对称的两行 vr 相反、绝对值相同，所以天然同速。写成 vr 的函数而不是
     [1.1,1,1,1.1] 这种数组：换个词（行数变了）对称性也不用手工维持。 */
  var vr = Math.abs((r + 0.5 - rows/2) / (rows/2));     // 0(中间) .. 1(最外)
  return 1 + P.vsp * Math.min(1, vr / 0.75);
}

var wall = { v:0, drag:false, lastX:0, lastT:0, moved:0, mv:0, mx:0, mxT:0 };

function motionDen(){
  var h = W/2, b = h*0.50*P.curl;
  return Math.max(1, h * P.persp / (P.persp+b));
}
function interactive(){ return PIN === null && !GATE && T0 !== null && T.q >= 1; }
function addWallPx(dpx){ T.iu += dpx / motionDen(); }
function stepWall(dt, t){
  // 同一个起点、方向和终态尺子；字墙永远不受抓图/惯性/横扫影响。
  T.gu = REDUCE ? 0 : -Math.max(0, t-P.ip)*P.drift / motionDen();
  if (!wall.drag){
    addWallPx(((-P.drift + wall.mv)*(REDUCE ? 0 : dt)) + wall.v*dt);
    wall.v *= Math.exp(-P.fric * dt);
    if (Math.abs(wall.v) < 0.6) wall.v = 0;
  }
  wall.mv *= Math.exp(-6*dt);
}

/* 33 张游戏图由 scripts/prep-wall.py 生成于 assets/wall/NN.webp，总计约 1.78MB。
   换源图后重建并 --check；图片保留外链，进入游戏厅时加载。
   弧面贴图切成竖条，各条共享相邻投影边界，避免非线性形变误差和 1px 缝。
   卡片沿无界 u 轴按各自宽度排列，vr 控制纵向错落。 */
var PHOTOS = ["去月球", "逃离鸭科夫", "战地风云6", "不_存在的你，和我", "纸房子",
  "极乐迪斯科", "底特律变人", "江山北望", "ZATO", "名利游戏", "极速营救",
  "超英派遣中心", "彼方的她", "火山的女儿", "高考恋爱一百天", "主播女孩重度依赖",
  "拣爱", "断箭", "候鸟", "Slay the Princess", "The Walking Dead", "异环",
  "sinisistar2", "塞雷卡2", "多娜多娜", "兰斯", "野猫", "蜉蝣", "驱动妖精",
  "一次性交易大师", "特工17", "永恒世界", "凤凰"];
/* 可点击照片表：PHOTOS 名称映射到完整 URL；链接去掉 spm_id_from/vd_source 等分享跟踪参数。 */
var LINKS = {
  "ZATO": "https://www.bilibili.com/video/BV1ZkvUBDEMM/"
};
var WALLDIR = "../assets/wall/";
var CARD = [], nLoaded = 0, nFail = 0;

(function loadCards(){
  for (var i = 0; i < PHOTOS.length; i++){
    var o = { i:i, name:PHOTOS[i], im:new Image(), u:0, wu:0, vr:0, ar:1.78 };
    o.im.onload  = function(){ nLoaded++; };
    o.im.onerror = function(){ nFail++; window.__errs.push("图加载失败 " + this.src); };
    /* 序号文件名（文件名里带中文会给 URL 编码添乱，编号最省事） */
    o.im.src = WALLDIR + ("0" + (i + 1)).slice(-2) + ".webp";
    CARD.push(o);
  }
})();

// 图片保持共同水平 phase；vr 只负责上下错落，不能再用它给图片分速。

/* 弧面上 u 处的透视缩放。字和卡片共用这一个式子 —— 资源要是另起一套，
   它和字的运动会不同步，一眼就看得出是两层皮。 */
function kAt(u){
  var den = P.persp + LAY.bow*(1-u*u);
  return isFinite(den) && den > Math.max(1, Math.abs(P.persp)*0.02) ? P.persp/den : NaN;
}

/* 卡片按原图宽高比布局，不裁切。den 使用终态 half·k0；
   arS 为受 capw 限制的布局宽高比，hf 同步缩放高度以保持原比例。 */
function cardWU(o, rowH, den){
  return (P.cardh * rowH * o.arS) / den;
}

/* 名义位置只在终态几何上算一次。跟着展开进度重算的话，卡片会在展开的那一瞬间
   互相推开，看着像第二套动画（字母在展开，卡片在滑）。 */
var CARDROW = 0;
var VRS = [-0.62, 0.34, -0.18, 0.66, -0.46, 0.10, 0.52, -0.70];
var _bkey = "", PERIOD = 0, GAP = 0.07;
var INSTANCES = [], instancePool = new Map();
function centerAnchor(){
  if (!(PERIOD > 0)) return null;
  var best = null;
  CARD.forEach(function(o){
    var cycle = Math.round(-(o.u+T.iu)/PERIOD);
    var u = o.u+cycle*PERIOD+T.iu;
    if (!best || Math.abs(u)<Math.abs(best.u)) best={sourceIndex:o.i,cycle:cycle,u:u};
  });
  return best;
}

function buildCards(){
  if (!CARD.length) return;
  /* 名义尺寸必须按终态几何计算。初始胶囊的 half·k0 太小，
       会放大卡片 u 宽并把它们排出有效投影范围；探针需同时检查加载数与 u 尺寸。 */
  var rows  = Math.max(1, P.word.length);
  var halfE = W / 2;                                       // 终态半宽（pw 终态就是 W）
  var bowE  = halfE * 0.50 * P.curl;                       // lerp(0.95, 0.50, e=1)
  var den   = Math.max(1, halfE * (P.persp / (P.persp + bowE)));
  var rowH  = (H * 0.708) / Math.max(0.5, (rows - 1) + P.fill);   // 终态行高：ph=H 时的 block
  /* 早退的钥匙里必须有 `nLoaded` —— 每张卡的宽度是按图自己的宽高比折出来的，
     而 `naturalWidth` 要等解码完才有；不盯它，缺省 1.78 会被钉死，症状是
     "3.10:1 的超宽图也排成 1.78 那么宽"（图没变形，是编排错了）。 */
  var key = W + "|" + H + "|" + nLoaded + "|" + P.cardh + "|" + P.capw + "|"
          + P.curl + "|" + rows + "|" + P.fill;
  if (key === _bkey) return;
  var anchor = centerAnchor();
  _bkey = key; CARDROW = rowH;
  var left = 0;
  for (var i = 0; i < CARD.length; i++){
    var o = CARD[i];
    o.ar = o.im.naturalWidth ? o.im.naturalWidth / o.im.naturalHeight : 1.78;
    /* 超宽图按 `capw` 截短：排布宽高比封顶，画的时候高度系数跟着缩，
       图本身不变形（`hf` 就是"这张卡比标准高矮多少"）。 */
    o.arS = (P.capw > 0) ? Math.min(o.ar, P.capw) : o.ar;
    o.hf  = o.arS / o.ar;
    o.wu = cardWU(o, rowH, den);
    o.vr = VRS[i % VRS.length];
    o.u  = left + o.wu/2;              // o.u 是中心
    left += o.wu + GAP;
  }
  PERIOD = left; // 完整 33 张 + 33 个 gap，包括末张→下一轮首张。
  if (anchor){
    T.iu = anchor.u - CARD[anchor.sourceIndex].u - anchor.cycle*PERIOD;
  } else { T.iu = -CARD[0].u; } // 第一个源图从中心出发，加载重排按锚点继承。
}

var nVis = 0;                                   // 这一帧真画出来的卡片数（HUD 用）

// 同一个枚举给绘制和 probe；只枚举与可见 u 相交的 cycle，不累计无限实例。
function enumerateInstances(){
  if (!(P.res>0) || !(PERIOD>0) || !CARDROW) return [];
  var out=[], active=new Set(), U=1.12;
  CARD.forEach(function(o){
    var c0=Math.ceil((-U-o.wu/2-o.u-T.iu)/PERIOD);
    var c1=Math.floor(( U+o.wu/2-o.u-T.iu)/PERIOD);
    for(var cycle=c0;cycle<=c1;cycle++){
      var id=o.i+":"+cycle, inst=instancePool.get(id);
      if(!inst){ inst={id:id}; instancePool.set(id,inst); }
      active.add(id);
      inst.sourceIndex=o.i; inst.cycle=cycle; inst.name=o.name;
      inst.u=o.u+cycle*PERIOD+T.iu; inst.u0=inst.u-o.wu/2; inst.u1=inst.u+o.wu/2;
      inst.ar=o.ar; inst.arS=o.arS; inst.ok=!!o.im.naturalWidth;
      inst.drawn=false; inst.strips=[]; inst.bounds=null;
      out.push(inst);
    }
  });
  instancePool.forEach(function(v,k){ if(!active.has(k)) instancePool.delete(k); });
  return out.sort(function(a,b){return a.u-b.u;});
}
function cardPoint(o,u){
  var k=kAt(u), scale=k/LAY.k0, NH=P.cardh*CARDROW*o.hf;
  var x=LAY.cx+u*LAY.half*k, y=LAY.cy+o.vr*LAY.block/2*scale, h=NH*scale;
  if(![k,scale,x,y,h].every(Number.isFinite) || !(k>0) || !(h>0)) return null;
  return {x:x,top:y-h/2,bottom:y+h/2};
}
function resources(g){
  INSTANCES=enumerateInstances();
  var STRIP=Math.max(1,Math.min(64,Math.round(P.strip)));
  INSTANCES.forEach(function(inst){
    var o=CARD[inst.sourceIndex];
    if(!inst.ok) return;
    var iw=o.im.naturalWidth, ih=o.im.naturalHeight, edges=[];
    // 截在可见域附近再投影：跨极点的图和边框都不允许翻到观察者背后。
    var lo=Math.max(-1.12,inst.u0), hi=Math.min(1.12,inst.u1);
    if(!(hi>lo)) return;
    var cuts=[lo];
    for(var s=1;s<STRIP;s++){
      var u=inst.u0+o.wu*s/STRIP;
      if(u>lo && u<hi) cuts.push(u);
    }
    cuts.push(hi);
    for(var j=0;j<cuts.length-1;j++){
      var ua=cuts[j],ub=cuts[j+1],a=cardPoint(o,ua),b=cardPoint(o,ub);
      if(!a||!b||!(b.x>a.x)) continue;
      // drawImage 的真实屏幕交集，probe 不把纯离屏 strip 算成已绘制。
      if(b.x<=0||a.x>=W||Math.max(a.bottom,b.bottom)<=0||Math.min(a.top,b.top)>=H) continue;
      var ix=(ua-inst.u0)/o.wu*iw, sw=(ub-ua)/o.wu*iw;
      if(!(sw>0)) continue;
      g.save();
      g.transform((b.x-a.x)/sw,(b.top-a.top)/sw,0,(a.bottom-a.top)/ih,a.x,a.top);
      g.drawImage(o.im,ix,0,sw,ih,0,0,sw,ih);
      g.restore();
      inst.strips.push({ua:ua,ub:ub,x0:a.x,x1:b.x,top0:a.top,top1:b.top,bottom0:a.bottom,bottom1:b.top+a.bottom-a.top});
      edges.push([a,b]);
    }
    if(!edges.length) return;
    inst.drawn=true; nVis++;
    var xs=[],ys=[];
    edges.forEach(function(e){xs.push(e[0].x,e[1].x);ys.push(e[0].top,e[1].top,e[0].bottom,e[1].bottom);});
    inst.bounds={x0:Math.min.apply(null,xs),x1:Math.max.apply(null,xs),y0:Math.min.apply(null,ys),y1:Math.max.apply(null,ys)};
    // 边框也用已验证的投影点；沿切条边界走曲线，不对远处整图裸算 kAt。
    g.beginPath();
    g.moveTo(edges[0][0].x,edges[0][0].top);
    edges.forEach(function(e){g.lineTo(e[1].x,e[1].top);});
    for(var j=edges.length-1;j>=0;j--){g.lineTo(edges[j][1].x,edges[j][1].bottom);g.lineTo(edges[j][0].x,edges[j][0].bottom);}
    g.closePath();g.strokeStyle="rgba(242,247,252,.16)";g.lineWidth=1;g.stroke();
  });
}

/* ── 输入 ────────────────────────────────────────────────────────── */
/* 光标：拖动时撤内联值使用 grabbing；手柄命中时 pointer，其余恢复 grab。 */
var mx = -1, my = -1;
function padHot(){
  if (!armed || T0 !== null) return false;
  var r = padRect(), PAD = 12;
  return mx >= r.x-PAD && mx <= r.x+r.w+PAD &&
         my >= r.y-PAD && my <= r.y+r.h+PAD;
}
/* 点击查询复用实际绘制的 INSTANCES/bounds，不再独立重算投影。
   返回带 name/sourceIndex 的实例；包围盒允许略大于弧面卡片。 */
function cardAt(x, y){
  var hit = null, bd = Infinity;
  for (var i = 0; i < INSTANCES.length; i++){
    var inst = INSTANCES[i], b = inst.bounds;
    if (!inst.drawn || !b) continue;
    if (x < b.x0 || x > b.x1 || y < b.y0 || y > b.y1) continue;
    /* 卡片沿 u 一张接一张排（像真贴了一排），相邻会重叠 —— 取中心离得最近的，
       否则点在交界处开的是左边那张。 */
    var d = Math.abs(x - (b.x0 + b.x1) / 2);
    if (d < bd){ bd = d; hit = inst; }
  }
  return hit;
}

/* 开新标签页。用 `<a>` 而不是 `window.open`：这一下来自真实 pointerup，两条路都
   不会被弹窗拦截，但 `<a>` 走的是"主动导航"那条，在 iframe 里更稳。
   必须新标签页 —— 当前页跳走会把小镇那一整套状态（走到哪、开了几处）丢掉，
   回来得从开场重看。 */
function openLink(url){
  var a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
  document.body.appendChild(a); a.click(); a.remove();
}

function refreshCursor(){
  /* 拖拽中 ⇒ 清掉行内值（行内样式压得过 `#cv.drag`，不清的话"抓着"永远不显示）；
     指着能点的东西 ⇒ pointer —— 入场前是手柄，入场后是有链接的那张照片；
     其余 ⇒ 清掉，回到 `#cv{cursor:grab}`。 */
  if (wall.drag){ cv.style.cursor = ""; return; }
  var c = (T0 !== null) ? cardAt(mx, my) : null;
  cv.style.cursor = (padHot() || (c && LINKS[c.name])) ? "pointer" : "";
}

cv.addEventListener("pointerdown", function(e){
  cv.setPointerCapture(e.pointerId);
  wall.drag = true; wall.lastX = e.clientX; wall.lastT = e.timeStamp;
  wall.moved = 0; wall.v = 0;
  cv.classList.add("drag");
  refreshCursor();
});
cv.addEventListener("pointermove", function(e){
  mx = e.clientX; my = e.clientY;
  if (wall.drag){
    var dts = Math.max(0.004, (e.timeStamp - wall.lastT) / 1000);
    var dx  = e.clientX - wall.lastX;
    wall.lastX = e.clientX; wall.lastT = e.timeStamp;
    wall.moved += Math.abs(dx);
    /* 手柄态下不能改墙。墙还没出现，拖一下 `T.gu` 就静默走了，等墙展开出来是歪的 ——
       而"歪了"看着像参数没调好，一点都不像 bug。
       `moved` 照旧要累加（它判的是"这是拖动还是点击"），只挡真正改墙那句。 */
    if (!interactive()) return;
    addWallPx(dx);                     // 手往右拖墙往右走 —— 1:1，这才叫"抓着"
    wall.v = dx / dts;                 // 松手时继承这个速度
    return;
  }
  refreshCursor();
  /* 不按键、只横扫鼠标也能带墙转一点。给的是速度不是位置：鼠标停下来，墙就只剩
     自动左移，不会永远偏在一边。 */
  if (P.mv > 0 && interactive()){
    if (!wall.mxT){ wall.mx = e.clientX; wall.mxT = e.timeStamp; return; }
    var dtm = Math.max(0.004, (e.timeStamp - wall.mxT) / 1000);
    wall.mv = clamp((e.clientX - wall.mx) / dtm * P.mv, -700, 700);
    wall.mx = e.clientX; wall.mxT = e.timeStamp;
  }
});
function wallUp(e){
  if (!wall.drag) return;
  wall.drag = false;
  if(e && e.type === "pointercancel"){ wall.v=0;wall.mv=0;wall.moved=5; }
  if(e && cv.hasPointerCapture(e.pointerId)) cv.releasePointerCapture(e.pointerId);
  cv.classList.remove("drag");
  refreshCursor();
  if (wall.moved >= 5 || PIN !== null || GATE) return;
  /* 手柄态：只有点在柄上才算，不是"点击任意处" —— 整屏随便点一下就开演的话，
     第一下想拖墙的手势会顺手把入场也点掉。
     靶子外扩 12px：手机上是手指，画面上这又是唯一的可点物，给大点不吃亏。 */
  if (T0 === null){
    if (!armed) return;                    // 幕还没让开（挂在小镇里时）
    var r = padRect(), PAD = 12;
    if (e && (e.clientX < r.x-PAD || e.clientX > r.x+r.w+PAD ||
              e.clientY < r.y-PAD || e.clientY > r.y+r.h+PAD)) return;
  } else {
    /* 入场之后：点一张有链接的照片 = 开它的页面。
       上面那行 `wall.moved >= 5` 已经把"拖墙松手"挡掉了，这里不用再判一次拖动。
       点没链接的照片 / 空白处：什么都不做 —— 原来会落到末尾那句 `replay()`，
       而它在入场后是空操作（见 replay 的第一行守卫）。 */
    var c = e && cardAt(e.clientX, e.clientY);
    if (c && LINKS[c.name]){ openLink(LINKS[c.name]); return; }
  }
  replay();
}
addEventListener("pointerup", wallUp);
addEventListener("pointercancel", wallUp);

/* ── 主循环 ──────────────────────────────────────────────────────── */
var dtEMA = 16, lastNow = 0;
function frame(now){
  if (!lastNow) lastNow = now;
  var dt = Math.min(0.05, (now - lastNow)/1000); lastNow = now;
  /* `T0 === null` = 还停在手柄态：钟不走，t 就是 0。
     原来是 `(now - T0)/1000` 无条件算 —— `null` 参与减法会得到 `NaN`，而 `NaN` 一路
     穿过 clamp 之后 `T.p` 变 `NaN`，画出来是整块空白（所有坐标都是 NaN，canvas 静默
     不画），比"墙没动"更难往回追。 */
  var t = T0 === null ? 0 : (now - T0) / 1000;
  if (PIN !== null) t = PIN;
  setT(t);
  layout();
  buildCards();            // 卡片的 u 位置只跟"终态行高"有关，buildCards 自己判要不要重排
  if (PIN === null){
    if (T.q >= 1 && T0 !== null && !GATE) stepWall(dt,t);
  } else {
    T.gu = REDUCE || GATE ? 0 : -Math.max(0,t-P.ip)*P.drift/motionDen();
    T.iu = -CARD[0].u + T.gu; // 定格两 phase 同方向、同起点，且输入不能改它。
  }
  draw();
  hud(t);
  requestAnimationFrame(frame);
}

/* 四行的速率摆出来看 —— "上下同速、中间同速、上下更快"是硬要求，
   靠眼睛盯四行滚是判不准的，HUD 上是四个数，一眼就知道。 */
function rateHud(){
  var rows = Math.max(1, P.word.length), a = [];
  for (var r = 0; r < rows; r++) a.push(rateOf(r, rows).toFixed(2));
  return a.join("/");
}

function hud(t){
  var f = 16.7 / Math.max(1, dtEMA);
  document.getElementById("hud").textContent =
    "文字墙 · 样张\n"
    + "字=" + P.word + "   推近 q=" + T.q.toFixed(2)
    + "   展开 p=" + T.p.toFixed(3)
    + "   墙 " + T.gu.toFixed(2) + "u   行速 " + rateHud() + "\n"
    + "凹深 " + LAY.bow.toFixed(0) + "px (占半宽 "
    + (LAY.bow/Math.max(1,LAY.half)*100).toFixed(0) + "%)   透视 " + P.persp + "\n"
    + "面板 " + Math.round(LAY.pw) + "×" + Math.round(LAY.ph)
    + "   目标墨迹高 " + LAY.capH.toFixed(0)
    + "   实测 " + LAY.inkH.toFixed(0)
    + (Math.abs(LAY.inkH - LAY.capH) > 2 ? " ⚠" : "") + "\n"
    + "块/面板 " + (LAY.block/LAY.ph).toFixed(3) + "（参考 0.708）\n"
    + "字距(逐行) " + LAY.advR.map(function(v){return v.toFixed(0);}).join("/")
    + "   可见列 " + LAY.advR.map(function(v){
        return (2/(v/LAY.half)).toFixed(1); }).join("/") + "\n"
    /* 占空比 = 字在屏幕上的宽 / 屏幕上的列距。压窄改不动它（字和字距一起被压），
       只有字距（track）能改 —— 参考是 0.62/0.55，这个是硬判据。 */
    + "占空比 " + LAY.inkW.map(function(v,i){
        return (v*P.squeeze/(LAY.advR[i]*LAY.k0)).toFixed(2); }).join("/")
    + "（参考 0.62/0.55）   压窄 " + P.squeeze.toFixed(2) + "\n"
    + "帧 " + f.toFixed(0) + "fps   辉光 " + (P.glow>0?P.glow.toFixed(2):"关")
    + "   字体 " + FONT.split(",")[0].replace(/"/g,"") + "\n"
    /* 图那一行：`nLoaded` 不到 33 就是"有图没贴上"（路径写错时静默 —— 墙照样滚、
       字母照样对，只有几张位置是空的）。这一行是唯一不翻代码就看得出的地方，
       出图探针也读它。 */
    + "图 " + nLoaded + "/" + CARD.length + (nFail ? " ⚠失败 " + nFail : "")
    + "   这一帧画 " + nVis + " 张   卡片高 " + P.cardh.toFixed(2) + "×行高"
    + "   宽比上限 " + (P.capw > 0 ? P.capw.toFixed(1) : "关")
    + "   竖条 " + Math.max(1, Math.round(P.strip)) + "\n"
    /* 闸开着时 `PIN` 也是 0，所以这一支必须排在 `PIN` 前面 —— 反过来的话挂进小镇的墙
       会一直自报"?t= 定格 0ms"，把"我在等父页"这个真状态盖掉，排查时白绕一圈。 */
    + (GATE ? "等闸（父页还没放行）"
            : PIN !== null ? "?t= 定格 " + (PIN*1000).toFixed(0) + "ms"
            /* 三态。`T0 === null` 那一支是新的：解闸之后墙也不会自己演，要等点一下手柄 ——
                少了这一支，HUD 会一直写"抓住墙拖 · 点一下重放"，而那时候墙上根本没墙，
                看着像页面挂了。 */
            : T0 === null ? "手柄态（点手柄进入）" + (armed ? "" : " · 未解闸")
            : T.q < 1 ? "推近中 q=" + T.q.toFixed(2)
                      : "抓墙拖 · 点一下重放")
    + "   errs=" + window.__errs.length;
}

/* 只从手柄态启动一次；进入墙后，点击和普通按键都不能重置入场钟。
   保留函数名供原入口调用，重新进入场景由新文档初始化。 */
function replay(){
  if(T0 !== null || PIN !== null || GATE) return;
  T0 = performance.now(); T.gu=0; T.iu=CARD.length ? -CARD[0].u : 0;
  wall.v=0; wall.mv=0; wall.mxT=0;
}
/* Esc 单独退出，不能归入任意键重放。父页焦点走 well-esc，子页焦点直接发送 well-exit。 */
addEventListener("keydown", function(e){
  /* 原生出口按钮的 Enter/Space 交给 button，不能冒泡成重播。 */
  if (e.target && e.target.closest && e.target.closest('#exit') && e.key !== 'Escape') return;
  if (e.key === "Escape"){ e.preventDefault(); wellSay("well-exit"); return; }
  /* 幕还没让开时（挂在小镇里、还没收到 well-go）键盘也不该把入场点起来 ——
     否则会出现"画面冻在手柄态、但钟已经在跑"的错位，等幕一让开人看到的是终态。
     这和 wallUp 里那道 `armed` 是同一件事，两处都要判。 */
  if (!armed && T0 === null) return;
  replay();
});

resize();
/* REDUCE 直接显示终态；其余 T0=null 等待手柄点击后起钟。 */
T0 = REDUCE ? -1e9 : null;
var _last = performance.now();
(function tick(n){ dtEMA += ((n - _last) - dtEMA) * 0.1; _last = n; requestAnimationFrame(tick); })(performance.now());
requestAnimationFrame(frame);

/* HUD 默认不显示，`?probe` 才开 —— 理由见 CSS 那条。
   探针不受影响：`display:none` 的元素 `textContent` 照常读得到。 */
document.getElementById("hud").style.display = Q.has("probe") ? "block" : "none";

/* 消息约定：well-hello 报到、well-go 允许点击、well-esc 退出键、well-exit 请求返回。
   well-go 仅解闸，入场仍由手柄点击启动；单独打开不向自身发消息。 */
function wellSay(what){
  if (window.parent && window.parent !== window)
    window.parent.postMessage({ what: what }, "*");
}
addEventListener("message", function(e){
  var d = e.data;
  if (!d || typeof d !== "object") return;
  if (d.what === "well-go"){
    GATE = false;
    /* well-go 只设置 armed/解闸，不设置 T0，保留点击手柄启动入场。
         显式 PIN_Q 定格不受父页放行影响。 */
    armed = true;
    if (PIN_Q === null){ PIN = null; }
  }
  else if (d.what === "well-esc"){ wellSay("well-exit"); }
});

/* 出口按钮只在 iframe 里露出来 —— 单独打开样张时没东西可退。 */
if (window.parent && window.parent !== window){
  var exitEl = document.getElementById("exit");
  exitEl.style.display = "inline-flex";
  exitEl.addEventListener("click", function(){ wellSay("well-exit"); });
}

/* 双 rAF 再报到：等第一帧真画完。父页在黑幕落下的同一刻就填了 src，
   早报会被当成"已经就绪"。 */
requestAnimationFrame(function(){ requestAnimationFrame(function(){
  wellSay("well-hello");
}); });

/* 探针名使用 Probe 后缀，避免与页面已有 __well 等对象冲突。
   t 返回帧中实际使用值，定格时为 PIN。 */
window.__wallProbe = {
  get gate(){ return GATE; },
  get pin(){ return PIN; },
  /* `T0 === null` 那一支不能漏：`performance.now() - null` 是合法的（null 当 0 参与
     运算），会报出一个巨大的数 —— 不炸、不报错、只是永远错。出图脚本若拿它当
     "入场跑了多久"就会得出"早就跑完了"，而画面还停在手柄上。 */
  get t(){ return PIN !== null ? PIN
              : (T0 === null ? 0 : (performance.now() - T0)/1000); },
  get p(){ return T.p; },
  get q(){ return T.q; },
  /* `armed` = 接受点击了没有（挂在小镇里时等父页 `well-go`）。
     `intro` 把两个连续的进度合成一个离散状态，脚本判"现在在哪一幕"读它，比拿
     `q < 1 && T0 === null` 这种组合式判据清楚，也不容易写反。
     它判的是 `T.q`，不是 `T0`。`?t=` 定格那条路上 `T0` 永远是 `null`（没人起钟，
     `t` 直接取 `PIN`），拿 `T0` 当判据的话定格图一律自报"手柄态"，而画面明明是墙 ——
     出图脚本会照着一句假话去对齐裁切框。 */
  get armed(){ return armed; },
  get intro(){ return T.q <= 0 ? "pad" : (T.q < 1 ? "push" : "wall"); },
  /* 手柄的屏幕矩形 —— 探针拿它当点击靶心。`?t=` 定格的 pad 与 p 同源，
     所以同一个 t 拍出来的靶心是同一个（出图脚本可复现）。 */
  get pad(){ return padRect(); },
  get gu(){ return T.gu; },
  get imagePhase(){ return T.iu; },
  get period(){ return PERIOD; },
  get gap(){ return GAP; },
  get fg(){ return P.fg; },
  get instances(){ return INSTANCES; },
  get poolSize(){ return instancePool.size; },
  get anchor(){ return centerAnchor(); },
  get word(){ return P.word; },
  get rows(){ return P.word.length; },
  /* 字母色。这两个 getter 报的是参数，不是画面上真有的颜色 —— 把 ink 写进 P 表却忘
     了改 draw() 里那句 fillStyle 时，这里报的仍是新色、画面还是旧的，看着完全正常。
     所以 `_wallgate.py` ⑪b 不靠它下结论：直接数画布上"玫红占优"的像素，再把 ink
     换成另一个色看那个计数塌不塌。 */
  get ink(){ return P.ink; },
  get inkGlow(){ return P.inkGlow; },
  get cardh(){ return P.cardh; },
  get v(){ return wall.v; },
  get drag(){ return wall.drag; },
  get W(){ return W; },
  get H(){ return H; },
  get blockRatio(){ return LAY.block / Math.max(1, LAY.ph); },
  /* 图那三问。`nImg` 是"表里有几张"、`nLoaded` 是"真解码出来了" —— 分开报，
     因为 `nImg` 恒等于 33 什么也证明不了（表是死的）。路径写错时 `nLoaded`
     停在 0 而页面一切正常，这正是要抓的那个静默。 */
  get nImg(){ return CARD.length; },
  get nLoaded(){ return nLoaded; },
  get nFail(){ return nFail; },
  get nVis(){ return nVis; },
  /* 每张卡的屏幕位置，出图脚本拿它对齐裁切框 —— 卡片是斜的（上下边随弧面弯），
     只报 u 不够，报屏幕矩形。
     离屏很远那几张（`vis:false`）的 `h`/`yc` 读出来是负数，那不是 bug：`kAt` 的
     分母 `persp + bow·(1-u²)` 在 |u| = √(1+persp/bow) ≈ 1.87 处过零，再往外就翻号了
     —— 那几张贴在观察者身后，`resources` 会按屏幕 x 裁掉。 */
  get cards(){ return CARD.map(function(o){
      // 保留固定 33 源表及尺寸检查；每源取离中心最近的 cycle，不制造背后负尺寸。
      var cycle=PERIOD ? Math.round(-(o.u+T.iu)/PERIOD) : 0;
      var uc=o.u+cycle*PERIOD+T.iu, a=cardPoint(o,uc-o.wu/2), b=cardPoint(o,uc+o.wu/2), mid=cardPoint(o,uc);
      var hit=INSTANCES.find(function(v){return v.sourceIndex===o.i&&v.drawn;});
      return {sourceIndex:o.i,name:o.name,u:uc,u0:uc-o.wu/2,u1:uc+o.wu/2,baseU:o.u,wu:o.wu,vr:o.vr,ar:o.ar,arS:o.arS,
        vis:!!hit,x0:a?a.x:null,x1:b?b.x:null,yc:mid?(mid.top+mid.bottom)/2:null,h:mid?mid.bottom-mid.top:null,ok:!!o.im.naturalWidth};
    }); },
  get errs(){ return window.__errs; }
};
</script>
</body>
</html>
