<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文字墙 · 样张（准备用在小镇）</title>
<style>
  /* background 是**兜底值**（= C.bg 的默认）。真实值在 JS 里按 `?bg=` 设，
     JS 会在启动时把这一层也同步过去。两处不一致时以 JS 为准。 */
  html,body{margin:0;height:100%;background:#160000;overflow:hidden;
            font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  #cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #cv.drag{cursor:grabbing}
  /* ★ 默认**不显示**（`display:none`）—— 读数是给开发和探针看的，不是页面内容。
     `?probe` 才开，和 `town.html` / `street.html` / `break.html` 同一条约定。
     用户 2026-10-08：「怎么越来越多页面出现左下角类似调试用的什么东西」——
     这一批样张页原来一直挂着它（那时只有我自己打开看），现在一个个在往正页里接。 */
  #hud{position:fixed;left:10px;bottom:10px;color:#8FA3B8;
       font:12px/1.45 ui-monospace,Consolas,monospace;background:#0B1017cc;
       padding:6px 9px;border-radius:6px;white-space:pre;pointer-events:none;
       display:none}

  /* 左上角的出口 —— 照 desk.html 的 `#esc` 那一套（同一个色、同样的半透明底）。
     ★ 这是**我加的**（计划里标了，用户没提）。理由：兄弟两栋都有退出口 ——
       books 是 fx-throw 的 `#exit`、dev 是 desk 的 `#esc` —— 这堵墙一个都没有，
       挂进小镇后就是"进得去出不来"（手机、纯鼠标用户没有 Esc 可按）。
     ★ **只在 iframe 里显示**（下面 JS 按 `window.parent !== window` 开关）：
       单独打开样张时保持干净，那是给人看效果用的，不该有个"退出"杵在那。
     ★ 别和 `#hud` 撞位置 —— 它在**左下角**，这个在**左上角**。 */
  /* ★ 颜色**不再照抄 desk 的蓝灰**（原来是 `#8fb6c9` / `#1c2f3d`）。本页换成了
     黑底红字那一套（见下面 C 表），一个蓝灰小方块坐在黑底上，是整个画面里
     唯一的冷色 —— 一眼就是个外来户。改成同一族的暗红，它才像这面墙自带的。
     （兄弟场景仍是蓝灰，所以这是**本页自己**的偏差，不是三处一起改。） */
  /* Select 小长键语汇：只用本页红/黑，不引入浮层面板或手柄装饰。 */
  #exit{position:fixed;left:16px;top:14px;z-index:9;min-width:68px;min-height:40px;
        display:none;align-items:center;justify-content:center;gap:7px;
        font:11px/1 ui-monospace,Consolas,monospace;letter-spacing:.08em;
        color:#e8b9c4;background:transparent;border:1px solid transparent;
        border-radius:2px;padding:0 8px;cursor:pointer;
        transition:color .15s,border-color .15s}
  #exit::before{content:"";width:15px;height:5px;border:1px solid currentColor;border-radius:3px}
  #exit:hover{color:#ffdfe6;border-color:#8a2440}
  #exit:focus-visible{outline:2px solid #ffdfe6;outline-offset:3px}
  #exit:active::before{background:currentColor}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="exit" type="button" aria-label="退出游戏厅">退出</button>
<div id="hud"></div>
<script>
"use strict";
/* 探针规矩：出图脚本一律先挂 window.__errs。这里自己也挂一份。 */
window.__errs = [];
addEventListener("error", function(e){ window.__errs.push(String(e.message)); });

var Q = new URLSearchParams(location.search);

/* ── 配色 ──────────────────────────────────────────────────────────
   这张表换过三轮，每一轮的理由都不同，别把旧结论套到新配色上：

   ① 最早整张抄 `town.html`（深墨蓝底 + 暖金），理由是"样张的唯一用途是让用户
      判能不能用在小镇"。`warm`/`glow`/`snow`/`stone` 四个就是那时候剩的，
      现在没人用，留着小示小镇那套暖光。
   ② 2026-10-10 改成**柠黄底 + 玫红字**（中间先给过一版萤绿，随即推翻）。
   ③ **2026-10-10 当天又推翻成：背景黑 + 字红**。用户原话「颜色还是换成那个背景
      黑色，字是我们常用的那个红色，**就最开始的页面的那种**」——
      "最开始那个页面" = 正页 `proto/ref-hero.html`，它的 `:root` 是
      `--ground:#F40C3F` + `--ink:#160000`。用户要的是**把这两个对调**
      （正页是红底黑字，这里要黑底红字），也就是正页那个「反色」态。

   ⚠ **`bg` 和 `panel` 是两层，别混**：`bg` 是整块画布，`panel` 是墙上那个
     从窄胶囊长到满屏的面板。上一轮的教训是"只改 `bg` 等于没改"（终态面板占满
     屏幕，只改 `bg` 的话新颜色只在四角露一圈弧线）。
     ★ **这一轮两层同色是故意的**，不是偷懒：面板铺满屏幕、和底一个色 ⇒ 整页就是
       一片黑，正是用户要的"背景黑色"。墙的边界交给下面 `line` 那圈细边去交代。
       （`?bg=` / `?panel=` 仍能分开现场试。） */
var C = {
  bg:    Q.get("bg")    || "#160000",
  panel: Q.get("panel") || "#160000",
  warm:"#FFC95F", glow:"#FFBE63", snow:"#F2F7FC",
  stone:"#9FAFC0",
  /* 面板那圈 1px 细框（`P.glow>0` 那条，起始 p 很小时画）。
     ⚠ 它经历过三种"能见度"：深墨蓝面板上几乎看不见 → 柠黄面板上是一条明确的
       深色轮廓 → 现在黑面板上，它是**唯一**交代"墙有个边界"的东西。所以这个值
       不能再是深色（深色压在黑底上=看不见），改成半透明的红。
     `?line=%23160000` 就等于不画（涂成和底一样）。 */
  line:  Q.get("line")  || "rgba(244,12,63,.30)",

  /* 入场层：平直的暖灰外框 + 米白手柄，红色只落在两个操作键。
     padHi 保留 query 契约，但现在只给连接线用，不再是机身高光。 */
  screen: Q.get("screen") || "#0A0000",
  bezel:  Q.get("bezel")  || "#756C69",
  pad:    Q.get("pad")    || "#E5DDD1",
  padHi:  Q.get("padHi")  || "#756C69",
  dpad:   Q.get("dpad")   || "#211A19",
  key:    Q.get("key")    || "#F40C3F"
};

/* html/body 的底色跟着 C.bg 走。CSS 里那个值只是"JS 没跑起来"时的兜底 ——
   canvas 是 100%×100% 铺满的，正常看不见它，但 resize 那一帧、以及第一帧
   画出来之前，露出来的就是它（不跟就会闪一下深色）。 */
document.documentElement.style.background = C.bg;
document.body.style.background = C.bg;

/* ⚠ 每个参数都必须走 num()，不能写 `parseFloat(Q.get(k)) || 默认`。
   那个写法**静默地把 0 吃掉**：`parseFloat("0") || 0.32` 得 0.32。于是
   `?glow=0` 关不掉辉光，而我还拿那张"关了辉光"的图当对照去量连通域 ——
   量出来字母并成 450×540 的大块，我以为是字太大挨上了，其实是光晕把缝
   连了起来。`curl=0`、`fsh=0` 同理，全是"设了没用"。 */
function num(k, def){
  var v = Q.get(k);
  if (v === null || v === "") return def;
  var x = parseFloat(v);
  return isFinite(x) ? x : def;
}
var P = {
  /* 2026-10-09：接进小镇的**游戏厅**，用户定的词是 GAME。
     ★ 恰好也是 4 个字母 —— `rows = word.length`（217/326 行），所以行数、行距、
       `block/ph` 那些几何量一个都不用重调。换个长度的词就得重看一遍。 */
  word:  Q.get("word")  || "GAME",
  track: num("track", 1.15),    // 字距，相对字宽（决定"占空比"）
  persp: num("persp", 900),     // 透视距离（px）
  lean:  num("lean",  0.24),    // 每个字按弧位额外倾斜
  fsh:   num("fsh",   0.15),    // 横向缩短掺多少（1=全量 cosφ）
  curl:  num("curl",  1.0),     // 曲率总开关，0=纯平
  fill:  num("fill",  0.92),    // 字的墨迹高 / 行距
  squeeze: num("sq",  0.67),    // 合成窄体：横向压到几成
  /* ── 入场（2026-10-10 新增）：推近屏幕 → 停一拍 → 展开 ────────────────
     `ip` = 镜头从手柄态推进屏幕里的时长。**这一段完全新增**，`hold`/`dur`
     一个字没动 —— 只把 `hold` 的起点从"重放那一刻"挪到了"推完之后"。
     ★ `hold`/`dur` 那两个数是从参考帧**反解**出来的（见 `setT` 上面那段），
       它们描述的是**墙自己**的节奏，和入场无关，所以别顺手改。 */
  ip:    num("ip",    0.55),    // 推近屏幕（秒）
  hold:  num("hold",  0.85),    // 推完之后，墙在胶囊上先停多久（秒）
  dur:   num("dur",   0.75),    // 展开时长（秒）
  /* ⚠ 单位换过了：原来是"字/秒"，现在是**屏幕像素/秒**。旧单位在曲面上
     根本说不清 —— 四行的字宽不同（advR 差 1.33×），同一个"字/秒"在四行上
     是四个不同的速度；而拖动和惯性天生就是像素。 */
  drift: num("drift", 20),      // 不碰鼠标时的低速左移
  vsp:   num("vsp",   0.10),    // 上下两行比中间快多少（相对）—— 见 rateOf()
  /* 不按键、只横扫鼠标时带墙的力度。**0.08 试过，太弱** —— 实测量到鼠标横扫
     一下墙只走 11px，还不到自动左移半秒的量，跟"转动主要是因为鼠标移动"
     这句对不上。 */
  /* 鼠标横扫带墙转的那一份。**默认关（0）** —— 2026-10-06 用户看过样张后说
     「文字墙鼠标横扫的影响那个去掉」：墙的转动该由"抓着它拖"来驱动，鼠标只是
     从上面路过不算交互，而且它和自动左移叠在一起，手一抖墙就飘。
     参数留着不删：?mv=0.35 能把它放回来对照。 */
  mv:    num("mv",    0),
  fric:  num("fric",  3.2),     // 松手后惯性的衰减（1/s）
  res:   num("res",   1),       // 墙上贴的游戏图（0=关）—— 见 PHOTOS 那段
  /* 卡片名义高度 = 几倍 rowH。rowH 是**行距**（1440×900 满屏时 162.5px），
     字母的墨迹高只有 133px。
     ★ 2026-10-10 定的是 **0.90**。第一版给的是 1.55（=252px，比字母还高近一倍），
       用户看过出图后说「**图片大小参考原片嘛，你这太大了**」。原片那面墙
       （`_logs/_wod/_ab_wall.png` 上排）是**纯字母**、没有任何资源位，所以它给出的
       尺寸只有一个：**墙的单元就是一个字母**。按"一格"取 —— 两条独立的算法撞到
       同一个数上：① 参考帧 1280 宽时中间的**行距**量到 130px（`_cc.py`），换算到
       1440 宽是 146px；② 本页自己的 `LAY.capH`（字母墨迹高）在 1440×900 下是 150px
       （HUD 上就写着"目标墨迹高 150 / 实测 150"）。146 / 162.5 = 0.90、
       150 / 162.5 = 0.92。**这个数是从原片推的，不是看出来顺眼**。
     `?cardh=` 可以现场试（0.6 更小、1.2 更大）。 */
  cardh: num("cardh", 0.90),
  /* 宽度上限（宽高比）—— 排布时按 **min(ar, capw)** 定尺寸（代码里叫 `arS`）。
     33 张里有 5 张是 3.10:1 的 Steam library_hero：纯等比排的话它们有 780px 宽，
     再乘上弧面两端的放大（最多 2.6×）就是 2000px —— 一张图吃掉整个屏幕，
     字的墙被压成底下一条。
     ★ 是**整张缩小**、不是压扁：`hf = arS/ar` 把高度一起收，画出来的框仍是 ar 等比
       （宽:高 = cardh·rowH·arS : cardh·rowH·arS/ar = ar : 1），所以 3.10:1 的图
       在墙上仍是 3.10:1，只是比别人小一号。`capw=0` 关掉（回到纯等比）。 */
  capw:  num("capw",  2.0),
  /* 竖条数。canvas 只有仿射没有单应，整张贴进弧面会歪，所以切条。
     切几条是**看出来**的：6 条时每条内部的 k 变化 <1%。`?strip=` 可以现场比。 */
  strip: num("strip", 6),
  /* 字母色。★ 2026-10-10 最终定的是**红** `#F40C3F` —— 就是正页 `ref-hero.html`
     的 `--ground`。这一轮底/字一起换（黑底红字），所以整张 C 表都跟着动了。
     （当天中间给过两版：萤绿、玫红 `#E91379`，都被推翻了。）
     ⚠ **辉光这层的性质跟着底一起变了，而且这次是变好的**：它走
       `globalCompositeOperation="lighter"`（加法混合）。在柠黄 (219,240,7) 底上
       加法只会把颜色推向更亮、玫红加完 = (255,255,128)，那圈晕被底吃掉了；
       现在底是 `#160000`（近黑），加法就是**真发光**，这层第一次名副其实。
       ★ 代价是同一个 `glow=0.32` 在黑底上比以前显眼得多，笔画可能糊成一片 ——
         要单出一张 `?glow=` 的对照图（`_shots/wall-glow-ab.png`），别凭感觉定。
       `?ink=` / `?inkglow=` / `?glow=` 可现场试。 */
  ink:     Q.get("ink")     || "#F40C3F",
  inkGlow: Q.get("inkglow") || "#8E0725",
  glow:  num("glow",  0.32),    // 辉光强度（0=关）
  fg: Math.max(1, Math.round(num("fg", 8))), // 首末行每 N 列压在图片前，?fg=6/8
  gblur: num("gblur", 4)        // 辉光模糊半径（px）
};
var FONT = Q.get("font") ||
  '"Bahnschrift SemiBold Condensed","Bahnschrift Condensed","Arial Narrow",' +
  'Impact,"Arial Black",sans-serif';

/* 确定性：截图要能逐个字节复现。这个样张其实没用随机数，
   但保留签名，免得以后加"每行错峰"时忘了这回事。 */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
var rnd = mulberry32(20261006);

/* ── 画布 / DPR ──────────────────────────────────────────────────── */
var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
var W = 0, H = 0, DPR = 1;
/* 辉光走**离屏低分辨率**再放大贴回来：逐个 fillText 开 shadowBlur 的话
   一百多个字每帧都算一次模糊，60fps 直接崩。降到 1/3 分辨率画一遍、
   放大时本来就糊，再补一点点 blur 就够。 */
var gcv = document.createElement("canvas"), gx = gcv.getContext("2d");
/* ⚠ 倍数不能再低了。用 3 试过：1/3 分辨率下笔画只剩七八像素，模糊完一放大
   整片糊开，**把字与字之间的缝也点亮了** —— 而那四条缝正是"这是四条独立带子"
   的证据，糊掉之后整面墙读成一块。量的时候连通域全并成一个 795×643 的大块。 */
var GSC = 2;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width  = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  gcv.width  = Math.max(1, Math.round(W * DPR / GSC));
  gcv.height = Math.max(1, Math.round(H * DPR / GSC));
}
addEventListener("resize", resize);

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeInOut(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

/* ── 形状 ────────────────────────────────────────────────────────── */
function roundRect(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.arcTo(x+w,y,x+w,y+r,r);
  g.lineTo(x+w,y+h-r); g.arcTo(x+w,y+h,x+w-r,y+h,r);
  g.lineTo(x+r,y+h); g.arcTo(x,y+h,x,y+h-r,r);
  g.lineTo(x,y+r); g.arcTo(x,y,x+r,y,r);
  g.closePath();
}

/* ── 时间轴 ──────────────────────────────────────────────────────── */
/* ★ 2026-10-10：`T0` 从"页面加载那一刻"改成**可空的入场起点**。
   起手是 `null` —— 页面停在**手柄态**（黑屏 + 手柄，见 intro()），钟不走。
   `replay()` 把它设成 `performance.now()`，整段入场才从 t=0 开始跑。

   为什么要这么改：原来 `T0` 在加载时就有值，意味着**钟从页面一打开就在走**。
   那样的话用户盯着手柄看三秒再点，`t` 已经 3 秒了 —— 一点下去就是终态的墙，
   推近和展开**一格都看不到**。而这个错很难往回追：画面看着就是"正常的墙"，
   一点都不像坏了。 */
var T0 = null;                   // 入场起点；null = 还停在手柄态
var PIN_Q = Q.get("t") !== null ? parseFloat(Q.get("t"))/1000 : null;  // ?t=毫秒
/* `?gate=1`：挂进小镇时用的闸（跨文档那段在文件末尾）。
   父页在黑幕落下的**同一刻**就填了 iframe 的 src，而这一页的钟是"文档活了
   多久"—— 不冻的话整段展开演在黑幕后面，用户掀开幕布看到的是终态。
   （井那 2.2 秒的入场就是这么白演过一遍，同一个问题同一个解法。）

   ★ 闸**直接复用 `PIN` 这条现成的定格路**，frame() 一行都不用改 ——
     原来为 `?t=` 写的那两支（`PIN !== null` 冻住展开；else 分支把 `T.gu`
     写成 t 的纯函数）正好就是闸要的语义，连滚动一起冻住了。

   ★ 优先级：**`?t=` 严格优先于闸**。少了这个判断，`?gate=1&t=1600` 会定
     格到 0 而不是 1.6s —— 探针的定格路就被闸悄悄吞掉了，而症状只是
     "拍出来的图和预期不一样"，很难往回追到这里。 */
var GATE = Q.has("gate") && PIN_Q === null;
var PIN = GATE ? 0 : PIN_Q;
/* `armed` = 这一页现在**接受点击**了没有。
   - 单独打开样张（不是 iframe）：一开始就是 true —— 没人会给它发暗号，
     不发就永远点不动，那才是真坏了。
   - 挂在小镇里：等父页的 `well-go`（幕让开）才置 true。
   ★ 它管的是"点击能不能起钟"，**不是**"钟走不走" —— 两件事分开记，
     免得又绕成"一个变量冻两样"。 */
var armed = (window.parent === window);
var REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* q = 推近屏幕的进度（入场第一段）；p = 墙的展开进度（第二段）。两段共享一条钟。
   gu = 墙滚了多少。**单位是 u**（-1..1 是可视半宽），不是像素也不是字。
   这个单位是被逼出来的：曲面上等 u 才是等视觉间距（按像素滚，两端会挤成
   一团、中间拉开）；而"字"这个单位四行各不相同（advR 差 1.33×），拿它当
   共用的滚动量，四行会各滚各的。u 是唯一一个四行通用的量。
   对外的参数（drift / mv 那些）仍按像素，换算只在 addWallPx() 里做一次。 */
var T = { q:0, p:0, gu:0, iu:0 }; // gu 只自动；iu 是整排图片共同的水平 phase

/* 缓动的三个数是从参考帧**反解**出来的，不是挑了个好看的。
   把每帧量到的胶囊宽换算成展开进度 e，再对时间：
      t 0.9s → e 0.044 ／ 1.1s → 0.131 ／ 1.3s → 0.545 ／ 1.6s → 1.0
   `hold=0.9 + dur=0.7` 配三次方，算出来 0 / 0.094 / 0.685 / 1.0 —— 头尾都对上。
   值得注意的是它在 1.1 秒前几乎不动（66.0 和 66.4 两帧的胶囊是 142 和 144），
   所以"原地停一拍"是效果的一部分，不是等待。

   ★ 2026-10-10：这条钟前面**接了 0.55 秒的"推近屏幕"**（`P.ip`，见 intro()）。
     所以 p 的起点从 `t=0` 挪到了 `t=ip+hold`。上面那几个数一个没改 ——
     它们描述的是**墙自己**的节奏，接在入场后面照样成立。
     整段总长 = 0.55 + 0.85 + 0.75 = **2.15 秒**。
     ⚠ 这个改动会**悄悄挪动所有 `?t=` 定格图**：老时间轴上 p 在 `t=1.6` 就走满了，
       现在要 `t≥2.15`。老脚本里凡是拿 `t=1600` 当"终态"的，现在只到
       p=easeInOut((1.6-1.4)/0.75)=0.076 —— 拍出来是**一枚胶囊**，而不是满屏的墙，
       而"墙展开到一半"和"参数调坏了"在图上长得一模一样。定格值统统 +550ms 起。 */
function setT(t){                 // t = 入场开始后过了几秒
  if (GATE){ T.q = 0; T.p = 0; return; }
  T.q = REDUCE ? 1 : easeInOut(clamp(t / P.ip, 0, 1));
  var x = REDUCE ? 1 : clamp((t - P.ip - P.hold) / P.dur, 0, 1);
  T.p = easeInOut(x);
  /* 滚动（T.gu）**不在这里**算。原来它是 t 的纯函数（时间 × 速度），
     但墙现在要能被鼠标抓住 —— 抓一下就断开了"时间→位置"这个关系。
     见 stepWall()。 */
}

/* ── 布局：把字摆到弧面上 ──────────────────────────────────────────
   模型是"从**内侧**看一个竖轴圆筒"：圆心在观察者这一侧，所以弧面中点
   最远、两端最近。

   ⚠ 这个模型是**量出来**的，不是想出来的。量法记在这里，因为中途我
     差点把它推翻：肉眼看参考帧觉得"中间的字小、两端大"，但起始帧和
     终态帧底色不同（一个红底一个黑底），肉眼在两张图上比根本没可比性。
     `_logs/_wod/_cc.py` 逐帧取连通域量每个字母的包围盒，得到：

       帧      胶囊宽   字高   行距
       66.0     142      91     97
       66.9     193      92    100
       67.1     293      98    103
       67.60   1280+    118    127

     **胶囊宽涨 ×9，字高只涨 ×1.25** —— 所以面板不是在"放大"，是在
     "变宽露出更多副本"。而终态帧四行的行距比（中间 127 / 两端 173）
     就是 k = P/(P+bow) = 0.73~0.78，和下面这个公式对得上。

   另一条量出来的、我原先搞反的：**字母始终正立**。我一开始以为起始
   那根窄胶囊里字是横躺 90° 的（那样才塞得进），实际看 crop_660 是
   正立的 W/O/R/K，只是被横向压扁。加了个 roll 的话整个效果的性格就错了。

   还有一条：终态边缘的字**两个方向都更大**（中间 ≈0.80×），是纯 k 缩放，
   横向没有额外压扁 —— 所以 `fsh` 要小，全量 cosφ 是反的。 */
var LAY = { pw:0, ph:0, rowH:0, block:0, fs:0, adv:0, advR:[], inkW:[], capH:0,
            inkH:0, cx:0, cy:0, half:0, du:0, bow:0, k0:1, comp:1,
            iMax:2, iMaxMax:2 };
var CAPR = null;                  // 字体的 cap height / 字号，只量一次

function capRatio(){
  if (CAPR === null){
    ctx.font = "700 100px " + FONT;
    var m = ctx.measureText("H");
    CAPR = (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) / 100;
    if (!isFinite(CAPR) || CAPR < 0.2) CAPR = 0.70;   // 字体没加载时的兜底
  }
  return CAPR;
}

function layout(){
  var e = T.p;
  /* 面板：窄竖条 → 满屏。起始那两个数是参考帧量的：胶囊 142/1280 = 0.111
     屏宽、503/720 = 0.70 屏高。 */
  LAY.pw = REDUCE ? W : lerp(W*0.11, W, e);
  LAY.ph = lerp(H*0.70, H*1.00, e);
  LAY.cx = W/2; LAY.cy = H/2;
  LAY.half = LAY.pw/2;

  /* ⚠ 面板高 ≠ 字母块高，这两个要分开写。
     参考帧 66.0：胶囊 503 高，而四个字母只占 382（顶 174 → 底 556）——0.76。
     终态 68.5：字母跨 y 36→686 = 510，面板 720 —— 0.708。
     （这里是**直接量**的：`_cc.py` 逐字母包围盒 + `_curve.py` 窄条切行带。
       之前记的"终态 0.90"是把面板高当分母算错了，导致我的字块比参考大 27%。
       一开始我让字母块等于面板高，起始那根胶囊里字会顶满上下、没有呼吸。）

     块高 = (行数-1)×行距 + 一个 cap 高，所以行距要按这个反解，
     换个字数的词才不会溢出面板。 */
  var rows = Math.max(1, P.word.length);
  LAY.block = LAY.ph * lerp(0.760, 0.708, e);
  LAY.rowH  = LAY.block / Math.max(0.5, (rows - 1) + P.fill);

  /* 字号从**实测墨迹高**反推，不写死系数。
     Impact 和 Bahnschrift 的 cap height 占字号的比例差很多（0.72 vs 0.70
     看着接近，但 Ink 宽度差一大截），写死"字号 = 行高 × 0.86"换个字体就塌。
     参考帧里字的墨迹高 / 行距 ≈ 0.94 —— 行与行之间只留一条细缝，
     那条缝正是"这是四条独立带子"的证据，不能没有。 */
  var cr = capRatio();
  LAY.capH = LAY.rowH * P.fill;
  LAY.fs = LAY.capH / cr;

  ctx.font = "700 " + LAY.fs.toFixed(1) + "px " + FONT;
  var m = ctx.measureText("W");
  /* 自检：把**实测**的墨迹高回填到 HUD。目标是 LAY.capH，如果这两个数
     对不上，说明 capRatio() 量的字体和真正渲染的不是同一个（字体没就绪、
     或者 font 串被解析器丢了），字号就是错的 —— 这个错很难用眼睛发现，
     因为"字大了一点"看起来永远像"参数没调好"。 */
  LAY.inkH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;

  /* ★ 字距要**逐行各算**，不能全行共用 W 那一档。
     参考帧里 W 行的列距 171、O 行的列距 129（1280 宽的画面），差 1.33× ——
     正比于两个字母自己的 advance。共用一档的话四行会站成整齐的四列，
     而那**恰恰不是**参考的样子：参考里 W 和 O 是错开的（见 _zoom_ref_top.png）。
     一开始我在整幅图上量"列在哪儿"，量出来 W 行 283/452/600、O 行 254/376/484，
     两头都对不上，还以为是自己数错了列。

     合成窄体：本机只有 Bahnschrift 和 Impact 两种可用字体，都不够窄
     （参考帧 W 的墨迹宽/墨迹高 = 0.73，Bahnschrift SemiBold Condensed 是 1.10）。
     所以横向自己压一道，字距也跟着压 —— 只压字不压字距的话缝会变大到不成比例。 */
  LAY.advR = []; LAY.inkW = [];
  var widest = 0;
  for (var r = 0; r < rows; r++){
    var mr = ctx.measureText(P.word.charAt(r));
    LAY.inkW.push(mr.actualBoundingBoxRight + mr.actualBoundingBoxLeft);   // 墨迹宽
    LAY.advR.push(Math.max(1, mr.width) * P.squeeze * (1 + P.track));
    widest = Math.max(widest, LAY.advR[r]);
  }
  LAY.adv = LAY.advR[0];                          // HUD 用
  LAY.du  = LAY.adv / LAY.half;                   // 一个字占多少个 u
  LAY.iMaxMax = Math.ceil(1 / (Math.min.apply(null, LAY.advR) / LAY.half)) + 2;

  /* 凹深按**半宽的比例**给：面板一变宽弧就自动配平。比例随展开而变小 ——
     参考帧 67.3（半宽）弧度夸张，67.6（满宽）平掉不少。
     终态 k0 = P/(P+0.42·half)，取 P=900、half=720 得 0.749，正落在
     量出来的 0.73~0.78 里。 */
  LAY.bow = LAY.half * lerp(0.95, 0.50, e) * P.curl;
  LAY.k0 = P.persp / (P.persp + LAY.bow);
  LAY.comp = 1 / Math.max(0.05, LAY.k0);          // 中段被透视缩掉了，补回名义尺寸
  LAY.iMax = LAY.iMaxMax;
}

/* ── 入场层：黑屏 + 手柄 ────────────────────────────────────────────
   推近那段（`q` 从 0 到 1）画的是**另一套东西**，和墙一点关系都没有，所以
   整块摘出来单独一个函数，`draw()` 在门口分叉。

   为什么是"黑屏 + 手柄"而不是直接一个手柄：有**屏幕这个实体**，"进入"
   这个动作才有落点（用户点的是手柄，进去的是屏幕）。这也是他选的构图。

   几何仍共用 introBox / padRect。竖屏提高宽度占比而不是机械缩小：
   1440×900 ⇒ 屏 634×475、柄 432×164；400×720 ⇒ 屏 312×234、柄 256×97。
   用连续的宽度插值，不在横竖屏切换时跳变。 */
function introBox(){
  var S = Math.min(W, H*1.6);
  var narrow = clamp((760 - W)/360, 0, 1);
  var sw = S*lerp(0.44, 0.78, narrow), sh = sw*0.75;
  var gw = S*lerp(0.30, 0.64, narrow), gh = gw*0.38;
  var gap = S*lerp(0.055, 0.09, narrow);
  var top = Math.max(H*0.06, (H - (sh+gap+gh))/2 - H*0.04);
  return {
    S: S, sw: sw, sh: sh, gw: gw, gh: gh, gap: gap,
    scy: top + sh/2,                        // 屏幕中心 y
    pcy: top + sh + gap + gh/2,             // 手柄中心 y
    /* ⚠ 取 **max** 不是 min。4:3 的屏要铺满 16:9 的视口，必须**上下溢出**
       （被裁掉）—— 那是**故意**的：镜头推进屏幕里，就不该还看得见屏幕的边。
       取 min 的话 q=1 那一帧屏幕盖不满视口，四边各露一条底色的缝，而这条缝
       只在"推到底"那一瞬间存在，肉眼很难归因。 */
    scMax: Math.max(W/sw, H/sh)
  };
}
/* 手柄当前的屏幕矩形。**入场的两个坐标（画和判定命中）都从这里来** ——
   两边各写一份的话，改了拖动幅度就会出现"看得见但点不着"。 */
function padRect(){
  var B = introBox();
  var dy = H*0.08*T.q;                      // 往下飘一点，读成"镜头在往上推"
  return { x: W/2 - B.gw/2, y: B.pcy + dy - B.gh/2, w: B.gw, h: B.gh };
}

function intro(g, q){
  var B = introBox(), S = B.S;
  var s  = lerp(1, B.scMax, q);
  var cy = lerp(B.scy, H/2, q);
  var sw = B.sw*s, sh = B.sh*s;
  var x0 = W/2 - sw/2, y0 = cy - sh/2;
  var bez = Math.max(6, B.sw*0.027);

  /* 外框和电源灯在 q∈[0.45,0.80] 之间淡完。**不能拖到最后** —— q=1 那一帧
     手换到墙那条路，两边得无缝接上（屏幕和底色都是近黑，跳过不画也不跳变）。 */
  var ia = 1 - clamp((q - 0.45)/0.35, 0, 1);
  /* 手柄淡得更早。它是**前景**，镜头一往前走就该先出画；和外框同一条时间的话，
     屏幕都推到眼前了手柄还挂在那儿，像贴纸。 */
  var pa = 1 - clamp((q - 0.30)/0.32, 0, 1);

  /* 硬朗的等宽外框，没有玻璃反光或额外电源灯。
     外框按原时序淡出，黑屏保持不透明，仍是镜头推进的落点。 */
  roundRect(g, x0-bez, y0-bez, sw+bez*2, sh+bez*2, Math.max(2, B.sw*0.006));
  g.fillStyle = C.bezel; g.globalAlpha = ia; g.fill();
  roundRect(g, x0, y0, sw, sh, Math.max(1, B.sw*0.002));
  g.globalAlpha = 1;
  g.fillStyle = C.screen; g.fill();

  if (pa > 0.01){
    var R = padRect(), px = R.x, py = R.y, gw = R.w, gh = R.h;
    g.globalAlpha = pa;

    /* 顶边中线 → 屏幕底边中线的那根线。**它才是把两件东西绑成"一套设备"的
       唯一线索** —— 少了它，黑屏和手柄就是两个不相干的图形摆在一起。
       ⚠ 屏幕底边跟着推近往下跑，追上柄的时候线要**自己消失**：不判的话
         终点跑到起点**上面**去了，画出来是一根倒着长的线，半透明期间很显眼。 */
    if (cy + sh/2 < py - 4){
      g.beginPath();
      g.moveTo(px + gw/2, py);
      g.quadraticCurveTo(px + gw/2, (py + cy + sh/2)/2, W/2, cy + sh/2);
      g.strokeStyle = C.padHi; g.lineWidth = Math.max(1, S*0.0035); g.stroke();
    }

    /* 米白单块机身，小圆角。画与命中仍完全共用 padRect。 */
    roundRect(g, px, py, gw, gh, gh*0.045);
    g.fillStyle = C.pad; g.fill();

    /* 十字键：两矩形叠出来的十字，外扩 12px 的命中判定包得住它。
       位置在左边 —— 红白机的手感一半来自这个不对称构图。 */
    var dcx = px + gw*0.22, dcy = py + gh*0.50;
    var da = gh*0.46, db = gh*0.26;
    g.fillStyle = C.dpad;
    g.fillRect(dcx - da/2, dcy - db/2, da, db);
    g.fillRect(dcx - db/2, dcy - da/2, db, da);

    /* 两个红圆键：**画面上唯一的饱和色**（`C.key`）。同高并排，红白机就这样。 */
    var br = Math.max(2, gh*0.17);
    g.fillStyle = C.key;
    [0.66, 0.82].forEach(function(fx){
      g.beginPath(); g.arc(px + gw*fx, py + gh*0.50, br, 0, 6.2832); g.fill();
    });

    /* Start / Select：中间偏下的两颗深色小长条，和十字键同色。 */
    g.fillStyle = C.dpad;
    [0.44, 0.56].forEach(function(fx){
      roundRect(g, px + gw*fx - gw*0.025, py + gh*0.68, gw*0.05, gh*0.14, gh*0.05);
      g.fill();
    });

    g.globalAlpha = 1;
  }

  /* ★ 收口：屏幕色 `C.screen`(.0A0000) 和墙的底色 `C.bg`(.160000) 差 12 级红。
     在暗环境里那一级跳变看得见（"画面闪了一下"）。这里用 alpha 把屏幕**染**
     成底色，q 走到 1 时正好同色 ⇒ 换到墙那条路完全无缝，不是靠"两个颜色碰巧像"。 */
  if (q > 0.55){
    g.globalAlpha = clamp((q - 0.55)/0.40, 0, 1);
    g.fillStyle = C.bg; g.fillRect(0,0,W,H);
    g.globalAlpha = 1;
  }
}

/* ── 画 ──────────────────────────────────────────────────────────── */
function draw(){
  nVis = 0; INSTANCES = []; // 入场、res=0 时也不能遗留上一帧的可见数
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);

  /* ★ 分叉。`q < 1` 时画的是**入场层**，墙一个字都不画 —— 包括面板、辉光、
     字、资源，整段跳过。`q` 走到 1 才交给下面那条老路，而那之前 intro() 已经
     把画面染成 `C.bg` 了，两边接得上（见 intro() 末尾那段）。 */
  if (T.q < 1){ intro(ctx, T.q); return; }

  var pw = LAY.pw, ph = LAY.ph;
  var x0 = LAY.cx - pw/2, y0 = LAY.cy - ph/2;

  /* 圆角：起始是**胶囊**（半径=半宽），终态近方角。
     半径必须自己插值，不能写 min(pw,ph)/2 —— 那样满宽时会被算成 300+，
     整面墙变成一个大药丸。 */
  var rad = lerp(Math.min(pw,ph)*0.5, Math.min(26, ph*0.05), T.p);

  roundRect(ctx, x0, y0, pw, ph, rad);
  ctx.fillStyle = C.panel; ctx.fill();
  if (P.glow > 0){                       // 起始那枚胶囊有一圈细亮框
    ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    roundRect(ctx, x0+0.5, y0+0.5, pw-1, ph-1, rad); ctx.stroke();
  }

  var clip = function(g){
    g.beginPath();
    roundRect(g, x0, y0, pw, ph, rad);
    g.clip();
  };

  /* 辉光层：先在离屏上按 1/GSC 画一遍，再放大贴回来。 */
  if (P.glow > 0){
    gx.setTransform(1,0,0,1,0,0);
    gx.clearRect(0,0,gcv.width,gcv.height);
    gx.setTransform(DPR/GSC,0,0,DPR/GSC,0,0);
    gx.save(); clip(gx);
    gx.fillStyle = P.inkGlow;          // 跟着字母色走，别留橙晕
    glyphs(gx, x0, y0, pw, ph);
    gx.restore();
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = P.glow;
    ctx.filter = "blur(" + P.gblur + "px)";
    ctx.drawImage(gcv, 0, 0, W, H);
    ctx.filter = "none";
    ctx.restore();
  }

  ctx.save(); clip(ctx);
  ctx.fillStyle = P.ink;
  glyphs(ctx, x0, y0, pw, ph);
  /* 资源画在字**之后**（盖在字上）—— 它是贴在墙上的内容，字是墙面纹理。
     只在主层画、不进辉光层：辉光只属于字。 */
  resources(ctx);
  ctx.fillStyle = P.ink;
  glyphs(ctx, x0, y0, pw, ph, true); // 只重绘首末行稀疏前景，不再加一次辉光
  ctx.restore();
}

/* 把字铺到弧面上。g 是目标上下文（主画布或辉光离屏）。 */
function glyphs(g, x0, y0, pw, ph, foreground){
  var rows = Math.max(1, P.word.length);
  var half = LAY.half, bow = LAY.bow;

  g.font = "700 " + LAY.fs.toFixed(1) + "px " + FONT;

     摆出来会整体偏上/偏下。改成把墨迹自己居中，就是往上挪半个 cap height。 */

  for (var r = 0; r < rows; r++){
    if (foreground && r !== 0 && r !== rows-1) continue;
    var ch = P.word.charAt(r);

       行内只有一个字母在重复，所以行距是常数，不用做累加。 */
    var adv = LAY.advR[r], du = adv / half;

    /* ★ 这一行滚了多少 = 墙的滚动 × 这一行的速率（上下快、中间慢，见 rateOf）。
       列的范围**按当前滚动位置现算**，盖住可视区就停 —— 原来是 -iMax..iMax
       那固定几列，滚够久整面墙就空了（用户原话：「你这个墙居然能放完」）。 */
    var roll = T.gu * rateOf(r, rows);
    var i0 = Math.floor((-1.12 - roll) / du) - 1;
    var i1 = Math.ceil (( 1.12 - roll) / du) + 1;

      var phi   = Math.atan(slope);

      /* ★ 行距必须和字号**乘同一个系数**（k·comp）。
         这里原先写的是 yLocal*k，字号那边却是 k*comp —— 于是两端列的字被
         放大 1.39× 而行距没动，四行在两端直接叠在一起。症状很会骗人：
         `_cc.py` 量出来每块 450×540，看着像"字太大、字挨着字"，我一开始
         就去调字距，越调越糟。真判据是**两端**的字高(138) 和行距(170)，

      var sy = LAY.cy + yLocal*k*LAY.comp;

         全量的话两端会被压得比中间还窄，而参考帧量的恰恰相反
         （边缘的字两个方向都更大）。`?fsh=1` 可以看全量的样子。 */
      var fx = 1 - P.fsh * (1 - Math.cos(phi));

      g.rotate(P.lean * phi);                   // 字跟着弧走，但**不**横躺
      g.scale(s * fx * P.squeeze, s);           // 横向再压一道（见 P.squeeze）
      g.fillText(ch, 0, LAY.capH/2);

/* ── 墙的滚动：自动左移 + 鼠标横扫 + 抓住拖 ─────────────────────────
   三个来源叠在同一个量 T.gu 上；惯性是松手之后那一下。

   ★ 拖拽的输入是**屏幕像素**，换算时除的是"中间列一个 u 有多少像素"。
     这样中间那两行跟手是 1:1（真的是抓着走），上下两行按各自速率多走
     一点 —— 手感和"墙是弯的"同时成立。 */
function rateOf(r, rows){
  /* 上下两行同速、中间两行同速、上下更快。这不是挑的数，是墙的几何：
     墙在两个方向上都凹（球面内侧，见 layout 那段），越靠上下离观察者
     越近，同一个转角下屏幕位移越大。对称的两行 vr 相反、绝对值相同，
     所以**天然同速**。写成 vr 的函数而不是 [1.1,1,1,1.1] 这种数组：
     换个词（行数变了）对称性也不用手工维持。 */
  var vr = Math.abs((r + 0.5 - rows/2) / (rows/2));     // 0(中间) .. 1(最外)
  return 1 + P.vsp * Math.min(1, vr / 0.75);

var wall = { v:0, drag:false, lastX:0, lastT:0, moved:0, mv:0, mx:0, mxT:0 };

function motionDen(){

  T.gu = REDUCE ? 0 : -Math.max(0, t-P.ip)*P.drift / motionDen();
  if (!wall.drag){
    addWallPx(((-P.drift + wall.mv)*(REDUCE ? 0 : dt)) + wall.v*dt);
    wall.v *= Math.exp(-P.fric * dt);
    if (Math.abs(wall.v) < 0.6) wall.v = 0;
  }
  wall.mv *= Math.exp(-6*dt);
}

     ⇒ `half ≈ 79`、`k0 ≈ 0.92` ⇒ `half·k0 ≈ 73`。而终态是 `half·k0 = 514`。

     变成负数、`kAt` 翻负，于是 `h` 报出一个**负数**。

     偶尔还真有一张卡（33 张里总有一张飘过），出图也只会觉得"卡片稀了点"。
     只有把 `u` 量出来才看得见 —— 所以探针里那三问（nImg/nLoaded/可见数）
     单独不够，还得存 u 宽。

  var den   = Math.max(1, halfE * (P.persp / (P.persp + bowE)));

/* 点在哪张照片上。用 `INSTANCES` 而不是自己重算投影 —— 那里记的是**实际画出来**
   的条和它们的 `bounds`（`resources()` 每帧重建），边框走线、竖条裁切、跨极点
   那几张贴到观察者背后的情形，draw 那一步都已经处理过了；重算一份反而会和画面
   对不上。`bounds` 是包围盒，而卡片在弧面上是弯的 ⇒ 盒子比卡片略大一圈，
   做点击判定够用。
   返回整条 instance（带 `name` / `sourceIndex`），不是 `bounds`。 */
function cardAt(x, y){
  var hit = null, bd = Infinity;
  for (var i = 0; i < INSTANCES.length; i++){
    var inst = INSTANCES[i], b = inst.bounds;
    if (!inst.drawn || !b) continue;
    if (x < b.x0 || x > b.x1 || y < b.y0 || y > b.y1) continue;
    /* 卡片沿 u 一张接一张排（像真贴了一排），相邻会重叠 —— 取中心离得最近的，
       否则点在交界处开的是左边那张。 */
    var d = Math.abs(x - (b.x0 + b.x1) / 2);

/* 开新标签页。**用 `<a>` 而不是 `window.open`**：这一下来自真实 pointerup，

   ★ 必须新标签页 —— 当前页跳走会把小镇那一整套状态（走到哪、开了几处）丢掉，
     回来得从开场重看。 */

  var a = document.createElement("a");

function refreshCursor(){
  /* 拖拽中 ⇒ 清掉行内值（行内样式压得过 `#cv.drag`，不清的话"抓着"永远不显示）；
     指着能点的东西 ⇒ pointer —— 入场前是手柄，入场后是有链接的那张照片；
     其余 ⇒ 清掉，回到 `#cv{cursor:grab}`。 */
  if (wall.drag){ cv.style.cursor = ""; return; }
  var c = (T0 !== null) ? cardAt(mx, my) : null;
  cv.style.cursor = (padHot() || (c && LINKS[c.name])) ? "pointer" : "";

cv.addEventListener("pointerdown", function(e){
  cv.setPointerCapture(e.pointerId);
  wall.drag = true; wall.lastX = e.clientX; wall.lastT = e.timeStamp;

       `moved` 照旧要累加（它判的是"这是拖动还是点击"），只挡真正改墙那句。 */
    if (!interactive()) return;

  if (wall.moved >= 5 || PIN !== null || GATE) return;

     整屏随便点一下就开演的话，第一下想拖墙的手势会顺手把入场也点掉。

  if (T0 === null){

  } else {

       上面那行 `wall.moved >= 5` 已经把"拖墙松手"挡掉了，这里不用再判一次拖动。
       点没链接的照片 / 空白处：什么都不做 —— 原来会落到末尾那句 `replay()`，

    var c = e && cardAt(e.clientX, e.clientY);

/* ── 主循环 ──────────────────────────────────────────────────────── */
var dtEMA = 16, lastNow = 0;
function frame(now){
  if (!lastNow) lastNow = now;
  var dt = Math.min(0.05, (now - lastNow)/1000); lastNow = now;
  /* `T0 === null` = 还停在手柄态：钟**不走**，t 就是 0。
     原来是 `(now - T0)/1000` 无条件算 —— `null` 参与减法会得到 `NaN`，
     而 `NaN` 一路穿过 clamp 之后 `T.p` 变 `NaN`，画出来是**整块空白**
     （所有坐标都是 NaN，canvas 静默不画），比"墙没动"更难往回追。 */
  var t = T0 === null ? 0 : (now - T0) / 1000;
  if (PIN !== null) t = PIN;
  setT(t);
  layout();
  buildCards();            // 卡片的 u 位置只跟"终态行高"有关，buildCards 自己判要不要重排
  if (PIN === null){
    if (T.q >= 1 && T0 !== null && !GATE) stepWall(dt,t);
  } else {
    T.gu = REDUCE || GATE ? 0 : -Math.max(0,t-P.ip)*P.drift/motionDen();
    T.iu = -CARD[0].u + T.gu; // 定格两 phase 同方向、同起点，且输入不能改它。
  }
  draw();
  hud(t);

/* 四行的速率摆出来看 —— "上下同速、中间同速、上下更快"是用户提的硬要求，

function rateHud(){
  var rows = Math.max(1, P.word.length), a = [];
  for (var r = 0; r < rows; r++) a.push(rateOf(r, rows).toFixed(2));
  return a.join("/");
}

function hud(t){
  var f = 16.7 / Math.max(1, dtEMA);
  document.getElementById("hud").textContent =
    "文字墙 · 样张\n"
    + "字=" + P.word + "   推近 q=" + T.q.toFixed(2)
    + "   展开 p=" + T.p.toFixed(3)
    + "   墙 " + T.gu.toFixed(2) + "u   行速 " + rateHud() + "\n"
    + "凹深 " + LAY.bow.toFixed(0) + "px (占半宽 "
    + (LAY.bow/Math.max(1,LAY.half)*100).toFixed(0) + "%)   透视 " + P.persp + "\n"
    + "面板 " + Math.round(LAY.pw) + "×" + Math.round(LAY.ph)
    + "   目标墨迹高 " + LAY.capH.toFixed(0)
    + "   实测 " + LAY.inkH.toFixed(0)
    + (Math.abs(LAY.inkH - LAY.capH) > 2 ? " ⚠" : "") + "\n"
    + "块/面板 " + (LAY.block/LAY.ph).toFixed(3) + "（参考 0.708）\n"
    + "字距(逐行) " + LAY.advR.map(function(v){return v.toFixed(0);}).join("/")
    + "   可见列 " + LAY.advR.map(function(v){
        return (2/(v/LAY.half)).toFixed(1); }).join("/") + "\n"
    /* 占空比 = 字在屏幕上的宽 / 屏幕上的列距。**压窄改不动它**（字和字距
       一起被压），只有字距（track）能改 —— 参考是 0.62/0.55，这个是硬判据。 */
    + "占空比 " + LAY.inkW.map(function(v,i){
        return (v*P.squeeze/(LAY.advR[i]*LAY.k0)).toFixed(2); }).join("/")
    + "（参考 0.62/0.55）   压窄 " + P.squeeze.toFixed(2) + "\n"
    + "帧 " + f.toFixed(0) + "fps   辉光 " + (P.glow>0?P.glow.toFixed(2):"关")
    + "   字体 " + FONT.split(",")[0].replace(/"/g,"") + "\n"
    /* 图那一行：`nLoaded` 不到 33 就是"有图没贴上"（路径写错时**静默** —— 墙
       照样滚、字母照样对，只有几张位置是空的）。这一行是唯一不翻代码就看得出
       的地方，出图探针也读它。 */
    + "图 " + nLoaded + "/" + CARD.length + (nFail ? " ⚠失败 " + nFail : "")
    + "   这一帧画 " + nVis + " 张   卡片高 " + P.cardh.toFixed(2) + "×行高"
    + "   宽比上限 " + (P.capw > 0 ? P.capw.toFixed(1) : "关")
    + "   竖条 " + Math.max(1, Math.round(P.strip)) + "\n"
    /* 闸开着时 `PIN` 也是 0，所以这一支必须**排在 `PIN` 前面** ——
       反过来的话挂进小镇的墙会一直自报"?t= 定格 0ms"，把"我在等父页"
       这个真状态盖掉，排查时白绕一圈。 */
    + (GATE ? "等闸（父页还没放行）"
            : PIN !== null ? "?t= 定格 " + (PIN*1000).toFixed(0) + "ms"
            /* 三态。`T0 === null` 那一支是新的：**解闸之后墙也不会自己演**，
               要等用户点手柄 —— 少了这一支，HUD 会一直写"抓住墙拖 · 点一下重放"，
               而那时候墙上根本没墙，看着像页面挂了。 */
            : T0 === null ? "手柄态（点手柄进入）" + (armed ? "" : " · 未解闸")
            : T.q < 1 ? "推近中 q=" + T.q.toFixed(2)
                      : "抓墙拖 · 点一下重放")
    + "   errs=" + window.__errs.length;
}

/* 只从手柄态启动一次；进入墙后，点击和普通按键都不能重置入场钟。
   保留函数名供原入口调用，重新进入场景由新文档初始化。 */
function replay(){
  if(T0 !== null || PIN !== null || GATE) return;
  T0 = performance.now(); T.gu=0; T.iu=CARD.length ? -CARD[0].u : 0;
  wall.v=0; wall.mv=0; wall.mxT=0;
}
/* ★ Esc 必须从"按任意键重放"里**摘出来**。
   原来是 `addEventListener("keydown", replay)` —— 任意键都重放，Esc 也一样。
   挂进小镇后，"焦点在子页时按 Esc"是**唯一**的退出路（焦点在子页时父页的
   keydown 收不到，keydown 不跨文档冒泡），留着它就**退不出去**，而且症状是
   "按了 Esc 画面闪一下重播" —— 看着像页面活着，不像坏了。
   两条退出路都通、且不会同时触发：
     焦点在父页 → 父页 keydown 转 postMessage("well-esc") → 这里回 well-exit
     焦点在子页 → 这里直接发（下面这支） */

  /* 原生出口按钮的 Enter/Space 交给 button，不能冒泡成重播。 */
  if (e.target && e.target.closest && e.target.closest('#exit') && e.key !== 'Escape') return;
  if (e.key === "Escape"){ e.preventDefault(); wellSay("well-exit"); return; }
  /* 幕还没让开时（挂在小镇里、还没收到 well-go）键盘也不该把入场点起来 ——
     否则会出现"画面冻在手柄态、但钟已经在跑"的错位，等幕一让开人看到的是终态。

resize();
/* 起始状态故意停一拍（参考帧 66.0 和 66.4 几乎一模一样，说明它在原地
   等了一会儿才展开）。REDUCE 直接给终态。
   ★ 2026-10-10：非 REDUCE 时**不再是 `performance.now()`**，而是 `null` ——
     页面停在手柄态等一次点击。原来那样写等于"钟从页面一打开就在走"：用户盯着
     手柄看三秒再点，t 已经 3 秒，一点下去直接是终态的墙，推近和展开一格都看不到。 */

var _last = performance.now();
(function tick(n){ dtEMA += ((n - _last) - dtEMA) * 0.1; _last = n; requestAnimationFrame(tick); })(performance.now());
requestAnimationFrame(frame);

/* HUD 默认不显示，`?probe` 才开 —— 理由见 CSS 那条 ★。

document.getElementById("hud").style.display = Q.has("probe") ? "block" : "none";

/* ── 跨文档：挂进小镇时用的那四个暗号 ──────────────────────────────
   和井 / 开发室**同一套**，父页不必为本页分叉：

     well-hello  子→父  报到
     well-go     父→子  解闸（见上面 GATE）—— ★ **只松闸，不起钟**。
                 起手是手柄态，钟归用户那一次点击；子页自己演完再让幕让开的话，
                 人看到的是终态。详见 message 监听里那段。

     well-exit   子→父  请求退出，父页收到调 sceneExit()

       现在起手是手柄态，钟归**用户的那一次点击**管 —— 父页一起钟，子页就会
       自己演一遍，等人掀开幕布看到的是终态，点手柄什么也不会发生（`T0` 已经有值，
       `replay()` 只是把它再设一次，画面直接从推进中段开始）。

/* 出口按钮只在 iframe 里露出来 —— 单独打开样张时没东西可退。 */
if (window.parent && window.parent !== window){

/* ── 探针出口 ─────────────────────────────────────────────────────

  get gu(){ return T.gu; },
  get imagePhase(){ return T.iu; },
  get period(){ return PERIOD; },
  get gap(){ return GAP; },
  get fg(){ return P.fg; },
  get instances(){ return INSTANCES; },
  get poolSize(){ return instancePool.size; },
  get anchor(){ return centerAnchor(); },

  get nFail(){ return nFail; },
  get nVis(){ return nVis; },
  /* 每张卡的屏幕位置，出图脚本拿它对齐裁切框 —— 卡片是斜的（上下边随弧面弯），
     只报 u 不够，报屏幕矩形。
     ⚠ 离屏很远那几张（`vis:false`）的 `h`/`yc` 读出来是**负数**，那不是 bug：
     `kAt` 的分母 `persp + bow·(1-u²)` 在 |u| = √(1+persp/bow) ≈ 1.87 处过零，
     再往外就翻号了 —— 那几张贴在观察者**身后**，`resources` 会按屏幕 x 裁掉。 */
  get cards(){ return CARD.map(function(o){
      // 保留固定 33 源表及尺寸检查；每源取离中心最近的 cycle，不制造背后负尺寸。
      var cycle=PERIOD ? Math.round(-(o.u+T.iu)/PERIOD) : 0;
      var uc=o.u+cycle*PERIOD+T.iu, a=cardPoint(o,uc-o.wu/2), b=cardPoint(o,uc+o.wu/2), mid=cardPoint(o,uc);
      var hit=INSTANCES.find(function(v){return v.sourceIndex===o.i&&v.drawn;});
      return {sourceIndex:o.i,name:o.name,u:uc,u0:uc-o.wu/2,u1:uc+o.wu/2,baseU:o.u,wu:o.wu,vr:o.vr,ar:o.ar,arS:o.arS,
        vis:!!hit,x0:a?a.x:null,x1:b?b.x:null,yc:mid?(mid.top+mid.bottom)/2:null,h:mid?mid.bottom-mid.top:null,ok:!!o.im.naturalWidth};
    }); },
  get errs(){ return window.__errs; }
};
</script>
