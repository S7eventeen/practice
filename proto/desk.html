<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>开发室</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  /* 场：深蓝黑 + 机器背后一圈径向辉光（原片体积感有一半来自它） */
  body{
    /* 原片背景采样 (16,20,26)，辉光只在机身正后方一小圈 —— 78%/62% 那版铺得太开，
       机身整个泡在蓝光里，米白被染冷，看着像冷白而不是旧塑料的黄。 */
    background:radial-gradient(ellipse 40% 36% at 50% 47%,
                #16243a 0%, #0c1523 45%, #070b12 78%, #04060a 100%);
    font-family:ui-monospace,"Cascadia Mono",Consolas,"Microsoft YaHei",monospace;
    color:#cfe6dd;-webkit-user-select:none;user-select:none}

  #stage{position:fixed;inset:0;opacity:0;transition:opacity .9s ease}
  #stage.on{opacity:1}

  #hud{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:9;
       font-size:12.5px;letter-spacing:.06em;color:#8fb6c9;background:rgba(8,13,20,.62);
       border:1px solid #1c2f3d;border-radius:3px;padding:5px 13px;pointer-events:none;
       opacity:0;transition:opacity .45s;white-space:nowrap}
  #hud.on{opacity:1}

  /* 读数盒子**默认不显示**，`?probe` 或 `?dbg=1` 才开 —— 和镇子里那三个样张页
     同一条约定（见 town.html / fx-throw.html / fx-wall.html / slash-test.html）。
     ★ 藏起来不影响探针：`display:none` 的元素 `textContent` 照常读得到。
     原来它默认可见（CSS 里压根没写 display），而 `:501` 那句
     `dbg.style.display=''` 是个**空操作** —— 看着像"在控制显示"，其实没有。 */
  #dbg{position:fixed;left:12px;bottom:12px;z-index:9;color:#5f8f86;font-size:11px;
       line-height:1.6;white-space:pre;background:rgba(6,10,14,.7);
       border:1px solid #17302e;border-radius:4px;padding:7px 10px;pointer-events:none;
       display:none}

  /* 常驻电源：放大时退一级，远景才离开房间；返回途中不重复执行。 */
  #esc{position:fixed;left:16px;top:14px;z-index:9;width:40px;height:40px;
       display:grid;place-items:center;color:#8fb6c9;background:transparent;
       border:1px solid transparent;border-radius:3px;padding:0;cursor:pointer;
       transition:color .15s,border-color .15s}
  #esc svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;
           stroke-linecap:round;pointer-events:none}
  #esc:hover{color:#cfe6dd;border-color:#2d4b5e}
  #esc:focus-visible{outline:2px solid #cfe6dd;outline-offset:3px}
  #esc:active{color:#fff}
  #esc[aria-disabled="true"]{cursor:default;color:#617984}

  /* ── 机身各面 ───────────────────────────────────────────────── */
  .face{box-sizing:border-box;position:absolute;left:0;top:0}

  /* ★ 2026-10-09：机身这一整棵（`.face` 六个面 + `.bezel` 凹槽 + `.well` 灰框）都只是
     **外壳**，本来就不该接收指针事件。用户报「放大后点不进屏幕」，台账把病灶缩到了
     hit-test 那一层：

       .scr 的矩形罩住全部五个探测点   ✅（布局没问题）
       elementsFromPoint 的 13 层里有它 ✅
       elementFromPoint 8/8 全落在 .bezel ❌  ← 连 .scr 自己的矩形中心都命不中它

     而 `.bezel` 是 `.screen` 的**祖先** —— 祖先在几何上盖不住后代。⇒ hit-test 在
     `.screen` 那一层就停住了。`.screen` 恰好有两个 hit-test 会特殊对待、而几何遍历
     不管的属性：`overflow:hidden` 与 `border-radius`；`.bezel` 两个都没有。
     把外壳全部让开，hit-test 的候选就只剩 `.screen`。
     ★ 本机（dpr 1/2、四种视口）一次都没复现出来，所以这属于**按证据推的修法**；
       但它把候选从 4 个减到 1 个，无论真因是哪一支都只会更准，不会更差。
     ★ `.screen` 必须**显式**接回来：`pointer-events` 是继承属性，祖先设了 none，
       后代不写 auto 就一起失灵。 */
  .bezel,.well,.face{pointer-events:none}
  .screen{pointer-events:auto}

  /* 正面：Macintosh Classic。上部是宽边框包着的**凹陷**屏幕，中部一大片米白
     印 logo，底部一块**前凸台阶** —— 台阶用子元素的 translateZ 往前推 30px，
     所以 .front 必须 preserve-3d，否则子元素的 3D 变换会被压平（不报错，
     只是台阶贴回面板上，看起来"没做"）。 */
  /* 色调**直接抄原片实测**，不要按比例放大：额头 (196,184,164)、屏下机身 (175,169,155)、
     台阶 (170,164,154)、左边框 (193,179,153)。
     之前那版是拿原片值乘 1.23 得来的（#f4f0e0 系），整体亮了 25% —— 原片的机身本来
     就是这种中等亮度的暖褐，不是米白。 */
  .front{transform-style:preserve-3d;
    background:linear-gradient(172deg,#c9bcab 0%,#c4b7a6 32%,#b3ad9f 72%,#aaa49a 100%);
    border-radius:15px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8), inset 0 -2px 4px rgba(0,0,0,.13)}
  /* 两侧分模棱线：机身不是一整块平的，正面靠边框处各有一条竖棱 */
  .front::before,.front::after{content:"";position:absolute;top:3%;bottom:26%;width:2px;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.09) 18%,rgba(0,0,0,.09) 82%,transparent)}
  .front::before{left:17px}
  .front::after{right:17px}

  /* 屏幕凹坑。原片实测：坑从 9.6% 到 61.6% 机身高，而且**上内壁最厚（≈25px）
     最暗、下内壁最薄最亮**（光从左上来）——四边做成一样厚就不像了。
     所以 padding 与 inset 阴影都做成不对称的。 */
  /* 尺寸照 10% 网格量：凹坑左右各 6% 机宽（不是 11%）、上下 8%~53% 机身高（不是
     10%~63%）—— 原来那版屏幕又窄又高，玻璃区高宽比比原片横得多。 */
  /* 尺寸与内壁颜色全是三条剖面量出来的（原片凹坑 8.5%~57%、左右各 8.5% 机宽）：
       上内壁 (122,112,103) **暗**  左内壁 (200,200,196) **亮**且中性灰
       下内壁 (205,197,177) **亮**  右内壁 同左
     ⇒ **只有上边暗**，不是对角渐变（我按缩略图判成"左上暗"是错的，量了才知道）。 */
  .bezel{position:absolute;left:32px;right:32px;top:44px}
  .well{position:relative;box-sizing:border-box;height:252px;border-radius:8px;
    padding:23px 19px 18px 19px;
    background:linear-gradient(180deg,#6e6960 0%,#857f76 10%,#b7b4ac 15%,#c9c6bd 100%);
    box-shadow:inset 0 10px 14px -5px rgba(0,0,0,.5),
               inset 5px 0 8px -3px rgba(0,0,0,.16),
               inset -5px 0 8px -3px rgba(0,0,0,.16),
               inset 0 -4px 8px rgba(255,255,255,.4),
               0 1px 0 rgba(255,255,255,.35)}
  /* 屏幕玻璃外沿还有一圈很细的**白**反光（原片上边缘那条亮线） */
  .screen{position:relative;box-sizing:border-box;width:100%;height:100%;
    border-radius:3px;overflow:hidden;background:#0b1016;
    /* 内阴影别下重了：24px/.92 那版在左右两侧压出两条很宽的暗带，
       远看像屏幕只有中间一条是亮的。原片只在四角有一点暗角。 */
    box-shadow:0 0 0 1px rgba(255,255,255,.5),
               inset 0 0 0 2px #191813, inset 0 0 11px rgba(0,0,0,.55)}
  .screen::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),
               linear-gradient(122deg,rgba(255,255,255,.09) 0%,transparent 40%)}

  /* 软驱槽 —— 原片里它**偏右**，不是居中的通长槽 */
  /* 软驱槽。原片实测在 76.4% 机身高，而且**贴右边缘一路伸出去**（被机身右边切掉），
     不是居中的小槽 —— 行剖面在 y=360 抓到 146 个暗像素、左右两侧都是 0。 */
  .slot{position:absolute;left:52%;right:0;top:75.5%;height:11px;
    border-radius:2px 0 0 2px;
    background:linear-gradient(180deg,#585245,#151310 60%,#2b2721);
    box-shadow:0 1px 0 rgba(255,255,255,.5), inset 0 2px 3px rgba(0,0,0,.8)}

 /* 苹果标 + 机型名。原片在 86% 机身高，而台阶占 79%~100% —— 所以它是印在**台阶的
     前立面**上的，靠左：苹果标 6.8%~12.8% 机宽，名字 15.5% 起。
     ⇒ 它必须是 .lip 的**子元素**。挂在 .front 上会被 translateZ(30px) 的台阶整个
     盖住，一个字都看不见（而且不报错，只是"没做"）。 */
  .brand{position:absolute;left:5%;top:31%;display:flex;align-items:center;gap:12px;
    color:#6a6252;font-size:11.5px;letter-spacing:.05em}
  .brand svg{width:15px;height:18px;flex:none;display:block}

  /* 底部前凸台阶。原片里它比机身**略窄**，而且**和机身几乎同色**（采样：台阶
     (170,164,154) vs 屏下 (177,168,153)，差 7）—— 我原来做亮了，看起来像贴上去
     的另一块板。区分靠的是上边缘一条暗线 + 往机身上下沿投的一条影。 */
  .lip{position:absolute;left:7px;right:7px;bottom:-3px;height:109px;
    transform:translateZ(30px);
    background:linear-gradient(180deg,#b6b0a3,#ada79a 55%,#a29c90);
    border-radius:4px 4px 10px 10px;
    box-shadow:0 9px 17px rgba(0,0,0,.44),
               inset 0 3px 4px -1px rgba(0,0,0,.22), inset 0 -2px 3px rgba(0,0,0,.10)}
  /* 台阶的顶面：一块水平面，从机身正面一路铺到台阶前缘 —— 不加它，从侧面看
     台阶就是一张悬空的纸 */
  .lip-top{position:absolute;left:7px;right:7px;bottom:106px;height:30px;
    background:linear-gradient(180deg,#b8af9b,#a89f8c);
    transform-origin:50% 100%;transform:translateZ(30px) rotateX(90deg)}

  /* 背面：光面 + 右侧一条竖凸筋 + 左下角一小块**横向**散热槽。
     （原片不是满铺竖格栅 —— 那是缩略图上会读反的一处。）
     凸筋的白要压到很淡：原来 .55 看着像贴了条白胶带，原片只是一道很浅的鼓包。 */
  .back{background:linear-gradient(158deg,#c6baa9,#aca497);border-radius:13px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.6)}
  .back::before{content:"";position:absolute;right:12%;top:7%;width:30px;height:64%;
    border-radius:3px;
    background:linear-gradient(90deg,rgba(0,0,0,.07),rgba(255,255,255,.32) 42%,rgba(0,0,0,.06))}
  .back::after{content:"";position:absolute;left:5%;bottom:5%;width:46%;height:20%;
    border-radius:2px;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.40) 0 3px,transparent 3px 10px)}

  .side{background:linear-gradient(180deg,#b0a898,#8e8779);border-radius:6px}
  .top{background:linear-gradient(90deg,#c4b8a6,#a9a094);border-radius:6px}

  /* ── 屏幕里：一台电脑的桌面 ───────────────────────────────────────
     2026-10-07 用户推翻了上一版（照原片做的"经典 Mac 文档窗口"）：
       "屏幕的页面设计的有些怪，有些无意义的纹路，改掉吧，比如上面的刻度。
        事实上就是个电脑屏幕，里面有桌面，就用经典的草地吧，还有几个 txt，
        只不过默认打开了一个。"
     ⇒ 草地壁纸 + 桌面几个 .txt 图标 + 一个开着的窗口 + 底部任务栏。
     删掉的：标尺（点名的"刻度"）、菜单栏那三个黑方块、省略号那行、
     屏幕右缘那条滚动条、左下角"12 pt"小方框 —— 都是信息量为零的纹路。
     ★ 字号仍然故意做小（正文 6.5px）：远看就是原片那种"一屏密集小字"的观感；
       点开、相机推近之后由 CSS3D 重新栅格化才读得清。字号调大立刻不像。
     ★ 2026-10-08 **更正**：这里原来写着「窗口上那三个按钮是画出来的，不是能点的：
       这层 DOM 埋在 CSS3D 面板里，相机推进后指针要走 canvas 才到得了它」。
       **那句话是错的**，已删。实测（`_logs/_deskhit.py`，真鼠标打在 `?go=1` 上）：
       `elementFromPoint` 拿到的就是那个 `<b>`，真 pointerdown / click 也照常到达。
       错在哪：`renderer` 是 `THREE.CSS3DRenderer`，它的 `domElement` 是个 **div**，
       不是盖在上面的 canvas；CSS3D 挂的是**真 DOM**，浏览器对 CSS transform 的
       hit-test 是认的 —— `.wtx` 一直"真能滚"（见下面那条注释）就是同一个证据，
       当时没把两件事连起来。
       ⇒ 所以窗口是真能点的，一套小窗口管理（开 / 拖 / 最小化 / 最大化 / 关）
         就挂在这层 DOM 上。真交互不止机身那一层了。 */
  .scr{position:relative;width:100%;height:100%;overflow:hidden;
    background:#2f6fb5;color:#111;
    font:6.5px/1.45 Tahoma,Verdana,"Microsoft YaHei",sans-serif}
  /* 壁纸：蓝天 + 几朵云 + 一道绿丘（Bliss 那种） */
  .xp{position:absolute;left:0;right:0;top:0;bottom:13px;overflow:hidden;
    background:linear-gradient(180deg,#1e6fc4 0%,#4a9ade 30%,#8fc6ea 52%,#c8e2f4 58%)}
  .xp::before{content:"";position:absolute;left:-14%;right:-14%;top:49%;height:72%;
    border-radius:50% 50% 0 0 / 24% 24% 0 0;
    background:radial-gradient(ellipse 58% 96% at 50% 0%,
               #b2d878 0%,#84bb4a 34%,#57992e 68%,#3f7d22 100%)}
  .xp .cl{position:absolute;border-radius:50%;background:#fff;opacity:.9}
  /* 桌面图标：几个 txt（白纸 + 蓝标题条 + 几行灰字）。
     `cursor:pointer` 在这里不只是装饰：这层 DOM 真的收得到指针（见 .scr 上面
     那条更正的注释），指针变成手就是"它可点"的唯一提示 —— 屏幕里所有东西
     都小，没有光标提示用户根本不会去试。 */
  .ic{position:absolute;width:38px;text-align:center;color:#fff;
    font-size:5px;line-height:1.3;cursor:pointer;
    text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.55)}
  .ic .pg{position:relative;width:15px;height:18px;margin:0 auto 1px;
    background:#fff;border:1px solid #8b98a6;border-radius:1px;
    box-shadow:1px 1px 0 rgba(0,0,0,.35)}
  .ic .pg::before{content:"";position:absolute;left:1px;right:1px;top:1px;height:3px;
    background:#3f7ac0}
  .ic .pg::after{content:"";position:absolute;left:2px;right:2px;top:6px;bottom:2px;
    background:repeating-linear-gradient(180deg,#aeb9c4 0 1px,transparent 1px 3px)}
  /* 联系方式那一个：**纯绿一块**（2026-10-12 用户："图标改为全绿"）。
     上一版是微信图标（绿底 + 两个交叠的白气泡），这次白气泡去掉。
     ★ 只换图标，**窗口一个字都不动** —— 打开来还是记事本。用户原话
       「里面就也和其他一样」，所以这里不碰 .win / .wtb / .wtx。
     尺寸 16px 见方，和上面那张纸的 15×18 差不多 —— 一排看下来不会歪。
     ⚠⚠ 两条伪元素**必须显式关掉**，不能只是"把上一版那两条 wx 规则删了"：
       `.ic .pg::before/::after` 的**基样式还在**（蓝标题条 + 灰横线），
       删掉覆盖它们就露出来，图标会变成"绿底 + 蓝条 + 灰线"。
       `content:none` = 这个伪元素根本不生成，比画成透明干净。 */
  .ic .pg.wx{width:16px;height:16px;margin:1px auto 2px;
    background:#3ec15b;border:1px solid #2b9c46;border-radius:3px}
  .ic .pg.wx::before,
  .ic .pg.wx::after{content:none}
  /* 正开着的那一个 —— 桌面图标得有个"它在用"的样子，否则跟另外三个没分别 */
  .ic.on{background:rgba(49,106,197,.55);border-radius:2px;padding:1px 0;
    margin:-1px 0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.32)}
  /* 默认打开的那个 txt */
  /* 窗口占了桌面 70% 宽时草地只剩一条边 —— 收小并挪到右下，把桌面让出来。
     尺寸是倒推的：内容区宽 166px ÷ 等宽字 7.2px/汉字 = 21 字，
     高 144px ÷ 行高 9.23 = 15 行，DOC 正好按这两条断的行。 */
  /* ★ `display:none` 是新的：窗口现在由 FILES 表生成（一个文件一个），
     开哪个由 JS 设 display —— 上一版是一个写死的窗口，加第二个都做不到。 */
  .win{position:absolute;left:78px;top:26px;width:178px;height:162px;display:none;
    background:#fff;border:1px solid #0f4a86;border-radius:3px;overflow:hidden;
    box-shadow:2px 2px 4px rgba(0,0,0,.42)}
  /* 标题栏：能拖（移动窗口）+ 上面三个按钮能点。
     `user-select:none` 不省 —— 拖的时候会把标题文字刷成蓝色选中态，
     在那个尺度下看着像标题栏坏了。`.wtx` 的选区**不动**（屏幕里的字要能选）。
     `touch-action:none` 是给触摸屏的：不加，手指拖标题栏会被当成滚动页面。 */
  .wtb{height:12px;display:flex;align-items:center;gap:3px;padding:0 2px 0 3px;
    background:linear-gradient(180deg,#5ba3ea 0%,#2470c9 8%,#1a5aac 90%,#134a92 100%);
    color:#fff;font-size:5.5px;font-weight:700;cursor:default;
    user-select:none;-webkit-user-select:none;touch-action:none;
    text-shadow:0 1px 1px rgba(0,0,0,.45)}
  .wtb .bi{width:8px;height:8px;flex:none;background:#fff;border:1px solid #7d8a99;
    border-radius:1px}
  /* 标题文字要能被挤掉，不然三个按钮会被顶出标题栏 */
  .wtb .tt{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .wtb .bz{margin-left:auto;display:flex;gap:2px;flex:none}
  .wtb .bz b{width:8px;height:8px;border:1px solid #0c3f75;border-radius:1px;
    background:linear-gradient(180deg,#8fbdf0,#2a6cc0);cursor:pointer;
    font:700 5px/7px Tahoma,sans-serif;text-align:center;color:#fff;
    text-shadow:none}
  .wtb .bz b:hover{background:linear-gradient(180deg,#b9d8f7,#4b8ad8)}
  /* 正文用黑体（用户指定）。★ 37 段在屏上只有 15 行可见，
     所以这里是**真能滚**的 —— CSS3D 里挂的是真 DOM，滚轮事件到得了。 */
  .wtx{position:absolute;left:0;right:0;top:12px;bottom:0;padding:3px 5px;
    font:6.5px/1.42 "SimHei","Heiti SC","Microsoft YaHei",sans-serif;
    white-space:pre-wrap;color:#111;overflow-y:auto;overflow-x:hidden}
  /* XP 那种滚动条：木色槽 + 淡蓝滑块。远看只要"有一条"就够了，不画箭头 */
  .wtx::-webkit-scrollbar{width:9px}
  .wtx::-webkit-scrollbar-track{background:#f1efe2;border-left:1px solid #d6d2c4}
  .wtx::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#e2eaf4,#b3c8e2);

         （`add()` 里已经删了它，报 auto 就是又漏回去了）。 */
      + '\n  外壳 pointer-events  .front ' + cs('.front', ['pointerEvents'])
      + '   .bezel ' + cs('.bezel', ['pointerEvents'])
      + '   .well ' + cs('.well', ['pointerEvents'])
      /* ★★ 2026-10-09（用户第四报的收口）：**六个面全列**。上面那一行只盯着 `.front`，
         可 six 个面里任何一个没让开都够截获点击 —— 而且最像真凶的恰恰不是 `.front`：
         `back`/`side`/`top` 在 DOM 里排在 `front` **之后**，CSS 层叠上反而压在它上面
         （用户那本台账里 `elementsFromPoint` 第一位那个 `div.face` 就是它们中的一个）。
         判据：这一行该是「（一个都没有 ✓）」。冒出任何一个面，就说明 three.js 那条
         **内联** `pointer-events:auto`（`CSS3DRenderer.js:14`）从哪儿又漏回来了。
         ★ 为什么非要这一行：这一支修法**本机复现不出好坏**（四种视口 × 两档 dpr
         全是绿的），他那边强刷之后如果还不行，这一行就是唯一能指认"卡在哪个面"的读数。 */
      + '\n  六个面里 pe 非 none 的：' + (function(){
          var ls = document.querySelectorAll('.face'), o = [];
          for (var i = 0; i < ls.length; i++){
            var s = getComputedStyle(ls[i]);
            if (s.pointerEvents !== 'none'){
              o.push(ls[i].className.replace(/\bface\s*/, '') + '=' + s.pointerEvents);
            }
          }
          return o.length ? '★ ' + o.join('   ') : '（一个都没有 ✓）';
        })()
    + '\n  .scr 包围盒中心 (' + mx + ',' + my + ') 上是 '
      + (tm ? hitOf(tm) + '/' + evName(tm) : 'null')
    + '   视口 ' + vw + '×' + vh
    + (vw === W && vh === H ? '' : '  ★★ `?w=&h=` 传的是 ' + W + '×' + H + '，与真实视口不符！')
    + '\n  屏心摞了 ' + stack.length + ' 层：' + stack.join(' ')
    + '\n  ★ .scr ' + (scrInStack
        ? '**在**这一摞里（浏览器认为屏心就是屏幕）'
        : '**不在**这一摞里 —— 浏览器认为屏心根本没有屏幕')

addEventListener('pointerdown', function(e){
  nWin++; bump(hitBy, hitOf(e.target));
  var a = tapBy[phase] || (tapBy[phase] = [0, 0]);
  a[0]++;
  lastWin = evName(e.target) + ' (' + e.clientX + ',' + e.clientY + ')';
  lastNear = nearIcon(e.clientX, e.clientY);
}, true);

FILES.forEach(function(f){
  WIN[f.id] = { open:false, min:false, max:false, x:f.w[0], y:f.w[1], z:0 };
});

var scrEl = frontEl.querySelector('.scr');
var tksEl = frontEl.querySelector('.tks');
FILES.forEach(function(f){
  winEls[f.id]  = frontEl.querySelector('.win[data-id="' + f.id + '"]');
  iconEls[f.id] = frontEl.querySelector('.ic[data-id="' + f.id + '"]');

function topZ(){ return ++Z; }

/* 任务栏按钮：每个**开着**的窗口一个（关掉的不留 —— 留了就是"点了没反应"）。
   `.on` 给 z 最大且没最小化的那个，不是"所有可见的" —— 同时开三个时
   得一眼看出现在在看哪一份。 */
function syncTask(){
  var live = FILES.filter(function(f){ return WIN[f.id].open; });
  var top = null, tz = -1;
  live.forEach(function(f){
    var s = WIN[f.id];
    if (!s.min && s.z > tz){ tz = s.z; top = f.id; }
  });
  tksEl.innerHTML = live.map(function(f){
    return '<span class="tkw' + (f.id === top ? ' on' : '') + '" data-id="' + f.id
         + '">' + esc(f.name) + ' - 记事本</span>';
  }).join('');
}

function sync(id){
  var s = WIN[id], el = winEls[id];
  el.style.display = (s.open && !s.min) ? 'block' : 'none';
  el.style.zIndex = s.z;
  if (s.max){
    el.style.left = '0px'; el.style.top = '0px';
    el.style.width = SW + 'px'; el.style.height = SH + 'px';
  } else {
    el.style.left = s.x + 'px'; el.style.top = s.y + 'px';
    el.style.width = WINW + 'px'; el.style.height = WINH + 'px';
  }
  /* 桌面图标那个蓝底 = "它开着"。跟着状态走，不写死在 HTML 上 */
  iconEls[id].classList.toggle('on', s.open && !s.min);
  syncTask();
}

/* 点图标：没开就开；最小化了就还原；已经开着就只提到最前（XP 的行为） */
function openFile(id){
  var s = WIN[id];
  if (!s.open){ s.open = true; s.min = false; }
  else if (s.min){ s.min = false; }
  s.z = topZ();                       /* 三条路都提到最前 */
  sync(id);
}
function winAct(id, a){
  var s = WIN[id];
  if (a === 'close'){ s.open = false; s.min = false; s.max = false; }
  else if (a === 'min'){ s.min = true; }
  else if (a === 'max'){ s.max = !s.max; }   /* x/y 一直留着，还原就是回到它 */
  sync(id);
}
/* 点任务栏按钮：最小化的还原，正显示的最小化 */
function taskAct(id){
  var s = WIN[id];
  if (s.min){ s.min = false; s.z = topZ(); }
  else { s.min = true; }
  sync(id);
}

/* 屏幕里按下之后的四支判定（图标 / 任务栏 / 三个按钮 / 窗口）。
   `t` 是**已经判定好**的目标元素 —— 浏览器给的那个，或者几何兜底挑出来的那个
   （见下面 `geoTargetAt`）。抽成具名函数就是为了让那两条路复用同一套逻辑：
   兜底那条只是换了个 `t`，这四支一个字都不用改。

   ★ `zoom` 也算"在里面"（2026-10-08 补）。原来只认 `inside`，于是点开屏幕后
   那 ~1.3 秒里（镜头还在推近）**屏幕上每一次点击都被原样丢掉** ——
   可那 1.3 秒里屏幕**已经看着是满屏的了**，用户的手早就放上去了。
   用户报的「屏幕放大了，但里面的图标 / 窗口 / 叉号点了没反应」就是它，
   `_logs/_heroray.py` ⑥ 复现出来是四次连点全无反应、1.5 秒后才开。
   图标 / 任务栏 / 三个按钮都是**瞬时**动作，命中由浏览器在按下的那一刻判，
   镜头还在飞也判得准，所以现在一律放行。
   ★ 只有**拖标题栏**仍旧要求 `inside` —— 那个位移要拿 `scrEl` 的 rect 反算缩放
     （见下面 `wdrag.k`），镜头移动时 rect 每帧在变，拖起来会飘。
   `ready` / `back` 仍挡着：那时屏幕只有几十像素宽，点不准，而且 469 行已经把
   `.screen` 排除在相机拖动之外，两边互不打扰。 */
function screenDown(t, e){
  if (!t || !t.closest || e.isPrimary === false || e.button !== 0) return;

  var st = t.closest('.st');
  if (st){ pd = {k:'start', pointerId:e.pointerId, x:e.clientX, y:e.clientY}; return; }

  var ic = t.closest('.ic');
  if (ic){ pd = {k:'icon', id:ic.getAttribute('data-id'), x:e.clientX, y:e.clientY}; return; }

  var tk = t.closest('.tkw');
  if (tk){ pd = {k:'task', id:tk.getAttribute('data-id'), x:e.clientX, y:e.clientY}; return; }

  var bz = t.closest('.bz b');
  if (bz){
    pd = {k:'btn', a:bz.getAttribute('data-a'),
          id:t.closest('.win').getAttribute('data-id'), x:e.clientX, y:e.clientY};
    return;
  }

  var w = t.closest('.win');
  if (w){
    var id = w.getAttribute('data-id'), s = WIN[id];
    s.z = topZ(); sync(id);           /* 点窗口任意处 → 提到最前 */
    /* 标题栏 → 开始拖。★ 最大化时不给拖：x/y 是"还原后回哪"的备份，
       拖动会把它改掉，于是 □ 还原就回不到原处了。要挪先按 □ 还原。 */
    /* `phase === 'inside'` 是必须的：`wdrag.k` 用 rect 反算缩放，镜头还能动时会飘 */
    if (phase === 'inside' && t.closest('.wtb') && !s.max){
      /* 屏幕在页面上被 CSS3D 缩放过（1440×900 下是 3.086×），位移不能直接加，
         得除以当前缩放才是屏幕内部 px。用**差分**不用绝对坐标：差分对仿射
         变换成比例，斜视时那点透视误差远小于手感阈值。
         `|| 1` 是兜底：屏幕还没布局时 rect.width 是 0，除零会把窗口送走。 */
      wdrag = { id:id, x:e.clientX, y:e.clientY, ox:s.x, oy:s.y,
                k:(scrEl.getBoundingClientRect().width / SW) || 1 };
    }
  }
}

scrEl.addEventListener('pointerdown', function(e){
  /* 这一层收到 == 事件确实走进了屏幕区。★ 和上面 window 捕获层记的是**同一相位**：
     捕获先于目标阶段，两个监听器之间不会有帧、`phase` 不会变。
     ★ 注意这一层**不**让兜底层替它计数（见下面 `nRescue`）—— `nScr` 的原意就是
       "浏览器真的把事件送到了屏幕区"，补上它就等于把诊断信号抹掉。 */
  nScr++;
  (tapBy[phase] || (tapBy[phase] = [0, 0]))[1]++;
  evLog_('↓', e, ' phase=' + phase);
  if (phase !== 'inside' && phase !== 'zoom') return;
  screenDown(e.target, e);
});

/* ── 命中判定的几何兜底 ────────────────────────────────────────────
   ★★ 2026-10-09，用户第四报。他那本台账把范围钉死在 **hit-test 那一层**：

     几何普查 屏心 other/div.face.front(内) · 左上(内) · 右上(内) · 左下(内) · 右下(内)
       .scr 396,124,807,613   .screen 396,124,807,613   .bezel 341,58,917,732
     屏心摞了 11 层：div.face div.wtx div.win div.xp div.scr div.screen div.face …
     ★ .scr **在**这一摞里
     （window 收到 33 次 / 屏幕区收到 **0** 次，按相位 inside 31/0）

   ⇒ **布局层完全正确**（`.scr` 的矩形罩住五个探测点、`elementsFromPoint` 里也有它），
     坏的是**浏览器把命中判到了 `.scr` 的祖先身上**。而且它是**相位相关**的：
     `ready` 相位好得很（他那台账里 `命中 btn 1`，说明远景下指针能走到窗口按钮上），
     只有推进到 `inside` 之后才整个失灵。

   ★ 上面 `add()` 里删掉 three.js 那条内联 `pointer-events` 是第一支修法（让外壳
     真正让开，hit-test 的候选只剩 `.screen` 一棵子树）。但**本机四种视口 × 两档 dpr
     一次都复现不出来**，所以那一支只能算"按证据推的"，他那边能不能好没人知道。
     于是再加这一支：**不跟浏览器的判定讲道理，自己算。**

   ★ 算法只用一条：`elementsFromPoint` 在 CSS3D 下的**整体顺序不可信**（3D 的 z 序是
     投影之后才定的，而它按 CSS 层叠排），但**屏幕那一支内部的顺序是可信的** ——
     那里面全是同一平面上的普通 2D 元素。他的台账就是证据：
     `.wtx .win .xp .scr .screen`，记事本内容区压着窗口、窗口压着桌面，从顶到底一路正确。
     所以取"第一个落在 `.screen` 子树里的"就是该点的真正目标。

   ★ 只在**浏览器判定没进屏幕**、而几何判定进了的时候才动手 ⇒ 浏览器判对了就一个字节
     都不碰（本机所有情况都走那条），判错了才补。两个计数分开记，`nRescue` 归零就说明
     第一支修法治好了，这一支一次都没上岗。 */
function geoTargetAt(x, y){
  var list;
  try { list = document.elementsFromPoint(x, y); } catch (err){ return null; }
  for (var i = 0; list && i < list.length; i++){
    var e = list[i];
    if (e.closest && e.closest('.screen')) return e;
  }
  return null;
}

addEventListener('pointerdown', function(e){
  /* 浏览器判对了 —— 原路径一字不动。 */
  if (e.target && e.target.closest && e.target.closest('#esc,.screen')) return;
  if (phase !== 'inside' && phase !== 'zoom') return;
  var t = geoTargetAt(e.clientX, e.clientY);
  if (!t) return;                 /* 几何上也不在屏幕里 ⇒ 确实不是在点屏幕 */
  nRescue++;
  evLog_('↓', e, ' phase=' + phase + ' ★兜底', t);
  screenDown(t, e);
}, true);

/* 滚轮同一条道理：`.wtx` 的滚动是浏览器原生的，也要靠 hit-test 才找得到它。
   用户原话「我在没放大的时候甚至可以滑里面的那个上下的那个东西」—— 放大后那东西
   也一起失灵了。这里按几何把 deltaY 转交给 `.wtx`。 */
addEventListener('wheel', function(e){
  if (e.target && e.target.closest && e.target.closest('.screen')) return;
  if (phase !== 'inside') return;
  var t = geoTargetAt(e.clientX, e.clientY);
  if (!t) return;
  var sc = t.closest('.wtx');
  if (!sc) return;
  sc.scrollTop += e.deltaY;
  e.preventDefault();
}, {capture: true, passive: false});

addEventListener('pointermove', function(e){
  if (pd && pd.k === 'start' && e.pointerId === pd.pointerId
      && Math.hypot(e.clientX-pd.x,e.clientY-pd.y)>=7) pd=null;
  if (!wdrag) return;
  var s = WIN[wdrag.id];
  /* 夹住：至少留 40px 标题栏在屏内，否则窗口能被拖到再也抓不回来。
     纵向不让它钻到任务栏底下（SH 已经扣掉 13）。 */
  s.x = clamp(wdrag.ox + (e.clientX - wdrag.x) / wdrag.k, -(WINW - 40), SW - 40);
  s.y = clamp(wdrag.oy + (e.clientY - wdrag.y) / wdrag.k, 0, SH - 12);
  sync(wdrag.id);
});

addEventListener('pointerup', function(e){
  wdrag = null;
  /* ★ 和上面 `goInside()` 同一条判据（< 7px 才算点击）：拖动松手时那几像素
     抖动不该被当成"点了一下"。`pd` 存的是 **id 不是元素** —— 任务栏按钮
     每次 sync 都会被重建，存元素等于存了个已经从 DOM 上摘下来的东西。
     ★ `fired` 只给 `?dbg=1` 的台账用：`pd=null`（按下时没命中）、
     `位移超 7px 丢掉`、`开了 xxx` 三种要能从屏幕上一眼分开。 */
  var fired = '（按下时没命中任何东西）';
  if (pd && (phase === 'inside' || phase === 'zoom')
      && Math.hypot(e.clientX - pd.x, e.clientY - pd.y) < 7){
    if (pd.k === 'start'){
      var released = geoTargetAt(e.clientX, e.clientY);
      if (e.pointerId === pd.pointerId && released && released.closest('.st')){
        goBack(); fired = '返回电脑远景';
      }
    }
    else if (pd.k === 'icon'){ openFile(pd.id); fired = '开了 ' + pd.id; }
    else if (pd.k === 'task'){ taskAct(pd.id); fired = '任务栏 ' + pd.id; }
    else if (pd.k === 'btn'){ winAct(pd.id, pd.a); fired = '窗口按钮 ' + pd.a; }
  } else if (pd){
    fired = '★ 位移超 7px —— 当成拖，丢掉了';
  }
  evLog_('↑', e, ' pd=' + (pd ? pd.k + ':' + pd.id : 'null') + ' → ' + fired);
  pd = null;
});

/* ── 相机 ─────────────────────────────────────────────────────── */
/* 开场：给 yaw 一个**小的初速度**，靠阻尼滑停 —— 不再是从 `ORB_FROM` 转 2π 的过场。
   ★ 2026-10-08 用户报「开局一个大旋转霸体」。原来 `ORB_DUR = 6.0` 转一整圈，
     而那 6.9 秒里 `phase` 一直是 `'enter'` —— `goInside()` 头一行就是
     `if (phase !== 'ready') return`，`pointerdown` 里的 `drag = …` 也要求 ready，
     **两个入口同时被它挡着**。实测：2.5s 时点屏幕中心，事件确实送到了 `.wtx` 上
     （`elementFromPoint` 给的就是它），只是进了闸就没了下文。
     现在 `phase` 从第 0 帧起就是 `'ready'`：想进屏幕随时点得进，想拖随时拖得动。
   位移 = V0/K（指数衰减的总行程），所以把起点往回推 `ORB_OFF`，**正好停在正面**。 */
var ORB_V0 = 1.1, ORB_K = 2.0;          // rad/s、1/s（τ=0.5s，约 2s 滑停）
var ORB_OFF = ORB_V0 / ORB_K;           // 0.55 rad ≈ 31.5°，要转的总角度
var ORB_FROM = -0.42;                   // 停下时的角度（就是原来的默认视角）
var LEAD = 0.9;                         // 淡入
var PITCH    = -0.06, ORB_DIST = 1400;
/* 点开后：相机正对屏幕中心，屏幕占视口约 63%×79%（机身四周还留一圈） */
var ZOOM_POS  = new THREE.Vector3(0, SCR_CY, BD / 2 + 380);
var ZOOM_LOOK = new THREE.Vector3(0, SCR_CY, BD / 2);

var camPos  = new THREE.Vector3(0, 0, ORB_DIST);
var camLook = new THREE.Vector3(0, 0, 0);
var yaw = ORB_FROM - ORB_OFF, tgtYaw = yaw, tgtPitch = PITCH;
var yawV = ORB_V0;                      // 开场动量；一拖动、或滑停就归零
var phase = 'ready';                    // ★ 从第 0 帧起就能用（见上面 ORB_V0 那段）
var lastT = 0;                          // 上一帧的钟，用来算 dt（开场动量的衰减）
var hintDone = false;                   // 开场那句提示只发一次（见 frame 里那段注释）
var t0 = performance.now();

function clamp(v,a,b){ return v < a ? a : v > b ? b : v; }
/* ★ 帧率无关的阻尼系数：`p` 是"60fps 下每帧该走的比例"，返回这一帧该走的比例。
   原来是 `lerp(tp, 0.07)` —— **每帧固定 7%，与 dt 无关**，于是镜头推进要走满 77 帧：
   60fps 下 1.28 秒，10fps 下 7.7 秒。而 `phase` 从 `zoom` 翻到 `inside` 之前，
   屏幕上**每一次点击都被丢掉**（`scrEl` 那条 `if (phase !== 'inside') return`）。
   2026-10-08 实测（`_logs/_heroray.py` ⑥）：点屏幕后 0.05 / 0.25 / 0.50 / 0.90 秒
   各点一次桌面图标，**四次全是"没反应"**；1.5 秒后才开。
   用户报的就是这个：「屏幕放大了，但里面的图标 / 窗口 / 叉号点了没反应」。
   ★ 60fps 下与原来**逐帧相等**（1−e^(−4.354/60) = 0.0700 = 原来的 0.07），
   所以这不是调手感，只是把"按帧"换成"按秒"。同一坑见 handfeel.md §7。 */
function damp(p, dt){
  if (p >= 1) return 1;                       /* `p=1` 是"一帧到位"，别走 log(0) */
  return 1 - Math.exp(Math.log(1 - p) * 60 * dt);
}
function orbitPos(y, pt, d, out){
  var cp = Math.cos(pt), sp = Math.sin(pt);
  return out.set(Math.sin(y)*cp*d, -sp*d, Math.cos(y)*cp*d);
}

/* ── 交互 ─────────────────────────────────────────────────────── */
var drag = null, down = null, backgroundDown = null, hud = document.getElementById('hud');
function setHud(txt){ hud.textContent = txt; hud.classList.add('on'); }
function syncPower(){
  var el = document.getElementById('esc');
  var label = phase === 'ready' ? '退出开发室' : '返回电脑远景';
  el.setAttribute('aria-label', label); el.title = label;
  /* 不设 disabled：键盘焦点留在同一个出口。 */
  el.setAttribute('aria-disabled', phase === 'back' ? 'true' : 'false');
}

/* 外壳 pointer-events 必须继续让开屏幕，所以背景不能靠 DOM 的命中来猜。
   投影机身包围盒和前凸台阶的真实角点，求凸包；屏幕/窗口另行排除。
   投影轮廓取保守的外边界：圆角附近不误把机身当背景。 */
function bodyHull(){
  var points = [], v = new THREE.Vector3();
  [[-BW/2,BW/2,-BH/2,BH/2,-BD/2,BD/2],
   [-BW/2+7,BW/2-7,-BH/2-3,-BH/2+106,BD/2,BD/2+30]].forEach(function(b){
    for (var x=0;x<2;x++) for (var y=0;y<2;y++) for (var z=0;z<2;z++){
      v.set(b[x],b[2+y],b[4+z]).project(camera);
      points.push({x:(v.x+1)*W/2,y:(1-v.y)*H/2,z:v.z});
    }
  });
  if (points.some(function(p){return !isFinite(p.x+p.y+p.z) || p.z < -1 || p.z > 1;})) return null;
  points.sort(function(a,b){return a.x-b.x || a.y-b.y;});
  function cross(a,b,c){return (b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);}
  var lo=[],hi=[];
  points.forEach(function(p){while(lo.length>1 && cross(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop();lo.push(p);});
  points.slice().reverse().forEach(function(p){while(hi.length>1 && cross(hi[hi.length-2],hi[hi.length-1],p)<=0) hi.pop();hi.push(p);});
  lo.pop(); hi.pop(); return lo.concat(hi);
}
function isBackground(e){
  var target = document.elementFromPoint(e.clientX,e.clientY);
  if ((target && target.closest && target.closest('#esc,.screen,.win'))
      || (e.target && e.target.closest && e.target.closest('#esc,.screen,.win'))
      || geoTargetAt(e.clientX,e.clientY)) return false;
  var hull=bodyHull();
  if (!hull || hull.length<3) return false;
  var x=e.clientX,y=e.clientY,inside=false;
  for(var i=0,j=hull.length-1;i<hull.length;j=i++){
    var a=hull[j],b=hull[i],dx=b.x-a.x,dy=b.y-a.y;
    var u=clamp(((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy || 1),0,1);
    if(Math.hypot(x-a.x-u*dx,y-a.y-u*dy)<3) return false;
    if((a.y>y)!==(b.y>y) && x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x) inside=!inside;
  }
  return !inside;
}

function goInside(){
  if (phase !== 'ready') return;
  phase = 'zoom'; syncPower(); setHud('[system] 正在进入…');
}
/* 退回一级：屏幕里 → 远景。`zoom` 也算 —— 它只是"正在推近"，
   那 ~1 秒里按 Esc 应该照样能回，否则会让人以为键坏了（要等推完再按一次）。 */
function goBack(){
  if (phase !== 'inside' && phase !== 'zoom') return;
  phase = 'back'; yawV = 0;
  pd = null; wdrag = null; backgroundDown = null; down = null; drag = null;
  syncPower(); setHud('[system] 返回电脑远景…');
}
/* 两级出口：返回途中忽略重复触发；只有远景才通知父页退出。 */
function onEsc(){
  if (phase === 'back') return;
  if (phase === 'inside' || phase === 'zoom'){ goBack(); return; }
  setHud('[system] 退出…');
  wellSay('well-exit');
}

addEventListener('pointerdown', function(e){
  backgroundDown = null;
  if (e.isPrimary === false || e.button !== 0) return;
  if (phase === 'inside' || phase === 'zoom'){
    if (isBackground(e)) backgroundDown = {id:e.pointerId,x:e.clientX,y:e.clientY};
    return;
  }
  if (phase !== 'ready' || (e.target.closest && e.target.closest('#esc'))) return;
  yawV = 0;                       // ★ 手一按，开场动量立刻让位（按住不放也不跟人抢）
  down = { id:e.pointerId, x:e.clientX, y:e.clientY };
  if (!(e.target.closest && e.target.closest('.screen')))
    drag = { x:e.clientX, y:e.clientY, y0:tgtYaw, p0:tgtPitch };
});
addEventListener('pointermove', function(e){
  if (backgroundDown && e.pointerId === backgroundDown.id
      && Math.hypot(e.clientX-backgroundDown.x,e.clientY-backgroundDown.y)>=7) backgroundDown=null;
  if (!drag) return;
  /* ★ 两个减号就是"方向对了"的全部内容，2026-10-08 修的。
     原来是 `+`，用户原话：「你那个开发室的电脑拖拽方向应该全反了」。
     为什么 `+` 是反的，看 orbitPos（上面 434 行）：
       相机 x = sin(yaw)·d，y = −sin(pitch)·d
     右拖 dx>0 → `yaw` 增 → 相机往右绕 → **画面往左走**，手感像在推一堵墙。
     要的是"手抓住机器往右拽" ⇒ 机器正面朝右 ⇒ 相机往**左**绕 ⇒ yaw 减。
     下拖同理：`pitch` 增 ⇒ 相机 y 减（往下）⇒ 看到**底面**；手往下拽要看到顶面。
     同一个坑 `town.html:3628` 已经付过一次学费（「原来写的是 yaw0 + dx*K，
     手感像在推一堵墙」），这里是把它抄过来的第二条。
     ★ 灵敏度（0.0075 / 0.0045）没动，只翻了号 —— 手感是另一件事，等出图再调。 */
  tgtYaw   = drag.y0 - (e.clientX - drag.x) * 0.0075;
  tgtPitch = clamp(drag.p0 - (e.clientY - drag.y) * 0.0045, -0.7, 0.7);
});
addEventListener('pointerup', function(e){
  if (backgroundDown && e.pointerId === backgroundDown.id
      && (phase === 'zoom' || phase === 'inside')
      && Math.hypot(e.clientX-backgroundDown.x,e.clientY-backgroundDown.y)<7 && isBackground(e)) goBack();
  backgroundDown = null;
  if (down && e.pointerId === down.id && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 7
      && phase === 'ready' && e.target.closest && e.target.closest('.screen')){
    evLog_('⇢', e, ' goInside()'); goInside();
  }
  down = null; drag = null;
});
addEventListener('pointercancel', function(){pd=null;wdrag=null;down=null;drag=null;backgroundDown=null;});
addEventListener('blur', function(){pd=null;wdrag=null;down=null;drag=null;backgroundDown=null;});
addEventListener('keydown', function(e){ if (e.key === 'Escape' && !e.repeat) onEsc(); });
/* 左上角那个标记也能点 —— 用户只说"有个 ESC"，但鼠标用户会去戳它。
   ★ 它还是**最可靠的那个退出口**：这一页挂进 iframe 后，焦点在父页时
     它自己的 `keydown` 收不到（ESC 得靠父页转发，见文件末尾）。
     DOM 点击不依赖焦点，所以"一进来什么都没点就想退"走这个。 */
var escEl = document.getElementById('esc');
escEl.addEventListener('click', onEsc);
/* 原生 button 自带 Enter/Space 激活，不能再手动补一遍。 */
/* 屏幕里那层是固定尺寸的，滚轮不该滚整页 */
addEventListener('wheel', function(e){ if (phase !== 'inside') e.preventDefault(); },
                 { passive:false });

addEventListener('resize', function(){
  W = innerWidth; H = innerHeight;
  camera.aspect = W / H; camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

/* ── 主循环 ───────────────────────────────────────────────────── */
var dbg = document.getElementById('dbg');
var stage = document.getElementById('stage');
var _v = new THREE.Vector3(), _z = new THREE.Vector3(0, 0, 0);

function frame(now){
  /* 闸：每帧把钟的原点推到**当下** —— 等价于 t 恒为 0，而下面照常渲染第 0 帧。
     ★ 不能写成 `if (GATE) return;`：那是"不画"，解冻那一刻会先空一拍再蹦出来，
       而闸的整个意义就是"解冻前后连着"（上一帧就是解冻后的第一帧）。
     代价：闸期间这一页仍然每帧渲染。可见的只有一台静止的机器，rAF 很便宜。 */
  if (GATE) t0 = now;
  var t = PIN.t !== null ? PIN.t : (now - t0) / 1000;
  /* 开场动量用**帧率无关**的指数衰减（同画廊那条 `v *= exp(-K*dt)`）。
     ★ 闸期间 `dt` 必须为 0 —— `if (GATE) return` 那种写法不能用（解冻会空一拍，
       而闸的意义就是"解冻前后连着"），但也不能让闸期间镜头自己转起来，
       那就不叫"冻在入场第 0 帧"了。 */
  var dtRaw = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  var dt = GATE ? 0 : dtRaw;
  /* ★★ `dtRaw` 是给**镜头推进**用的，不吃闸（2026-10-08 补）。
     闸把 `dt` 归零，冻的是**入场**（开场动量 + 淡入钟）—— 那是对的。
     但 `goInside()` 是**用户点的**，不是入场的一部分：旧的 `lerp(tp, 0.07)`
     不看 dt，所以"闸期间点屏幕"照样推得进去；我把它换成 `damp(p, dt)` 之后
     `damp(p, 0) === 0`，**镜头一步不走**，phase 永远卡在 `'zoom'`。
     这不是新 bug，是我引进的**不对称**。
     `_logs/_gateclick.py` 量到的：带闸点屏幕，`.scr` 宽 7 秒恒 **265** 不动；
     不带闸同一条路 233 → 695 → 856 → 858，三秒进 `inside`。
     ★ 用 `dtRaw` 是安全的：下面那个 lerp 块只在 `zoom/inside/back` 里跑，
       而闸期间不点屏幕就只可能是 `ready`（走 else 那支，仍然吃 `dt=0`，照旧冻着）。 */

  /* ★ 淡入**提到分支外面**：原来它写在 else 里，而 `goInside()` 之后 phase 变
     `'zoom'`、走的是 if 那支 —— 于是"头 0.9 秒内点进去"会让 `#stage` 永远拿不到
     `on`（opacity 恒 0，推进去了却什么都看不见）。现在两支都判得到它。 */
  if (PIN.yaw === null && t > LEAD){
    stage.classList.add('on');
    /* ★ 这句提示原来是"转完一圈"（6.9 秒）那一刻才弹的 —— 现在**第 0 帧就能点、
       能拖**，提示就该在淡入完成时出现。和 `on` 同一条件，两者一起亮。
       藏着不说，用户只会以为"点不动"（他就是这么报的）。
       ★★ 但必须**只发一次**（`hintDone`）。这一块**每帧都跑**，而第二级 Esc 会把
       HUD 改成「退出…」时 `phase` 仍停在 `ready` —— 不设标志的话那一句当场被
       覆盖回「点击屏幕」，用户看到的是"按了 Esc 什么都不发生"。
       这是 `_deskgate.py` ⑤ / `_deskwin.py` ④ 抓出来的（两条同时红）。 */
    if (phase === 'ready' && !hintDone){ hintDone = true; setHud('[system] 点击屏幕 · 拖动旋转'); }
  }

  if (phase === 'zoom' || phase === 'inside' || phase === 'back'){
    /* 推进 / 退出 —— 阻尼靠近目标，不要一帧到位 */
    var inside = (phase !== 'back');
    var tp = inside ? ZOOM_POS : orbitPos(tgtYaw, tgtPitch, ORB_DIST, _v);
    var tl = inside ? ZOOM_LOOK : _z;
    /* 返回仍走原相机位置/lookAt 路径，只加快退距收敛，不加 yaw 或整体缩放。 */
    camPos.lerp(tp, damp(inside ? 0.07 : 0.18, dtRaw));
    camLook.lerp(tl, damp(inside ? 0.09 : 0.20, dtRaw));
    if (phase === 'zoom' && camPos.distanceTo(ZOOM_POS) < 6){
      phase = 'inside'; syncPower(); setHud('[system] 电源 / Esc 返回电脑远景');
    }
    if (phase === 'back' && camPos.distanceTo(tp) < 2 && camLook.distanceTo(tl) < 0.5){
      camPos.copy(tp); camLook.copy(tl);
      phase = 'ready'; syncPower(); setHud('[system] 点击屏幕 · 拖动旋转');
    }
  } else {
    /* 开场动量：推进 tgtYaw，速度指数衰减；滑停就撒手，之后只由拖动写。
       ★ 停下时把 tgtYaw 钉回 `ORB_FROM`，不留那点残差 —— 否则每次开场的落地
         角度都差几毫弧度，而那个角度是设计好的默认视角。 */
    if (PIN.yaw === null && yawV !== 0){
      tgtYaw += yawV * dt;
      yawV *= Math.exp(-ORB_K * dt);
      if (Math.abs(yawV) < 0.02){ yawV = 0; tgtYaw = ORB_FROM; }
    }
    /* 镜头交给拖动（tgtYaw/tgtPitch）；`?yaw=` 那条路是钉死的 */
    var free = (PIN.yaw === null);
    var ty = PIN.yaw !== null ? PIN.yaw * Math.PI / 180 : tgtYaw;
    yaw = ty;
    orbitPos(ty, free ? tgtPitch : PITCH, ORB_DIST, _v);
    camPos.lerp(_v, free ? damp(0.14, dt) : 1);
    camLook.lerp(_z, damp(0.2, dt));
  }

  camera.position.copy(camPos);
  camera.lookAt(camLook);
  renderer.render(scene, camera);

  /* ★ 几何普查：每 0.5 秒问一次"这几个点上站的是谁"。
     不敢每帧跑 —— `elementFromPoint` 会强制布局，而这页每帧主线程只有 ~2ms。 */
  if (DBGON && (phase === 'inside' || phase === 'ready') && now - lastCensus > 500){
    lastCensus = now; runCensus();
  }

  /* 读数盒子：`?dbg=1` / `?probe` 才开（定义见文件末尾，三条定格路强制关）。
     ★★ 2026-10-09 收工：第四报修好之后这里**改回默认关**，理由与做法见末尾那段注释。 */
  if (DBGON){
    dbg.textContent = 'phase ' + phase + '   t ' + t.toFixed(2) + '  yaw '
      + (yaw * 180 / Math.PI % 360).toFixed(1) + '°\n机身 ' + BW + '×' + BH + '×' + BD
      + '   viewport ' + innerWidth + '×' + innerHeight + '   dpr ' + devicePixelRatio
      + (innerWidth === W && innerHeight === H
         ? '' : '   ★?w=&h= 传的 ' + W + '×' + H + ' 与视口不符')
      + '   errs ' + (window.__errs || []).length
      /* ★★ 两级计数 —— 这一行是给"像个图片"定性的那一行：
         window 涨而 .scr 不涨 ⇒ 有东西盖在屏幕上；两个都不涨 ⇒ 事件没进这一页。 */
      + '\n指针：window 收到 ' + nWin + ' 次 / 屏幕区收到 ' + nScr + ' 次'
      /* ★ 2026-10-09：兜底层上岗了几次。**这个数归零 = 第一支修法就够了**，
         非零 = 浏览器判定仍然进不了屏幕、靠几何补的。两支谁在干活，看这个数。 */
      + (nRescue ? '   ★几何兜底补了 ' + nRescue + ' 次' : '')
      + (lastWin ? '   最近 ' + lastWin + ' → ' + lastNear : '')
      /* ★ 按相位分：`ready` 下屏幕只有 235×209，点在机身/空白上就是"只到 window"
         —— 光看总量会把这种和"被盖住"混成一谈。 */
      + '\n  按相位（window/屏幕区） ' + fmtTap()
      /* ★★ 按命中对象分 —— 这一条是决定性的：**没有 `ic` 就说明从来没有一次
         点击落在图标上**，那不是"点不动"，是"瞄的不是那儿"。 */
      + '\n  命中 ' + fmtHit()
      /* ★ 几何普查（每 0.5 秒刷一次，见 `runCensus`）。`ready` 与 `inside`
         两个相位都印 —— 两个读数一比，差的就是相机位置那点事。 */
      + (census ? '\n几何普查 ' + census : '')
      /* 台账跟着 `PIN.dbg` 走（`?d=0` 时也印 —— 那一栏正是要看的东西） */
      + (PIN.dbg || Q.get('d') === '0'
         ? '\n' + (evLog.length ? evLog.join('\n') : '（还没点过）') : '');
  }
  requestAnimationFrame(frame);
}

/* ?go=1 —— 直接停在"已点开"的状态（探针拍终态用） */
if (PIN.go){
  yawV = 0;
  phase = 'inside';
  camPos.copy(ZOOM_POS); camLook.copy(ZOOM_LOOK);
  stage.classList.add('on'); setHud('[system] 电源 / Esc 返回电脑远景');
} else if (PIN.yaw !== null){
  yawV = 0;
  phase = 'ready'; stage.classList.add('on');
  orbitPos(PIN.yaw * Math.PI / 180, PITCH, ORB_DIST, camPos);
  camLook.set(0, 0, 0); tgtYaw = PIN.yaw * Math.PI / 180;
} else if (PIN.t !== null){
  /* `?t=` 的语义是"入场已经结束、停在正面"（探针拿它拍终态：`_deskwin.py` 的 `&t=10`）
     —— 所以开场动量也一并跳过去，否则那些用例拍到的是"还在转"的中间态。 */
  yawV = 0; tgtYaw = ORB_FROM; yaw = ORB_FROM;
  orbitPos(ORB_FROM, PITCH, ORB_DIST, camPos);
}
/* 读数盒子：默认藏，`?probe` 或 `?dbg=1` 才开（约定同镇子那三个样张页）。
   ★ 藏起来**不影响探针** —— `display:none` 的元素 `textContent` 照常读得到。
   ★ 三条定格路（`?go=` / `?yaw=` / `?t=`）**一律强制关**，且这条要在最前面：
     探针拍终态时经常 `?go=1&dbg=1` 一起给，不排除就会把这块绿字拍进交付图。
     （`textContent` 照读，所以那几条路的判据一点不受影响。）
   ★★ 2026-10-09 收工：第四报（hit-test 被 three.js 那条**内联** `pointer-events`
     截获）确认修好之后，这里从"诊断期默认打开"**改回默认关**。当时默认打开是因为他走
     「正页 → 小镇 → 开发室」、`desk.html` 的 URL 由 `town.html` 的 `SCENE_SRC.dev` 拼，
     他在地址栏够不着。以后要在开发室里看台账，把 `?dbg=1` 从父页一路传下来，或单开这一页。 */
var DBGON = (PIN.go || PIN.yaw !== null || PIN.t !== null)
          ? false : !!(PIN.dbg || Q.has('probe'));
dbg.style.display = DBGON ? 'block' : 'none';

syncPower();
requestAnimationFrame(frame);

window.__errs = [];
addEventListener('error', function(e){ window.__errs.push(String(e.message) + '@' + e.lineno); });

/* ── 跨文档：这一页是给父页（`town.html`）挂进 iframe 用的 ─────────────
   和井（`fx-throw.html`）走**同一套暗号**，父页那边不用为它分叉：
     well-hello  报到。父页拿它当"真的建好并跑起来了"的**硬判据** ——
                 iframe 的盒子有尺寸完全可能是里面一片空白。
     well-go     父页放行 → 解上面那个 GATE（幕开始让开的那一刻发）。
     well-esc    父页**转发** Escape 进来。这一条是必需的：焦点在父页时，
                 这一页自己的 `keydown` 收不到任何键 —— 而"一进来什么都
                 没点就先按 Esc"恰恰是焦点在父页的。
     well-exit   我这边要退（点了左上角 ESC 标记 / 按了键盘 Esc / 焦点在
                 这一页时按的 Esc）。父页收到就调它的 `sceneExit()`。
   ⚠ 父页那头**不能拿 `e.origin` 当门**：file:// 下它是不透明的，认不出自己人。
     一律用消息里的 `what` 字段认。
   ⚠ 单独打开时 `parent === window`，消息会发给自己。加守卫，否则
     "点 ESC 往自己耳朵里喊一声"（无害但是脏）。 */
function wellSay(what){
  if (window.parent && window.parent !== window)
    window.parent.postMessage({ what: what }, '*');
}
window.addEventListener('message', function(e){
  var d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.what === 'well-go'){ GATE = false; }
  else if (d.what === 'well-esc'){ onEsc(); }
});
/* 报到。双 rAF 是为了等第一帧真的画完再报。 */
requestAnimationFrame(function(){ requestAnimationFrame(function(){
  wellSay('well-hello');
}); });

/* ── 探针 ──────────────────────────────────────────────────────────
   出图一律先挂 `__errs`（规矩），这一页自己那份在上面。
   `gate` / `t` 是"闸到底冻住没有"的**硬判据** —— 光看图分不出"冻在第 0 帧"
   和"刚好转到那个角度"，而 `t` 恒在 0 附近才说明 it 真的没走。
   `aspect` 是 `?w=&h=` 有没有生效的那个数（NaN 或 0 就是没接到尺寸）。 */
window.__deskProbe = {
  state: function(){
    return { phase: phase,
             t: +((PIN.t !== null ? PIN.t : (performance.now() - t0) / 1000)).toFixed(2),
             gate: GATE, w: W, h: H, aspect: +(W / H).toFixed(4),
             yaw: +(yaw * 180 / Math.PI % 360).toFixed(1),
             /* ★ 要判"往哪边转"必须用下面这两个**不取模**的，不能用上面那个：
                左拖时 335.9° → 387.5°，取模回来是 27.5° —— 比 335.9 还**小**，
                判据会整个反过来，而且看着还挺像回事。写探针时踩到过。 */
             yawDeg:   +(yaw * 180 / Math.PI).toFixed(2),
             pitchDeg: +(tgtPitch * 180 / Math.PI).toFixed(2),
             esc: !!document.getElementById('esc'),
             /* 开场动量。探针靠它证明"初速度真的在衰减"（1.1 → 0），
                而不是"根本没给动量" —— 两者看图分不出来。 */
             yawV: +yawV.toFixed(3),
             hud: hud.textContent,
             errs: (window.__errs || []).length };
  },
  /* 窗口：**状态**和 **DOM 上实际的样子**两样都给。只给状态就查不出
     "状态对了但没画出来"（sync 漏了一处 / 被 CSS 覆盖）—— 那正是这一轮
     最容易出的错。`rw/rh/rx/ry` 是元素在页面上的真实矩形（含 CSS3D 的缩放）。 */
  wins: function(){
    var out = {}, top = null, tz = -1;
    FILES.forEach(function(f){
      var s = WIN[f.id], el = winEls[f.id], b = el.getBoundingClientRect();
      if (s.open && !s.min && s.z > tz){ tz = s.z; top = f.id; }
      out[f.id] = { open:s.open, min:s.min, max:s.max, z:s.z,
                    x:+s.x.toFixed(1), y:+s.y.toFixed(1),
                    disp:el.style.display, btns:el.querySelectorAll('.bz b').length,
                    iconOn:iconEls[f.id].classList.contains('on'),
                    rect:[Math.round(b.left), Math.round(b.top),
                          Math.round(b.width), Math.round(b.height)] };
    });
    return { wins: out, top: top, order: tksEl.textContent,
             tks: tksEl.querySelectorAll('.tkw').length,
             scr: [scrEl.offsetWidth, scrEl.offsetHeight] };
  },
  /* 点某个窗口的某个按钮 —— 探针用真鼠标点也行，但这条路能单独验
     "动作本身对不对"，把"坐标算错了"和"按钮坏了"分开 */
  winAct: winAct, openFile: openFile, taskAct: taskAct,
  esc: onEsc, say: wellSay
};
</script>
</body>
