<title>拖拽飞掷 · 样张（准备用在小镇）</title>
<style>
  html,body{margin:0;height:100%;background:#10161F;overflow:hidden;
            font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  #cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #cv.drag{cursor:grabbing}
  /* ★ 默认**不显示**（`display:none`）—— 这堆读数是给开发和探针看的，
     不是页面内容。`?probe` 才开，和 `town.html` / `street.html` / `break.html` 同一条约定。
     这一页原来一直挂着它（本来是样张页），可它现在已经从书店接进正页了。 */
  #hud{position:fixed;left:10px;bottom:10px;color:#8FA3B8;
       font:12px/1.45 ui-monospace,Consolas,monospace;background:#0B1017cc;
       padding:6px 9px;border-radius:6px;white-space:pre;pointer-events:none;
       display:none}

  /* ── 井口的「出口」────────────────────────────────────────────────
     位置**不写在 CSS 里**，由 placeExit() 按 VP（消失点）摆 —— 消失点是
     W/H 的函数，换个窗口大小它就挪，写死在 CSS 里必然对不上。

     ★ 2026-10-07 用户：「出口的字换成黑色」。原来是小镇的暖黄 `C.warm`
     （屋里那盏灯的颜色），是井里**第三个**颜色（红底 / 近黑的字 / 暖黄的它）。
     改成和井里那些字同一个近黑 #150001 —— 压在 #F40B3E 上对比度 4.96:1，
     12px 点阵够读（暖黄那版是 8.7:1，所以是**用户要的样子**换来的，不是漏判）。

     text-shadow 收成 1px 近黑描边，不让灭点旁多出一圈糊晕。
     hover 仍只亮字，键盘 focus 则用细轮廓明确标出；中心仍钉在 VP。

     ⚠ font-size 必须是 12 的整数倍：Zpix 是 12px 点阵，非整数倍时顶点落在
     半像素上、点阵被插值糊掉（`font-weight` 同理，Zpix 没有粗体）。
     ⚠ 这一页没有 `#chat,#chat *` 那条全局规则，font-family 必须在这里写全
     —— 只写 'Zpix' 不给兜底链，缺字时是静默回退到系统字体。 */
  #exit{position:fixed;left:0;top:0;transform:translate(-50%,-50%);
        font-family:'Zpix',ui-monospace,'Cascadia Mono','Consolas',monospace;
        font-size:12px;line-height:1;font-weight:400;
        color:#150001;letter-spacing:1px;
        cursor:pointer;user-select:none;white-space:nowrap;padding:8px;
        text-shadow:0 0 1px #150001}
  #exit:hover{color:#FFF6DC}
  #exit:focus-visible{color:#FFF6DC;outline:1px solid #150001;outline-offset:2px}
  #exit:active{color:#150001}

  /* ── 拿起的纸：第二张 canvas ────────────────────────────────────────
     它只画**被手拿起过**的纸（face>0 或 held），放在 `#exit` **之后** —— 于是
     纸压着「出口」（用户 2026-10-07：「图层要在拿起的纸之下」）。
     井里那些没被碰过的纸照旧画在主 canvas 上（在井里那几行字之前，被字压着）：
     它们属于场景，而拿起来的那张已经成了手上的东西，两者本来就不是一层。

     ★ `position:fixed` 是**必须**的，不是为了铺满：`#cv` 是普通流里的块
     （width/height 100%），多一张同级的流内元素会把它挤成一半高。
       fixed 让它脱离流，`#cv` 照旧铺满整个视口。
     ★ `pointer-events:none` 同样是**必须**的：这张层盖住了整个画面，
       不关掉事件的话底下 `#cv` 再也收不到 pointerdown —— 整页拖不动，
       而症状极像"纸的命中判定坏了"（这个项目在 town.html 上刚栽过一次
       同类的：hover 正常、点不动）。 */
  #cvup{position:fixed;left:0;top:0;width:100%;height:100%;
        display:block;pointer-events:none}
  /* ── 像素字 ──────────────────────────────────────────────────────────
     Zpix（最像素）3.3.0。整包 944 KB，按本页用到的 160 字裁完 5.7 KB 内嵌。
     ★ 这行里的两个数由 `scripts/pix-subset.py` 维护，**别手改** ——
     手写的数字没人记得跟着改，早晚变成谎话。

     这一页本来一个 Zpix 的字都没有（整页是 canvas 画的），是为了井口那个
     「出口」才内联的 —— 所以子集只要重新裁一次就能瘦到很小。
     12px 不是随手挑的：Zpix 是 12px 点阵，字号必须是 12 的整数倍，
     非整数倍时顶点落在半像素上、点阵被插值糊掉。
     ⚠ 缺字是**静默回退**：CSS 一字不错、读代码查不出来，混排出来是
     一半点阵一半平滑，第一眼只会当成"像素字体没生效"。
     **改了这一页的文案就要重跑 `scripts/pix-subset.py --page proto/fx-throw.html`。** */

<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<!-- 井口那个「出口」。位置由 placeExit() 摆（理由见上面 CSS 那段），点它 = 回小镇。
     放在 canvas **之后**是必须的：canvas 铺满全屏且不透明，放前面会被它整个盖住。 -->
<div id="exit" role="button" tabindex="0" aria-label="出口">出口</div>
<!-- 拿起的纸。**必须放在 #exit 之后** —— DOM 顺序就是图层顺序，放在前面纸就被
     「出口」压住了（见上面 #cvup 那段注释）。它 pointer-events:none，不挡鼠标。 -->
<canvas id="cvup"></canvas>
<script>
"use strict";
window.__errs = [];

if (PIN !== null) P.auto = false;
/* ── 入场闸 `?gate=1` ────────────────────────────────────────────────

     `src`，而 `demoT` 是"这份文档活了多久"（见 frame）。实测
     （`_logs/_wellintro.py`，跨文档读这一页自己报的 `#hud`）：
        0.76s 入场 34% ／ 1.69s 入场 75% ／ 2.48s 已经走完

     看不到还难查）。有了闸，它改从"幕开始让开"那一刻起跑。
   ★ 冻的是**钟**，不是画面：`demoT` 停在 0，而 `wellIntro(0)` 照常每帧画 ——
     那就是入场的第 0 帧（棱线内端还在画布外，字板是灭点上的一个小不点）。
     所以解冻前后是连着的，不会跳一下。
   ★ 单独打开这一页不带闸，照常自动播 —— `?gate=1` 只有父页会加。 */
var GATE = Q.has("gate");
/* ?persp= 显式给了就认显式，否则每次 resize 按画面高度重算（见 resize）。 */
var PERSP_SET = Q.has("persp");
/* ?hold=<face> 定格：不跑指针事件，直接把**第一张**纸按在屏上、定死在给定的

   x/y 用 ?holdx= ?holdy= 给，默认屏幕中心偏下一点。
   ★★ 它**证明不了**"拖起来能抽到字"这条链路 —— 它压根不经过 pointerdown，
     是绕过事件直接把状态写死的。复刻页上 `?go=1` 就是这么骗过一次人的
     （只改 phase，点击链是断的，而图上一切正常）。链路要用 CDP 发真鼠标
     事件验（见 _logs/paper-hold.py 的第二个场景）。 */
var FR = Q.has("hold")
       ? { face: clamp(num("hold", 1), 0, 1),
           hx: Q.has("holdx") ? num("holdx", 0) : null,
           hy: Q.has("holdy") ? num("holdy", 0) : null }
       : null;
function frX(){ return FR.hx === null ? W*0.50 : FR.hx; }
function frY(){ return FR.hy === null ? H*0.52 : FR.hy; }

var FONT = '"Arial Black","Arial Bold",Gadget,sans-serif';
var CAP  = 0.716;      // Arial Black 的 cap height / font-size —— 字高要按它换算字号

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
var rnd = mulberry32(parseInt(Q.get("seed"),10) || 20261006);

var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
/* 第二张 canvas：拿起的纸。它只在 frame() 里被 drawUpLayer() 用到 —— 那个函数
   会把全局 `ctx` 临时指到 ctxup 上（跟 layer() 同一套手法）。 */
var cvup = document.getElementById("cvup"), ctxup = cvup.getContext("2d");
var W=0,H=0,DPR=1;
/* 消失点 = 井的口，**也是整个场景的投影中心**。
   原片（_logs/_wod/_x/full_00107.1.png，1280×720）实测线全部汇聚于
   (640, 256) = (0.500W, 0.356H) —— 不是画面中心，相机是俯视的。
   卡片和字共用这一个中心才读得成同一个空间；各用各的中心，两层皮一眼就穿。 */
var VP = {x:0, y:0};
/* 井口那个「出口」的 DOM。**在这里取一次就够** —— 它在 HTML 里，脚本跑起来时
   已经存在；而它的位置每帧都在变（VP 跟着 W/H 走），所以位置是摆出来的、不是取出来的。 */
var exitEl = document.getElementById("exit");
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.max(1,Math.round(W*DPR));
  cv.height= Math.max(1,Math.round(H*DPR));
  /* ★ 上面把 canvas 的**属性**尺寸设成了 W*DPR，于是它的**绘制坐标系是设备
     像素**，而 W/H 是 CSS 像素。这里把坐标系乘回 DPR，两者才对得上。
     少了这一句，整个画面只画到左上角 1/DPR² 那一块，剩下的露出 body 底色 ——
     DPR=2 时正好是左上四分之一。
     ★★ 这个错**只在真人打开页面时**出现：本项目的无头探针一律跑在
     `--force-device-scale-factor=1` / `deviceScaleFactor=1` 上，DPR 恒为 1，
     出图张张正常。同理还有 frame() 里那个 demoT 时钟。 */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  /* 纸层跟着一起改尺寸。★ 它和 #cv 必须**同尺寸同变换** —— 纸的四个角点是
     屏幕坐标（sheetQuad 算出来的），两张画布差一个像素，纸看着就在井壁上
     错开一格，而这件事在静态图上永远看不出来（只有拖动时才显形）。
     #cvup 的 CSS 尺寸是 100%（跟 #cv 一样），所以这里直接复用 W/H，不另量。 */
  cvup.width = Math.max(1,Math.round(W*DPR));
  cvup.height= Math.max(1,Math.round(H*DPR));
  ctxup.setTransform(DPR, 0, 0, DPR, 0, 0);
  VP.x = W*P.vpw; VP.y = H*P.vph;
  /* ★ 透视尺度跟着**画面高度**走，不是写死 900。900 这个数是照原片 1280×720 量的
     （= 1.25×720）；写死它，换个高度整口井就散 —— 1440×900（16:10）实测末行的
     底边落到屏幕外 87px。跟着 H 走则井的构图在任何高度下都跟原片一致，多出来的
     宽度只是两侧的背景。
     ★ 所有长度量必须**共用一个尺度**，这是要害：`y0` 按 H 缩、`zj` 却按固定的
     persp 缩，两者的比值会随高度漂，行距就乱了 —— 只改 persp 不改 y0（y0 本来
     就按 H）正好配平。 */
  if (!PERSP_SET) P.persp = H*1.25;

}
/* 「出口」钉在井口中心。**它和 canvas 上那口井共用同一个 VP**，绝不另算一个 ——
   两处各算一次迟早会漂开，而"字没在井口上"只能靠看图发现，代码里读不出来。
   `min(W,H)` 那种"画面比例"式的算法在这里是错的：VP 本来就是 W*P.vpw / H*P.vph，
   照抄它才叫同一个点。 */
function placeExit(){
  if (!exitEl) return;
  exitEl.style.left = VP.x + "px";
  exitEl.style.top  = VP.y + "px";
}
addEventListener("resize", resize);

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
/* 跟手/速度都用指数滤波**按 dt 折算**，不是每帧固定比例 ——
   固定比例会让手感随帧率变，120Hz 上"更跟手"、30Hz 上"发飘"。 */
function follow(cur, target, k, dt){ return cur + (target-cur)*(1-Math.exp(-k*dt)); }

var REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ── 3D 小工具 ───────────────────────────────────────────────────── */
function rot3(p, rx, ry, rz){
  var cx=Math.cos(rx), sx=Math.sin(rx), cy=Math.cos(ry),
      sy=Math.sin(ry), cz=Math.cos(rz), sz=Math.sin(rz);
  var x=p[0], y=p[1], z=p[2];
  var x1 = x*cz - y*sz, y1 = x*sz + y*cz;          // Rz
  var x2 = x1*cy + z*sy, z2 = -x1*sy + z*cy;       // Ry
  return [x2, y1*cx - z2*sx, y1*sx + z2*cx];       // Rx
}
/* 透视投影：z 越大越近。z=0 落在比例 1 上，所以卡片的"静止面"就是 z=0。
   投影中心是**消失点**不是画面中心 —— 于是 z=0 平面上，世界坐标 (x,y) 直接
   就是"离消失点多少像素"。 */
function proj(p){ var k = P.persp/(P.persp - p[2]); return [VP.x + p[0]*k, VP.y + p[1]*k, k]; }

/* 卡片是**薄盒子**。六个面按平均深度排序后依次画，就是画家算法 ——
   凸体用这个永远对，不需要 z-buffer。
   n 记的是**物体自己的**轴向，不是屏幕方向：书转到任何角度，"+x 面"都还是
   书口那一面。光靠 front/back/side/edge 分不出左右，而书本的六面恰好是
   「封面 / 封底 / 书脊 / 书口 / 上切口 / 下切口」六个各不相同的颜色。 */
var FACES = [
  {i:[0,1,2,3], c:"front", n:"+z"}, {i:[4,5,6,7], c:"back",  n:"-z"},
  {i:[1,2,6,5], c:"side",  n:"+x"}, {i:[0,4,7,3], c:"side",  n:"-x"},
  {i:[0,1,5,4], c:"edge",  n:"-y"}, {i:[3,7,6,2], c:"edge",  n:"+y"}
];

function Card(seed, x, y){
  this.seed = seed;
  var r = mulberry32(seed);
  /* 书的开本。比明信片（150~220 宽、h/w≈1.29、t/w≈0.11）更狭长也更厚：
     ★ 厚度是关键的一笔。书口那叠纸页是整个形状上**唯一认得出"这是书"**的记号，
       盒子太薄就只剩一块板。t/w 从 0.11 提到 0.22~0.32，纸页层线才画得下。 */
  this.w = 132 + r()*52;
  this.h = this.w * (1.36 + r()*0.16);   // 竖开本
  this.t = this.w * (0.22 + r()*0.10);
  this.x = x; this.y = y; this.z = 0;
  this.vx = 0; this.vy = 0; this.vz = 0;
  this.rx = (r()-0.5)*0.5; this.ry = (r()-0.5)*0.7; this.rz = (r()-0.5)*0.22;
  this.wx = 0; this.wy = 0; this.wz = 0;
  this.held = false; this.dying = 0; this.dead = false;
  this.bob = r()*6.28;
}

/* 局部 8 角：0..3 前面，4..7 后面 */
function corners(c){
  var w=c.w/2, h=c.h/2, t=c.t/2;
  var L = [[-w,-h,t],[w,-h,t],[w,h,t],[-w,h,t],[-w,-h,-t],[w,-h,-t],[w,h,-t],[-w,h,-t]];
  var out = [];
  for (var i=0;i<8;i++){
    var p = rot3(L[i], c.rx, c.ry, c.rz);
    out.push([p[0]+c.x, p[1]+c.y, p[2]+c.z]);
  }
  return out;
}

function poly(pts, fill){
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
}

/* 把局部坐标 (u,v)（u,v ∈ -1..1）放到卡片的**正面**上。
   照片是**矢量面片**画的，不是贴图 —— 贴图在透视下需要单应变换，
   canvas 只有仿射，硬贴会在强透视时明显歪掉。矢量面片每个顶点单独
   投影，透视天然是对的。 */
function onFace(c, u, v, dz){
  var w=c.w/2, h=c.h/2;
  var lx = u*w, ly = v*h, lz = c.t/2 + (dz||0);
  var p = rot3([lx,ly,lz], c.rx, c.ry, c.rz);
  return [p[0]+c.x, p[1]+c.y, p[2]+c.z];
}
function faceQuad(c, u0,v0,u1,v1, dz, fill){
  poly([onFace(c,u0,v0,dz), onFace(c,u1,v0,dz),
        onFace(c,u1,v1,dz), onFace(c,u0,v1,dz)].map(proj), fill);
}

/* 物体**侧面**上的点：side=+1 是物体自己的 +x 面（书口），-1 是 -x 面（书脊）。
   v ∈ -1..1 沿书高，z 是沿**厚度**的世界单位（±t/2）。
   ★ 纸页的层线必须走这条参数化，不能在屏幕上按 y 均分 —— 书一转，屏幕上"竖着"
     的方向就不是书口上那个方向了，线会斜着穿出封面。 */
function onSide(c, side, v, z){
  var w=c.w/2, h=c.h/2;
  var p = rot3([side*w, v*h, z], c.rx, c.ry, c.rz);
  return [p[0]+c.x, p[1]+c.y, p[2]+c.z];
}
function sideQuad(c, side, v0, v1, z0, z1, fill){
  poly([onSide(c,side,v0,z0), onSide(c,side,v1,z0),
        onSide(c,side,v1,z1), onSide(c,side,v0,z1)].map(proj), fill);
}

/* 六个面各是什么颜色。认的是**物体自己的**轴向（见 FACES 那段），不是屏幕方向。 */
function faceFill(f){
  if (f.n === "+z") return C.cover;       // 封面
  if (f.n === "-z") return C.coverDark;   // 封底
  if (f.n === "-x") return C.spine;       // 书脊
  return C.pageC;                         // +x 书口、±y 上下切口 —— 都是纸的边
}

/* 书口那一叠纸。在 +x 面上画几条平行于**书高**的细线，线沿厚度均分 ——
   那正是纸页叠起来的方向。这是整个形状上唯一认得出"这是书"的记号：
   封面上画什么都可以是一块牌子，只有这一叠边骗不了人。 */
function pages(c){
  var t = c.t/2, n = P.pages|0;
  if (n < 1) return;
  /* 两端各缩一点 = 飘口。精装书的封面比书芯大出一圈，纸页不顶到边。 */
  var v0 = -0.86, v1 = 0.86;
  ctx.strokeStyle = C.pageEdge; ctx.lineWidth = 1;
  ctx.beginPath();
  for (var k=1;k<=n;k++){
    var z = -t + 2*t*k/(n+1);
    var p0 = proj(onSide(c, 1, v0, z)), p1 = proj(onSide(c, 1, v1, z));
    ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]);
  }
  ctx.stroke();
}

/* 书脊上那两道烫金横线。书脊如果只是一块深色平面，远看跟"封面的侧边"分不开；
   有这两道（假的书名栅栏），一眼就知道那是书脊。三版封面共用。 */
function spineArt(c){
  var t2 = c.t/2;
  sideQuad(c, -1, -0.74, -0.60, -t2, t2, C.gold);
  sideQuad(c, -1, -0.46, -0.32, -t2, t2, C.gold);
}

function drawCard(c){
  var K = corners(c);
  if (c.dying > 0) return drawDying(c, K);

  var order = FACES.map(function(f){
    var z = 0; f.i.forEach(function(k){ z += K[k][2]; });
    return { f:f, z:z/4 };
  }).sort(function(a,b){ return a.z - b.z; });   // 远的先画

  for (var o=0;o<order.length;o++){
    var f = order[o].f, pts = f.i.map(function(k){ return proj(K[k]); });
    poly(pts, faceFill(f));
    /* ★ 面上的细节必须**紧跟着它那个面**画，不能等循环走完再补：封面的装饰如果
       留到最后画，封面转到背面去的时候它们会盖在书脊和书口上面。 */
    if (f.n === "+x") pages(c);
    else if (f.n === "-x") spineArt(c);
    else if (f.n === "+z") coverArt(c);
  }
}

/* 封面版式的名字，只给 HUD 用。挑定之后连同 coverArt 里没选中的分支一起删。 */
var BOOKS = ["素封 + 烫金框", "书名签", "小镇雪夜"];

/* 封面上的东西。?book= 切三版，也能按 B 键现场换，挑定之后把没选中的删掉。
   全部走 onFace / faceQuad 的矢量面片，所以透视天然是对的（贴图不行：
   单应变换在 canvas 上只能靠仿射逼近，强透视会明显歪）。 */
function coverArt(c){
  /* 书脊槽：贴着左边一道暗色窄带。真实的书翻开时这里折下去，合着的书上也留一道
     压痕。三版都保留 —— 少了它，深蓝的封面就是一块平板。 */
  faceQuad(c, -1, -1, -0.78, 1, 0.5, C.coverDark);

  var m = P.book|0;
  if (m === 2){
    /* 封印上去的小镇雪夜。地平线、屋子、窗全在封面的 (u,v) 坐标里，
       书一转它们跟着转，不会浮到封面外面去。 */
    var gy = 0.34, cx0 = -0.16;
    faceQuad(c, -0.74, gy, 0.94, 0.94, 0.6, C.snow);            // 雪地
    poly([onFace(c, cx0-0.40, gy, 0.9), onFace(c, cx0+0.40, gy, 0.9),
          onFace(c, cx0, -0.30, 0.9)].map(proj), C.roofRed);    // 屋顶
    faceQuad(c, cx0-0.29, gy, cx0+0.29, 0.86, 0.9, C.beam);     // 墙
    faceQuad(c, cx0-0.13, 0.50, cx0+0.05, 0.72, 1.3, C.warm);   // 亮着的窗
  } else if (m === 1){
    /* 书名签：贴着书脊一块纸色横带。**不写字** —— 书在井里是飞着的，字在那个
       尺度上只会糊成几个墨点，比不写脏。 */
    faceQuad(c, -0.86, -0.14, 0.34, 0.14, 0.6, C.pageC);
  } else {
    /* 素封：一道烫金细线框，四条窄矩形拼成环。 */
    var i0=-0.70, i1=0.80, j0=-0.78, j1=0.78, lw=0.045;
    faceQuad(c, i0, j1-lw, i1, j1, 0.6, C.gold);
    faceQuad(c, i0, j0, i1, j0+lw, 0.6, C.gold);
    faceQuad(c, i0, j0, i0+lw, j1, 0.6, C.gold);
    faceQuad(c, i1-lw, j0, i1, j1, 0.6, C.gold);
  }
}

/* 「魔法消失」：参考帧 55.5 那格看得出它是**转到侧立**、只剩一条深色薄片，
   然后才没的。所以这里不是淡出，是把 ry 推到 ±90° 同时把厚度收到 0。 */
function drawDying(c, K){
  var p = clamp(c.dying/0.45, 0, 1);
  var e = p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
  var saveRy = c.ry, saveT = c.t;
  c.ry = lerp(saveRy, (saveRy<0?-1:1)*Math.PI/2, e);
  c.t  = lerp(saveT, 0.6, e);
  var K2 = corners(c);
  var s = 1 - e*0.35;
  var order = FACES.map(function(f){
    var z=0; f.i.forEach(function(k){ z+=K2[k][2]; }); return {f:f,z:z/4};
  }).sort(function(a,b){ return a.z-b.z; });
  for (var o=0;o<order.length;o++){
    var f = order[o].f;
    var pts = f.i.map(function(k){
      var q = proj(K2[k]);
      return [VP.x + (q[0]-VP.x)*s, VP.y + (q[1]-VP.y)*s];
    });
    poly(pts, faceFill(f));
  }
  c.ry = saveRy; c.t = saveT;
}
function lerp(a,b,t){ return a+(b-a)*t; }

/* ── 纸：井壁上的一块楔形（P.paper=1，默认）─────────────────────────
   用户 2026-10-07：「书要不这样子，是白色的纸，然后出现的话是，中间一个小点
   到井口的边缘，然后成为被某两条黑线约束的白色梯形。这样会好做吧」

   ★ 「好做」是真的，而且**比 3D 那个盒子简单一个量级**，原因值得写下来：

var sheets = [], sheetQ = 0;

function holeR(){ return Math.min(W,H)*0.048*0.90; }   // 井口半径，跟 wellArt 同一套

/* ── 纸上排字（见 P.pfs 那一段的注释）──────────────────────────────
   ★ **不能用 Zpix**。这一页内联的那个子集只裁了 160 字（是为了井口「出口」
     两个字裁的），37 段正文里有几百个不同的字，缺字是**静默回退**：
     CSS 一字不错，混排出来一半点阵一半平滑，第一眼只会当成"像素字体没
     生效"。用系统无衬线，跟屏幕那边（用户指定的"黑体"）同一套语言。 */
var PAPER_FONT = '"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif';
var NO_HEAD = "、。，；：？！）》」』】…—·";     // 避头点：不让标点吊在行首
/* 度量用**自己的一张 canvas**，不借全局 ctx —— 全局 ctx 在 drawUpLayer 里
   会被临时指向 #cvup，在 layer() 里又指向一张离屏的，取决于谁在调。
   字体度量和这些都不相干，分开一份就没有"什么时候调"这个前提。 */
var mcv = document.createElement("canvas"), mctx = mcv.getContext("2d");

/* 一个 ASCII「词」里允许有哪些字符 —— 这串字符内部**不许断开**。
   ★ 为什么要有这个概念：中文没有词边界，逐字换行本身是对的；但一路逐字切到
   ASCII 上也照切，就会把数字劈成两半。出图撞上的正是这个：#11 排成
   「…说是她有100」/「0种地方是可能去的。」—— 1000 被切成 100 + 0。
   而且它**调参救不了**：那一行本来就没排满，放宽栏宽、缩字号都不改变结果，
   只有看图才看得见。（`.` 也收进来是为了 `b.1. b.2.` 那种子列表不散架。） */
var WORDRE = /[0-9A-Za-z.%_-]/;

/* 把一段切成"不能从中间断开"的块：中文一个字一块，连着的一串 ASCII 算一块。
   一个词自己就比栏还宽（正常语料里不会有）时退回逐字，别让它整行溢出去。 */
function pieces(s, maxW){
  var out = [], i = 0;
  while (i < s.length){
    if (WORDRE.test(s.charAt(i))){
      var j = i;
      while (j < s.length && WORDRE.test(s.charAt(j))) j++;
      var w = s.slice(i, j);
      if (mctx.measureText(w).width > maxW)
        for (var k=0;k<w.length;k++) out.push(w.charAt(k));
      else out.push(w);
      i = j;
    } else { out.push(s.charAt(i)); i++; }
  }
  return out;
}

/* 按宽度断行。★ 硬换行（\n）必须尊重：docx 里那 37 段**段内自带换行**，
   连排会把作者自己的断句抹掉（build-doc.py 里 "内含 N 行" 报的就是这个）。 */
function wrapText(txt, maxW){
  var out = [], paras = String(txt).split("\n");
  for (var p=0;p<paras.length;p++){
    var line = "", ps = pieces(paras[p], maxW);
    for (var i=0;i<ps.length;i++){
      var u = ps[i];
      /* 避头点：这一行已经排了字、再加一块就溢出、而这块是以标点开头的 ——
         那就让它跟着上一行（宁可略超一点）。不做也不报错，但那些
         「。」「，」会孤零零吊在行首，一眼就看出来。 */
      if (line && NO_HEAD.indexOf(u.charAt(0)) < 0 &&
          mctx.measureText(line + u).width > maxW){ out.push(line); line = u; }
      else line += u;
    }
    out.push(line);
  }
  return out;
}

/* 一段文字 → 纸的**终态**尺寸。这是"适配"的本体：先按基准栏宽排一遍拿到
   行数 → 由行数定纸高 → 顶到屏高上限就往回调。能调的只有两样：
     · **放宽**（每行多装几个字 → 行数变少 → 纸变矮）
     · **缩字号**（行高和字一起缩 → 纸变矮，代价是字变小）
   ★★ 两样都必须有，只放宽是不够的 —— 出图就撞上了：37 段里的 #23 是短句诗，
     **22 个硬换行**，一行就是一句。放宽栏宽**一行都省不下来**，于是循环把
     纸从 326 一路放宽到 509，高度纹丝不动（685px，占屏高 76%），纸变成一张
     更宽、一样高的横幅，越调越糟。所以循环里比的是**上一轮的行数**：
     放宽如果没让行数变少，下一轮就改缩字号。
   ★ 高度是**取 max 不取 min**：短段落的纸被 phmin 托住时，多出来的是留白
     （内容仍从顶部排）—— 一张纸上下留白很正常，字被压扁就不正常了。 */
function layoutFor(txt, src){
  var fs = P.pfs, pad = fs*1.30, w = P.ppw;
  var hMax = H*P.phmax, hMin = H*P.phmin, wMax = W*P.pwmax;
  var lines = [], prevN = -1;
  for (var it=0; it<7; it++){
    var lead  = fs*1.62;
    mctx.font = fs + "px " + PAPER_FONT;
    lines = wrapText(txt, w);
    var block = lines.length*lead;              // 正文块高
    var tail  = fs*0.90 + fs*0.80*1.45;         // 空一档 + 出处那一行
    var h = pad*2 + block + tail;
    if (h <= hMax || it === 6)
      return { w: w + pad*2, h: Math.max(h, hMin), fs: fs, lead: lead, pad: pad,
               lines: lines, src: src, block: block, tail: tail };
    /* 还有得省就放宽（但别宽过 pwmax，纸宽出屏幕就没法看了）；
       上一轮放宽没换来行数下降 → 改缩字号。 */
    if (lines.length < prevN || prevN < 0){
      if (w*1.16 + pad*2 <= wMax) w *= 1.16;
      else fs *= 0.90;
    } else fs *= 0.90;
    pad = fs*1.30;
    prevN = lines.length;
  }
}

/* ── 抽签：洗牌袋 ───────────────────────────────────────────────────
   原来是 `Math.floor(rnd()*PS.length)`，而 `rnd` 是**定种子**的
   （`mulberry32(parseInt(Q.get("seed"),10) || 20261006)`，种子写死在代码里）。
   于是每次进井，纸的出生方向、**第几张纸抽到哪一段，全是算好的** ——
   实测连进两次井都抽到 #36《浮白》。用户 2026-10-07：「要不还是进去后
   随机排序给吧，这样不会老是抽到同一张」。

   所以改成**洗牌袋**：进井时把 37 段洗一遍，按顺序发，**一轮内不重复**，
   发完重洗。这比"每次独立随机"强的地方不是更随机，是**不会撞车** ——
   独立随机的重复是"意料之中"（37 选 1 连撞两次概率 1/37），
   但用户看见的就是"怎么又是这张"。

   ★ 走**自己的一条序列**，不碰 `rnd()`。两个诉求正好相反：洗牌要的是
     "每次进井都不一样"，`rnd()` 要的是"同一个 seed 跑出同一份"。
     混在一起还会让纸的出生序列随"用户拖了几次"漂。
     代价要记一笔：`pickFor` 不再消耗 `rnd()` 了，它之后那些调用整体前移一位，
     所以井里纸/书的方向和改动前**不同**（同一次运行内依然自洽）。
   ★ `?pseed=N` 给定就完全可复现（出图 A/B 用）；
     `?pseg=N` 是"钉死第 N 段"，绕开袋子、也不消耗它（出图对照用）。 */
var bag = [], bagIx = 0, bagSeed = 0, bagLast = -1;
/* `?oldpick=1` 走**改之前**那条：`Math.floor(rnd()*PS.length)` —— 定种子、
   每次进井一个样。留着它是为了让"这条改动到底改了没有"能被**当场演示**：
   连开三次，带 `?oldpick=1` 三次同段、不带则三次不同段。
   （这次就是这么验的：`scripts/paper-bag.py`。改动要是被谁回退掉，这条也会说话。）
   ★ 只在**第一次**抽签上等价于旧版 —— 旧版每次抽签都消耗一个 `rnd()`，新版不消耗，
     所以第二次起两边的消耗位就错开了。做 A/B 只比第一次那道。 */
var OLDPICK = Q.has("oldpick");
function bagShuffle(seed, avoid){
  bagSeed = seed >>> 0;
  bag = [];
  for (var i=0;i<PS.length;i++) bag.push(i);
  var r = mulberry32(bagSeed);
  for (var j=bag.length-1;j>0;j--){              // Fisher-Yates
    var k = Math.floor(r()*(j+1));
    var t = bag[j]; bag[j] = bag[k]; bag[k] = t;
  }
  /* 重洗之后，开头别和**刚发出去的**那段撞上。37 选 1 正好撞上末段的概率
     只有 1/37，但"连着两张同一段"恰好是最扎眼的那种重复 —— 而用户要的
     就是别老抽到同一张，这一下是最便宜的保险。（换到袋里随机一位，不是
     跟第 2 位换 —— 那只会把重复推后一张。） */
  if (avoid >= 0 && bag.length > 1 && bag[0] === avoid){
    var k2 = 1 + Math.floor(r()*(bag.length-1));
    var t2 = bag[0]; bag[0] = bag[k2]; bag[k2] = t2;
  }
  bagIx = 0;
}
/* 默认种子是**真随机**，不是 rnd() —— 这里要的恰恰是"不可复现"。
   （DSNOISE 那段用 Math.random() 是同一个理由，见那里的注释。） */
bagShuffle(Q.has("pseed") ? (parseInt(Q.get("pseed"),10) >>> 0)
                          : ((Math.random()*4294967296) >>> 0), -1);
function bagNext(){
  /* 发完一轮 → 重洗。新种子由旧种子推出来，而不是再取一次随机：
     `?pseed=` 要能复现**整个**序列（包括第 38 段那次重洗），
     而默认路径下每轮的种子仍然各不相同。 */
  if (bagIx >= bag.length)
    bagShuffle((bagSeed*1664525 + 1013904223) >>> 0, bagLast);
  var v = bag[bagIx++];
  bagLast = v;
  return v;
}

/* 抽一段，并算出这张纸该多大。抽中就**定死**在这张纸上 —— 同一张纸不换字，
   "抽一次"才是一次（否则每帧都可能重抽，字会闪）。 */
function pickFor(s){
  var i = P.pseg > 0 ? (P.pseg - 1)
        : (OLDPICK ? Math.floor(rnd()*PS.length) : bagNext());
  i = clamp(i|0, 0, PS.length-1);
  s.pick = PS[i];
  s.segN = i + 1;
  s.lay = layoutFor(s.pick[1], s.pick[0]);
  /* 目标倍数 = 目标屏幕尺寸 ÷ 按下那一刻冻结的那两个长度。
     ★ 下限 1：抓得住的最小条件是 r1-r0 ≥ 0.7（见 hitSheet），刚出生的纸
       fh 可以很小，除以它会炸成几百倍。夹一下不影响结果，只防爆炸。 */
  s.tzx = s.lay.w / Math.max(s.fw, 1);
  s.tzy = s.lay.h / Math.max(s.fh, 1);
}

function spawnSheet(){
  /* 跟 spawn() 同一道闸，理由见那里。`!FR` 是给出图探针让路：?hold= 等不了
     2.2 秒的入场（它要的是"纸已经在手上"这个状态）。 */
  if (demoT < P.wt && !FR) return null;
  var N = Math.max(6, P.rays)|0;
  var span = clamp(P.pSpan|0, 1, N-1);
  /* 出生方向：**左右为主、上方为辅**，正下方一律不要。
     ★ 为什么不"在整圈里随机、只把朝下的拒掉"（那是上一版，出过图）：
     θ 均匀采样时 sinθ 的密度被 |cosθ| 加权，绝大多数落在**正上**附近；
     而正上恰恰是空间最小的方向 —— 灭点 y=320，到此只有 320px，
     纸还没长全就贴到顶边，"从井口展开成梯形"这个动作根本看不见
     （见 _shots/_bkwide.png 那一版：六格全在边角打转）。正左/正右各有
     720px 反而是最空的地方，却几乎抽不到。所以改成先选左右一半，
     再按 1-√rnd 取离水平线的夹角：这个分布里 75% 落在水平线 ±45° 以内。
     ★ 下方为什么必须让开：字区**整个**在灭点下方（THINK 顶边 y≈453），
     所以朝下的纸一定压字；而剩下的"上、左、右"正是用户描述原片的那句
     「书是从上左右边界处离开」。两条要求在这里是同一件事。 */
  var a = (Math.PI/2)*(1 - Math.sqrt(rnd()));      // 离水平线的夹角 0..90°
  var want = (rnd() < 0.5) ? -a : Math.PI + a;     // 右半 -a(=360°-a)、左半 180°+a
  /* 吸附到最近的棱线上 —— "被某两条黑线约束"要求左右两条边正好压着两条棱线，
     而第 i 条棱线的角度是 (i/N)*2π + 0.37，于是反过来解 i 再取整。
     取模是为了让负的 i（右半那几个）绕回 0..N-1。 */
  var i = Math.round((want - 0.37)*N/6.283185307 - span/2);
  i = ((i % N) + N) % N;
  /* 中心角取在第 i 与第 i+span 条棱线的**正中**，左右各摊 span/2 ——
     这就是那两条边落在棱线上的原因。 */
  /* 拖拽那一套，全部归零起（见 stepHold / sheetQuad）：
     held 正被手拽着 · hold 按下那一刻的锚 · face 转正程度 0→1
     fx/fy 转正后纸心的屏幕位置 · fw/fh 转正后纸的尺寸（按下那一刻按当时的大小冻结）
     zx/zy 横/纵两个方向的倍数（出生时是 pZoom 那个默认倍数，抽中一段之后
           由 pickFor 改成"排得下这段"的倍数，见那里的注释）
     pick/lay/segN 抽中的那一段、它的排版结果、它在 PS 里的序号（hud 和探针要读） */
  var s = { th: ((i + span/2)/N)*6.283185307 + 0.37, t: 0, dying: 0,
            held: false, hold: null, face: 0, fx: 0, fy: 0, fw: 0, fh: 0, puff: 0,
            zx: P.pZoom, zy: P.pZoom, pick: null, lay: null, segN: 0,
            tzx: 0, tzy: 0 };
  sheets.push(s);
  return s;
}

/* 一块纸的几何：[内端半径, 外端半径]。
   ★ ②那一段是**两端一起往外张**，不是"内端钉在井口、外端自己往外长"。
     后者出过一次图：内端停在 r=39（井口），外端跑到 r=366，而屏幕宽度 = r·Δθ，
     于是远端只有 13px、近端 120px —— 一张**极尖的楔**，看着像一柄刀或一束光，
     不是纸。根子是"从井口长出来的东西必然是尖的"，它在灭点那儿宽度归零。
     两端同张（内端走在 0.28·pLen、外端走在 1.28·pLen）比例就一直是 1:3 上下，
     像一块板。内端取 0.28 而不是 0.5，是为了让梯形**从井口长出来** ——
     用户那句「中间一个小点到井口的边缘，然后成为白色梯形」，落到几何上就是
     内端起步时贴着井口（e=1 时 r0 = 39+56 = 95，井口是 39）。
   ②的缓动用 smoothstep 不用线性：线性是前后两帧一样快地变宽，看着像"被拉开"；
     smoothstep 先慢、中间快、最后收，像一张纸被展开。 */
function sheetGeom(s){
  var h = holeR(), t = s.t;
  if (t < P.pRise) return [h*(t/P.pRise), h*(t/P.pRise)];   // ① 就是个点
  var g = clamp((t - P.pRise)/P.pGrow, 0, 1);
  var e = g*g*(3-2*g);
  var r0 = h + P.pLen*0.28*e;                                // 内端从井口往外
  var out = P.pSpd*Math.max(0, t - P.pRise - P.pGrow);       // ③ 整体外滑
  return [r0 + out, r0 + P.pLen*e + out];
}

/* ── 消散：把纸「晕染」掉 ────────────────────────────────────────────
   用户 2026-10-07：「纸的那个拉扯过来啊、消散啊的效果做一下」。
   ★ 原片里卡片**不是淡出**：115.0s 还在，115.5s 碎成几团边缘分叉的红斑、
   从上边缘往内啃，116.0s 全没了（帧见 _logs/_wod/_x/t00115_50.png）。
   字幕念的是「晕染消失的效果」，文档记的是「影像消失」—— 说的是同一件事。
   ★ 原片用的是 236KB 的逐帧精灵图 sprite-vanish.png。这个项目的兜底必须是
   一个能单独发出去的 HTML，**不能带素材**，所以这里程序化生成。

   做法：一张 fbm（三层 value noise）＋一个朝上的梯度偏置。噪声场只算一次
   （dsInit），之后每帧按**当前阈值**直接把 alpha 通道写进一张复用的 scratch
   canvas（dsMaskAt）—— 阈值随消散进度连续滑，所以啃的边缘是分形的、而且是
   均匀长出来的。
   ★ 为什么不预生成 8 张、在相邻两张之间交叉淡化（那是第一版，出过图）：
     alpha 是**乘性叠加**的，做不出线性插值。两张 alpha=1 的遮罩各按
     1-fr / fr 的 globalAlpha 叠上去，净覆盖是 1-(1-(1-fr))(1-fr) = 1-fr(1-fr)，
     fr=0.13 时只有 0.887 —— **在最该吃干净的地方反而漏回 12% 的纸**。
     实测：M[6] 明明是 99.9% 不透明，纸心却只盖住 88%，整张纸泛粉。
   ★ 也不靠"多预生成几十张、只取最近的一张"：阈值间隔要小于软边宽（0.16）
     才看不出台阶，那要上百张，9MB 起步。插值阈值只要 192×192 一次重算，
     0.3ms，一张 scratch 就够。
   ★ 梯度偏置（+0.34·(1-y/N)）是"从上边缘先烂"的直接翻译 —— 没有它，红斑
   会四面八方同时冒出来，那是"溶解"不是原片那种"从上面糊下来"。
   ★ 遮罩是**底色同色**的，画在纸上（clip 到纸的形状）。
   ★★ 2026-10-07 改：原来这里写着"不能用 destination-out —— 主画布在纸之前已经
   贴过 backdrop 了，擦会把背景一起擦穿"，那句**在当时是对的**。现在纸走的是
   自己的层（#cvup），擦它不碰底下任何东西，所以 drawSheet 已经改回真擦。
   颜色因此成了**死数据**（destination-out 只看 alpha 通道），留着只为把 scratch
   打印出来时肉眼看得到"啃到哪儿了"。
   ★ 底色取 P.bg 不写死：?bg= 换底色时遮罩得跟着变，否则红斑是上一个颜色的。
   （这条现在不影响画面，但改回"盖色"那套时立刻就有意义，留着。）

   ★ 这里用 Math.random() 不用 rnd()：rnd() 是带种子的全局序列，在这儿抽几十万次
   会**把纸的出生顺序整条挪掉**（seed 相同时前后两次跑出的纸不一样，就没法做
   A/B 对照了）。遮罩是纹理，不需要可复现。 */
var DSNOISE = 192;            // 噪声场的边长（也是遮罩的边长）
var DSW = 0.16;               // 软边宽度（归一化单位）—— 晕染的边是渐的不是刀切的
var DS0 = 1.05, DS1 = -0.29;  // 消散进度 0 / 1 对应的阈值（1.05 一点不吃，-0.29 全吃）
var dsF = null;               // 归一化后的噪声场，只算一次
var dsRgb = null, dsG = null, dsIM = null, dsScratch = null;

function hex2rgb(h){
  h = String(h == null ? "" : h).trim().replace(/^#/, "");
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return [244, 11, 62];   // 认不出就用默认底红
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

function dsInit(){
  var N = DSNOISE;
  var oct = [[6, 0.52], [13, 0.30], [27, 0.18]];      // 三个八度：格数 + 权重
  var lat = [];
  for (var o=0;o<oct.length;o++){
    var n = oct[o][0], a = new Float32Array(n*n);
    for (var i=0;i<n*n;i++) a[i] = Math.random();
    lat.push({ n:n, a:a, w:oct[o][1] });
  }
  var f = new Float32Array(N*N), lo = 1e9, hi = -1e9;
  for (var y=0;y<N;y++) for (var x=0;x<N;x++){
    var v = 0;
    for (var k=0;k<lat.length;k++){
      var L = lat[k], m = L.n, A = L.a;
      var fx = (x/N)*m, fy = (y/N)*m;
      var x0 = Math.floor(fx), y0 = Math.floor(fy);
      var u = fx-x0, w2 = fy-y0;
      u = u*u*(3-2*u); w2 = w2*w2*(3-2*w2);           // 格子内也 smoothstep，不然看得到方格
      var j0 = ((x0 % m) + m) % m, j1 = ((x0+1) % m + m) % m;
      var i0 = ((y0 % m) + m) % m, i1 = ((y0+1) % m + m) % m;
      var t0 = A[i0*m+j0] + (A[i0*m+j1] - A[i0*m+j0])*u;
      var t1 = A[i1*m+j0] + (A[i1*m+j1] - A[i1*m+j0])*u;
      v += (t0 + (t1-t0)*w2) * L.w;
    }
    /* ★ 上边缘先烂。0.34 是试出来的下限失败值（出过图）：那么弱的时候
       fbm 自己的起伏完全盖过它，红斑从纸**中间**几个点冒出来、往四周扩，
       是"溶解"不是原片那种"从上面糊下来"。0.55 才把它压成明确的"上→下"。 */
    v += 0.55*(1 - y/N);
    f[y*N+x] = v;
    if (v < lo) lo = v;
    if (v > hi) hi = v;
  }
  var rng = (hi - lo) || 1;
  for (var i2=0;i2<N*N;i2++) f[i2] = (f[i2]-lo)/rng;   // 归一化到 [0,1]
  dsF = f;
  dsRgb = hex2rgb(P.bg);
  dsScratch = document.createElement("canvas");
  dsScratch.width = dsScratch.height = N;
  dsG = dsScratch.getContext("2d");
  dsIM = dsG.createImageData(N, N);   // 复用一份，别每帧 create（147KB×60/s 全是 GC 垃圾）
}

/* 按当前进度现算一张遮罩，写进复用的 scratch。
   p = 消散进度 0..1 → 阈值从 DS0 滑到 DS1。**插值必须发生在这里**：
   写成"两张各带 globalAlpha 叠一叠"是错的，alpha 是乘性的（见上面那段注释）。 */
function dsMaskAt(p){
  if (!dsF) dsInit();
  var N = DSNOISE, f = dsF, rgb = dsRgb, d = dsIM.data;
  var thr = DS0 + clamp(p, 0, 1)*(DS1 - DS0);
  for (var i=0;i<N*N;i++){
    var e = (f[i]-thr)/DSW;
    e = e < 0 ? 0 : (e > 1 ? 1 : e);
    e = e*e*(3-2*e);
    d[i*4] = rgb[0]; d[i*4+1] = rgb[1]; d[i*4+2] = rgb[2];
    d[i*4+3] = (e*255)|0;
  }
  dsG.putImageData(dsIM, 0, 0);
  return dsScratch;
}

/* 纸的四个屏幕角点 —— drawSheet / hitSheet 共用一份。
   ★ 抽出来是因为拖拽的命中判定必须跟画出来的形状**逐像素同源**：
     分开写两遍的话，改一处忘一处，"点了没反应/点空白也抓到"就会冒出来。 */
function sheetQuad(s){
  var N = Math.max(6, P.rays)|0;
  var span = clamp(P.pSpan|0, 1, N-1);
  var g = sheetGeom(s), r0 = g[0], r1 = g[1];
  /* 纸边从棱线往内收 P.pEdge 像素。收的是**角度**，所以要按半径换算：
     同一个角度偏移在 r0 处和 r1 处的像素数不一样，用中段半径才能让整条边
     看上去是平行地贴着棱线的。 */
  var rmid = Math.max((r0 + r1)/2, 1);
  var half = (span/N)*6.283185307/2 - P.pEdge/rmid;
  var a0 = s.th - half, a1 = s.th + half;
  var c0 = Math.cos(a0), n0 = Math.sin(a0), c1 = Math.cos(a1), n1 = Math.sin(a1);
  var q = [[VP.x + c0*r1, VP.y + n0*r1],
           [VP.x + c1*r1, VP.y + n1*r1],
           [VP.x + c1*r0, VP.y + n1*r0],
           [VP.x + c0*r0, VP.y + n0*r0]];
  /* 被手拽着 → 从上面那个透视梯形**转正**成一张正对我们的纸（face 0→1）。
     正对 = 没有透视收缩 = 规整的矩形：长边沿它原来"径向"的方向（u），
     短边沿切向（v）。四点顺序跟上面一一对应（外-v → 外+v → 内+v → 内-v），
     所以过渡就是单纯的四点插值，纸自己会转过来，不需要额外的旋转逻辑。 */
  var hv = 0, hh = 0;                 // 只有转正（k>0）之后才有"正对我们的框"
  var k = s.face || 0;
  if (k > 0){
    /* 目标是**屏幕轴对齐**的矩形（横平竖直），边长 = 按下时冻结的 fw/fh × pZoom。
       ★ 不是"沿它自己径向的那个矩形"：用户 2026-10-07 明确要横平竖直，因为这张纸
       最终要在上面排文字段落，斜的排不了版。
       ★ 四个角怎么配 —— 极坐标那四点本来就是**环绕有序**的（q0→q1→q2→q3 绕着纸心
       走一圈，方向跟矩形四角的环绕方向一致），所以只需要决定**从哪个角起步**。
       四种起步各算一遍总位移，取最小的：交叉的配对位移必然大得多，最小值就是
       那个不扭的。写死"q0→右上"不行 —— 纸在左半时 q0 落在屏幕左下，写死会让
       四个角在插值途中互相穿过（纸扭成麻花，而且不报错）。 */
    /* ★ 横纵各一个倍数（zx / zy），不再共用一个 pZoom —— 见 P.pfs 那段：
       纸的宽高要由"这段文字排出来是几行"决定，两个方向就得能各自定。
       zx 还兼着"拉扯"（puff 只横向抻）—— 纸被抻开时字跟着抻，那是对的。 */
    hv = s.fw/2*(s.zx || P.pZoom)*(1 + (s.puff||0));
    hh = s.fh/2*(s.zy || P.pZoom);
    /* 矩形四角：0 上左 · 1 上右 · 2 下右 · 3 下左（屏幕 y 向下时的顺时针） */
    var rx = [s.fx-hv, s.fx+hv, s.fx+hv, s.fx-hv];
    var ry = [s.fy-hh, s.fy-hh, s.fy+hh, s.fy+hh];
    var sh, n, i, cost, best = 0, bc = Infinity;
    for (sh=0; sh<4; sh++){
      cost = 0;
      for (n=0; n<4; n++){
        var qi = q[(n+sh)&3];
        var ex = rx[n]-qi[0], ey = ry[n]-qi[1];
        cost += ex*ex + ey*ey;
      }
      if (cost < bc){ bc = cost; best = sh; }
    }
    for (i=0; i<4; i++){
      var j = (i - best + 4) & 3;
      q[i][0] += (rx[j] - q[i][0])*k;
      q[i][1] += (ry[j] - q[i][1])*k;
    }
  }
  /* hv/hh 一并给出去：纸上排字要用**同一个框**（drawSheet 里不再另算一遍，
     否则两处的公式迟早会漂）。face=0 时它们是 0，那时纸还是斜的，本来也不排字。 */
  return { r0:r0, r1:r1, q:q, hv:hv, hh:hh };
}

/* 点在凸四边形内：绕一圈看叉积的符号有没有变。梯形（见 sheetGeom 注释）是凸的，
   所以这一条就够，不用拆三角形。 */
function inQuad(q, px, py){
  var sg = 0;
  for (var i=0;i<4;i++){
    var a = q[i], b = q[(i+1)&3];
    var cr = (b[0]-a[0])*(py-a[1]) - (b[1]-a[1])*(px-a[0]);
    if (Math.abs(cr) < 1e-9) continue;
    var s2 = cr > 0 ? 1 : -1;
    if (!sg) sg = s2; else if (s2 !== sg) return false;
  }
  return true;
}

function hitSheet(px, py){
  /* 倒着找：后生的画在上面，抓的应该是看得见的那个。 */
  for (var i=sheets.length-1;i>=0;i--){
    var s = sheets[i];
    if (s.dying > 0 || s.held) continue;      // 正在晕的、已经抓着的，都不再抓
    var g = sheetGeom(s);
    if (g[1] - g[0] < 0.7) continue;          // 还是个点大，抓不住
    if (inQuad(sheetQuad(s).q, px, py)) return s;
  }
  return null;
}

/* 被手拽着的那张纸怎么走：**在屏幕坐标上跟手**，同时把自己**转正**。
   ★ 2026-10-07 用户纠的正是这里 —— 上一版让它在极坐标里跟手挪（改 th 和径向
   偏移），读起来就是"在井壁上滑"，永远是一张斜的梯形，没有"被拉到前面来"这回事。
   原片那句字幕是「它就会移动到我们的屏幕前面」：移到**前面** = 脱离井壁、转正。
   所以位置落在屏幕 x/y 上，形状交给 face（0 = 贴在井壁的透视梯形，1 = 正对我们
   的矩形，混合在 sheetQuad 里）—— 两件事分开做，纸就自然地浮起来、转过来。 */
function stepHold(s, dt){
  var h = s.hold;
  if (!h) return;
  /* 抓的是**偏移**不是绝对位置：按住那一刻纸心在指针的 (h.ox, h.oy) 处，之后一直
     保持这个相对关系 —— 手往哪儿甩纸都不跳（跳是"按下瞬间纸瞬移到指针底下"那个
     老毛病）。跟手用指数滤波、按 dt 折算：固定比例会让手感随帧率变（同 follow）。 */
  var tX = pointer.x - h.ox, tY = pointer.y - h.oy;
  s.fx = follow(s.fx, tX, P.pfol, dt);
  s.fy = follow(s.fy, tY, P.pfol, dt);
  s.face = follow(s.face || 0, 1, P.pFace, dt);
  /* 转正到一定程度才抽（用户：「井里面纸正对时会抽一段」）——纸还是斜梯形
     的时候字没法排，而且那会儿也看不出抽了什么。抽了就定死在这张纸上。 */
  if (!s.pick && s.face >= P.pick) pickFor(s);
  /* 抽中之后纸往目标尺寸长。用 follow 不用瞬时赋值：它是"摊开"给我们看的，
     跳大就成了弹窗。宽高各追各的（见 sheetQuad 那段）。 */
  if (s.tzx) s.zx = follow(s.zx, s.tzx, P.pgrow, dt);
  if (s.tzy) s.zy = follow(s.zy, s.tzy, P.pgrow, dt);
  /* 「拉扯」：滤波的**滞后量**正比于手的速度（追不上多少 = 手有多快），拿它当速度
     的代理 —— 拖得快纸就被抻开一点，手一停立刻收回。
     ★ 单位是**像素**（屏幕上的滞后距离），除以 P.pPuff 才换成比例。
     ★★ 2026-10-07 用户「你这字怎么扁扁的」之后重定的两个数，都是在**真鼠标**上
     量出来的（scripts/paper-check.py ③ 边拖边采峰值 —— puff 手一停就归零，
     拖完再读永远是 0，那种写法看着像在验其实什么都没验）：

         手速            旧（pdiv 300 / 上限 0.45）   新（1120 / 0.10）
         慢慢挪 105px/s      字宽 +1%                      +1%
         正常拖 1363px/s     字宽 +15%                     +4%
         甩一下 6108px/s     字宽 +37%                     +10%

     判据是「**正常拖**的时候字不能看得出变形」。旧值下随手一拖就有 15%，
     那不是"拉扯"，那是字在变形 —— 而 puff 是只横向抻的，纸上的字跟着一起抻。
     新值下那股"被拉"的劲儿还在（纸的**外廓**照样随速度变宽），但字基本不动。
     ★ 为什么不让"纸抻、字不抻"：那要给 drawPaperText 另开一条不含 puff 的
     宽度公式，于是"字和纸严丝合缝"这条不变式就有两个版本了 —— 迟早漂。
     压小幅度只需要改一个数，且保住了一条公式。 */
  var lx = tX - s.fx, ly = tY - s.fy;
  s.puff = follow(s.puff || 0,
                  clamp(Math.sqrt(lx*lx + ly*ly)/P.pPuff, 0, P.pmax), 8, dt);
}

/* 把抽到的那一段排到纸上。
   ★ 坐标系：排版结果是**终态**的屏幕尺寸（lay.w × lay.h），而纸此刻可能还
     没长到位、还可能被拉扯抻开 —— 所以用一次 scale 把"终态坐标"映到"此刻
     的框"上。终态时 sx = sy = 1（因为 tzx/tzy 就是按这个框反推的），不需要
     额外判断"长没长到位"。
   ★ 过渡途中 sx ≠ sy，字会被轻微非均匀缩放 —— 只在拉起来那零点几秒里，
     换来的是"字和纸永远严丝合缝"。反过来（字号固定、纸自己长大）会看到
     纸在长、字不动，那才是真的错。
   ★ 字画在 `poly(q, C.paper)` **之后**、消散擦**之前** —— 于是用户松手时，
     destination-out 把纸和字**一起**啃掉，一个字的效果代码都不用加。 */
function drawPaperText(s, hv, hh){
  var L = s.lay;
  if (!L || !s.pick) return;
  /* 淡入：纸还是斜梯形时压一块横平竖直的字，看着像字浮在纸外面
     （这个坑在别处见过近亲）。0.60→0.92 之间淡进来。 */
  var a = clamp((s.face - 0.60)/0.32, 0, 1);
  if (a <= 0.01) return;
  var sx = (2*hv)/L.w, sy = (2*hh)/L.h;
  if (!(sx > 0.02) || !(sy > 0.02)) return;
  var cx = s.fx, cy = s.fy;
  ctx.save();
  ctx.globalAlpha *= a;
  ctx.translate(cx, cy); ctx.scale(sx, sy); ctx.translate(-cx, -cy);
  var x0 = cx - L.w/2 + L.pad, y0 = cy - L.h/2 + L.pad;
  ctx.font = L.fs + "px " + PAPER_FONT;
  ctx.fillStyle = P.pcol;
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  for (var i=0;i<L.lines.length;i++){
    ctx.fillText(L.lines[i], x0, y0 + i*L.lead);
  }
  /* 出处：正文块下面空一档，右对齐收在右下角（附注的位置，不跟正文抢视线）。 */
  ctx.font = (L.fs*0.80) + "px " + PAPER_FONT;
  ctx.fillStyle = P.pcol2;
  ctx.textAlign = "right";
  ctx.fillText("—— 《" + L.src + "》", x0 + L.w - L.pad*2, y0 + L.block + L.fs*0.90);
  ctx.restore();
}

/* ?hold= 的驱动（见 FR 那段注释）。保证场上有一张"被拿着的"纸，且它的
   位置 / 转正程度每次都被写死。
   ★ 必须在 stepHold **之后**、每帧的最后跑 —— 否则 stepHold 里那两条 follow
     会把 face 拽向 1、把 fx/fy 拽向 pointer，定格就定不住。
   ★ fw/fh 在这里补：正常路径是"按下那一刻"冻结的（见 pointerdown），
     ?hold= 没有那一刻，就用"长到头之后"的几何算一遍 —— 同一套式子。 */
function freezeHold(){
  var s = sheets[0];
  if (!s){ s = spawnSheet(); if (!s) return; }
  s.t = P.pRise + P.pGrow;          // 刚好长到头、还没开始往外滑
  s.held = true; s.hold = { ox: 0, oy: 0 };
  if (!s.fw){
    var g = sheetGeom(s), N = Math.max(6, P.rays)|0,
        sp = clamp(P.pSpan|0, 1, N-1), rm = Math.max((g[0]+g[1])/2, 1);
    s.fw = (sp/N)*6.283185307*rm - P.pEdge*2;
    s.fh = g[1] - g[0];
  }
  s.fx = frX(); s.fy = frY();
  s.face = FR.face;
  /* ★ 把「拉扯」归零。不归零的话这个探针**出的图是假的**，而且假得不显眼：
     stepHold 每帧仍在跑，它的目标位置是 pointer（定格时停在 0,0），而纸心被
     钉在屏幕中央 —— 于是"跟手滞后量"永远拉满，puff 卡在夹子上限 0.45。
     而 puff 是**只横向抻**的（hv 里那个 (1+puff)），字跟着一起抻：
     量出来 sx 1.45 × sy 1.00，也就是纸上每个字被横向拉了 45%，
     看着就是"字怎么扁扁的"。而纸的长宽其实早就长到位了（zx=tzx、zy=tzy）。
     定格的语义是"纸在手上、已经稳住了"，那就该是 puff=0 ——
     手真在甩的时候才该有那个滞后。 */
  s.puff = 0;
}

function drawSheet(s){
  var Q2 = sheetQuad(s), r0 = Q2.r0, r1 = Q2.r1, q = Q2.q;
  if (r1 - r0 < 0.7) return;              // 还是个点，别画（0 宽的多边形等于没画）
  poly(q, C.paper);
  drawPaperText(s, Q2.hv, Q2.hh);         // 抽到的那一段（见上）
  /* 消散：不是淡出，是红斑把纸啃掉（见 dsInit 上面那一整段）。 */
  if (s.dying > 0){
    /* 一张遮罩搞定，globalAlpha 保持 1 —— 进度已经烧进遮罩的 alpha 里了。
       ★ 遮罩是**屏幕轴对齐**的：不随纸的角度转。它表达的是"红斑从上方啃进来"
       这件屏幕上的事，而纸的 θ 出生后就定死了（见 spawnSheet），两者互不干扰。

       ★★ 2026-10-07 用户：「纸的晕染消失怎么留下的红色遮罩，不应该是透明吗，
       露出后面的东西」—— 对的，这一版之前是拿**底色同色**的红盖上去，所以纸
       "消失"的最后那块是**一片没有棱线的纯红**，而纸跨了 6 条棱线（pSpan=6），
       在满屏放射线里就是一块秃斑。实测（_logs/_papermask.py）：纸的矩形里
       深色像素 0 个，纸来之前/走了之后同一块都是 9.8% —— 那几条线是**整段
       缺失**的，直到纸被删掉那一帧才一起跳回来。

       当时的理由是「擦会擦穿」：纸和井壁在**同一张** canvas 上，destination-out
       把纸擦掉的同时也把底下的 backdrop 擦了，露出 canvas 下面的页面底色
       （见 dsInit 里那条 :625 的旧注释）。现在纸画在自己的层（#cvup）上 ——
       擦掉的只是这一层的像素，下面 #cv（井壁+棱线+井里的字）和 #exit 原封不动。
       同一个动作这才成立。

       ★ 前提：**这一段只在 #cvup 上跑**。井里那些纸画在主 canvas 上，而它们
       永远不晕染（dying 只在 release() 里设，release 只对拿起的纸生效），
       所以走不到这儿。哪天要把晕染搬回主 canvas，先回来读这一条。
       ★ 遮罩只用到 alpha 通道，颜色无所谓 —— dsMaskAt 里填的底色现在是死数据，
       留着是为了把 scratch 打印出来时肉眼看得到"啃到哪儿了"。 */
    var M = dsMaskAt(s.dying/P.die);
    var x0 = Math.min(q[0][0],q[1][0],q[2][0],q[3][0]),
        y0 = Math.min(q[0][1],q[1][1],q[2][1],q[3][1]),
        x1 = Math.max(q[0][0],q[1][0],q[2][0],q[3][0]),
        y1 = Math.max(q[0][1],q[1][1],q[2][1],q[3][1]);
    if (x1 - x0 > 0.5 && y1 - y0 > 0.5){
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(q[0][0], q[0][1]);
      ctx.lineTo(q[1][0], q[1][1]);
      ctx.lineTo(q[2][0], q[2][1]);
      ctx.lineTo(q[3][0], q[3][1]);
      ctx.closePath();
      ctx.clip();                          // 遮罩只在纸的形状里生效
      /* 真擦。擦掉的地方是**透明的**，合成时露出下面那一层的东西（理由见上）。 */
      ctx.globalCompositeOperation = "destination-out";
      ctx.drawImage(M, x0, y0, x1-x0, y1-y0);
      ctx.restore();                       // restore 会把 composite 一起还原
    }
  }
  /* ★ 这里**不**补画纸的边界棱线（2026-10-07 改）。补画过两版，两版都不对：
     骑在纸边上 → 一半落在纸外，被抗锯齿摊成比周围 95 条淡得多的痕迹；
     挪进纸内 2px → 看得见了，但它成了"给纸描的一条边"，出纸就断 ——
     用户的评价是「纸边缘怎么上面有黑线，你是对不齐吗」。
     现在靠 P.pEdge 把纸收窄，棱线**自己**完整地留在纸外，只有 r0..r1 那一段
     被纸压住。一条线从画面外穿进来、中间被纸压着的读法才对。 */
}

function stepSheet(dt){
  /* 出生**只按定时器**，不按"场上还差几张"补位。用户 2026-10-07：
     「请均匀的放纸，而不是一阵一阵的，很怪」。
     ★ "一阵一阵"是怎么来的：上一版是"到点 + 有位子"两个条件同时成立才生。
     三张纸间隔 1.15 秒落（寿命约 4.6 秒），第三张一落场上就满 3 —— 于是下一张
     要等**第一张死**，出生间隔当场变成 1.15 / 1.15 / 2.31 / 1.15 / 1.15 / 2.31…
     周期性冒出一个双倍空档，看上去就是"一阵一阵"。
     现在把 gap 调到和寿命相称（寿命 ≈ 4.6s，gap 1.85 ⇒ 场上恒定 2~3 张），
     P.n 只当保险丝，正常跑不到。
     ★ 入场闸（spawnSheet 里的 demoT < P.wt）返回 null 时**不重置**计时器，
     否则入场一结束要白等一个 gap 才出第一张。 */
  /* ?hold= 定格时不再生新的：探针要的是"就那一张"，多出来的纸会挤进画面
     挡住判读（它们是完整画出来的，不是幽灵）。 */
  if (!FR){
    sheetQ -= dt;
    if (sheetQ <= 0 && sheets.length < P.n){
      if (spawnSheet()) sheetQ = P.gap;
      else sheetQ = 0;
    }
  }
  /* 内端滑出画面才算走完。用内端不用外端：外端早就出画了，拿它判会把纸
     按在画面边缘多留一秒。
     ★ 这个数要按**最宽的那一边**（半宽 W/2=720）定，不能按半高（450）：
     朝左右飘的纸在 r=450 时还看得见一大块，按 450 判就是"纸还在画面里就淡出了"。
     取 0.50·max(W,H) = 720（1440 下）—— 正好是半宽，朝正右的纸内端刚好压到右边缘。
     ★ 它同时是**纸能长到多大**的上限：纸在近处必然大（屏幕尺寸 ∝ 半径），
     所以"纸太大"这个抱怨唯一的解法就是让它早点走完。0.55→0.50 是为这个收的。 */
  var kill = Math.max(W,H)*0.50;
  for (var i=sheets.length-1;i>=0;i--){
    var s = sheets[i];
    if (s.dying > 0){                    // 晕染中：生长冻住，只推进消散进度
      s.dying += dt;
      if (s.dying > P.die) sheets.splice(i,1);
      continue;
    }
    if (s.held){ stepHold(s, dt); continue; }   // 被手拽着：不生长、不判 kill
    s.t += dt;
    /* ★ 滑出画面**直接删**，不再走一遍淡出（2026-10-07 改）。
       那 0.5 秒淡出是给"晕染消失"占位用的；晕染只属于**被手拉过的纸**——
       松手那一下的收尾。自己飘出画外的纸已经看不见了，再淡一遍纯属浪费，
       而且它会在画面边上留一段半透明的纸（原来那个 0.5 秒就是这么来的）。 */
    if (sheetGeom(s)[0] > kill) sheets.splice(i,1);
  }
}

/* ── 物理 ────────────────────────────────────────────────────────── */
var cards = [], spawnQueue = 0,
    pointer = {x:0,y:0,down:false,card:null,sheet:null,px:0,py:0,vx:0,vy:0,has:false};

function spawn(x){
  /* ★ 入场没走完，井里一本都不放。
     原来页面一加载就 spawn 了 P.n 本，它们跟字**同时**从灭点往外长 —— 等 2.2 秒
     的入场看完，书早就飞到眼前了，看到的是"画面里本来就有几本大书"，而不是
     "书从井口的那个小点掉过来变大"。
     ★ 闸设在 spawn() 里，不在 step() 里：spawn 有三个调用点（初始化那一串、
     补书、?auto=1 的演示定时器），漏掉任何一个都会造出一堆静止的书钉在画面上。
     ?wt=0（关入场）时 demoT=0 也不小于 0，这一条恒不成立 —— 于是初始化那一串
     仍然照放，?t=0&wt=0 那类探针（书要钉住不动才好量）不受影响。 */
  if (demoT < P.wt) return null;
  /* ★ 出生在**井口**（灭点）。2026-10-06 用户两条：「你给我的画面甚至是包括了
     外面的一些，太奇怪了」+「照片是从井口出现由小变大落向我们」—— 旧版出生在
     y=-H*0.62（投影后在画面上方**外面**），卡片是从画框外钻进来、只露半截，
     那不是井里的东西。

     现在：世界坐标 x/y 都贴近 0（投影后就落在消失点那个小圆里），z 取**负**
     —— z 是朝观察者的正方向，负 z 就是井底深处，投影系数 k=persp/(persp−z)
     远小于 1，于是它一开始只是个极小的点，一路飞来才长大。 */
  /* 出生散布：世界坐标 ±0.20W，出生时 k≈0.27，投影后只有 ±39px —— 落在井口那个
     86px 的圆里，看着确实是"从井口出来"。这里给的是世界坐标，投影时还要乘 k，
     所以出生看着聚在井口，飞到眼前才自然拉开。
     为什么不是旧版的 0.36W：那时 5 张卡片**同时**出生、又没有初速，散布窄会糊成
     一团（实测投影后挤在 56px 里）。现在一本本落（gap）且各有横向初速，糊不起来；
     而 0.36W 反倒让书出生就不在井口圆里。 */
  var c = new Card(((rnd()*1e9)|0)>>>0,
                   x===undefined ? (rnd()-0.5)*W*0.20 : x,
                   (rnd()-0.5)*H*0.12);
  c.z  = -P.z0*(0.72 + rnd()*0.56);
  c.vz =  P.vz*(0.80 + rnd()*0.40);     // 朝我们飞
  /* ★ 往上散，**不给向下**。用户 2026-10-07：「书的落点往上左右搞，到正下方有种
     被砸的感觉」—— 灭点正下方是那四行字，书从那儿穿过去就是砸在字上，还挡字。
     初速取 -0.45 ~ -1.0 倍 svy（书上、书下都出，但都不往下走）。
     ★ 横向那条是**主力**，而且必须**有下限**。用户接着补了一句「砸到正中间也不要，
     反正就是不要太到遮挡视线的地步」—— 书正对镜头飞会越变越大，最后糊在画面正中，
     那正是井和字待的地方。让它一出生就斜着走，等它大到显眼时人已经偏到边上、
     再往外出界。
     ★ 用"方向 × 有下限的速率"而不是 (rnd()-0.5)：后者会随机到接近 0，正好被抽中
     的那本书还是笔直冲镜头 —— 而它只要出一本就够挡一次视线。 */
  c.vy = -P.svy*(0.45 + rnd()*0.55);
  c.vx = (rnd() < 0.5 ? -1 : 1) * P.svx*(0.45 + rnd()*0.55);
  c.wx = (rnd()-0.5)*1.2; c.wy = (rnd()-0.5)*1.0; c.wz = (rnd()-0.5)*1.6;
  cards.push(c);
  return c;
}

function step(dt){
  /* 两套并存的唯一分岔口。PIN 那条预跑循环调的也是 step()，所以这里一分岔，
     预跑出来的就跟实时同一件事 —— 不用另写一遍。 */
  if (P.paper) return stepSheet(dt);
  /* 补书。**空场时立刻放第一本** —— 入场刚走完那一刻井里是空的，要马上有东西从
     井口出来；之后按 gap 一本本落。原来是一次性 spawn 完 P.n 本，五本同时从井口
     冒出来在同一个位置叠成一摞，看不到"一本一本掉下来"这件事。 */
  if (spawnQueue > 0){
    spawnQueue -= dt;
    if (spawnQueue <= 0){ spawn(); spawnQueue = P.gap; }
  } else if (cards.length < P.n){
    spawn(); spawnQueue = P.gap;
  }
  for (var i=cards.length-1; i>=0; i--){
    var c = cards[i];
    if (c.dying > 0){
      c.dying += dt;
      if (c.dying > 0.5) cards.splice(i,1);   // 补书交给上面那一段，不在这里另设队列
      continue;
    }
    if (c.held){
      /* 跟手：位置用指数滤波追指针，速度也跟着滤 —— 松手时继承的就是
         **滤过的**速度，不是最后一帧的差值（后者在抬手瞬间会抖）。 */
      var tx = pointer.x - VP.x, ty = pointer.y - VP.y;
      c.x = follow(c.x, tx, P.follow, dt);
      c.y = follow(c.y, ty, P.follow, dt);
      c.z = follow(c.z, 70, P.follow, dt);
      c.vx = follow(c.vx, (tx-c.x)*P.follow, P.follow, dt);
      c.vy = follow(c.vy, (ty-c.y)*P.follow, P.follow, dt);
      /* 拖的时候卡片**迎着运动方向倾**，这是"有重量"最省事也最有效的一笔 */
      c.rz = follow(c.rz, clamp(c.vx*0.00028, -0.34, 0.34), 8, dt);
      c.rx = follow(c.rx, clamp(-c.vy*0.00022, -0.30, 0.30), 8, dt);
      c.ry = follow(c.ry, 0, 6, dt);
      c.wx = c.wy = c.wz = 0;
      continue;
    }
    c.vy += P.grav*dt;
    var d = Math.exp(-P.drag*dt);
    c.vx *= Math.exp(-P.dragX*dt);   // 横向阻力单独一个小值，见 P.dragX
    c.vy *= d;
    c.x += c.vx*dt; c.y += c.vy*dt;
    /* z **不吃阻力**：卡片要匀速从井底飞过来，一加阻力它就停在半路上了。
       阻力只作用于横向的 vx/vy。 */
    c.z += c.vz*dt;
    c.rx += c.wx*dt; c.ry += c.wy*dt; c.rz += c.wz*dt;
    c.wx *= d; c.wy *= d; c.wz *= d;
    if (REDUCE){ c.vx=c.vy=0; c.wx=c.wy=c.wz=0; }
    /* 出界 = 扔掉了。做「魔法消失」而不是直接删，是因为那一笔才是参考里
       被夸"细节"的地方（转到侧立、只剩一条深片）。
       ★ 判据用**投影后的屏幕坐标**：投影中心挪到消失点之后，世界 y 和屏幕 y
       不再只差一个常数（还差一个 k），拿 c.y 直接比会判错位置。
       ★ 卡片现在是朝观察者飞的，所以还多一条：q[2] 就是投影系数 k，它随
       z→persp 发散。不加这道闸，卡片的 z 越过 persp 会翻号，一帧之内把整个
       画面糊掉（而且不报错）。
       ★ 上限从 3.0 降到 1.8 是**照着原片量的**，不是保守起见。用户 2026-10-07：
       「你可以看看原片，书是一直都比较小的，然后从上左右边界处离开」。抽 92~120s
       每帧看：卡片最大那几张约占屏高 42%（900 的 378px）；而 k=3.0 时屏盒
       647×592 = 屏高 66%，屏心离灭点只有 83px —— 就是"糊在正中间"的本体。
       k=1.8 时书屏盒约 284×387（屏高 43%），跟原片最大那张一个量级。
       横向飘得够快的书会先撞 q[0] 的边界出画，撞这里的只是 vx 偏小那几本。 */
    var q = proj([c.x, c.y, c.z]);
    if (q[0] < -W*0.31 || q[0] > W*1.31 || q[1] > H*1.35 || q[2] > 1.8) c.dying = 0.001;
  }
}

/* ── 背景：一口井 ──────────────────────────────────────────────────
   用户原话：「他的背景通过线条和字构建出一种立体状态，就好像这是个井口」，
   并且「下面的那个字也是立体的一部分」。拆成三件事 —— 但**必须共用同一个
   消失点**，各用各的就是两层贴纸，一眼穿。

   全部尺寸来自原片实测（_logs/_wod/_x/full_00107.1.png，1280×720）：

   1) 井壁的棱线。从消失点全向发散的放射线。"中心密、边缘疏"不用另做 ——
      屏幕上相邻两条线的间距本来就是 r·dθ，随 r 线性变大。原片里粗细**不一**：
      绝大多数是细线，少数明显更粗；均匀的线看着像量角器，几根粗的才像结构。

   2) 远端那个洞。消失点处一个比周围亮的圆，**线不穿过它**。放大看半径约
      22px（0.031H），里面还落着几颗碎石。

   3) 四行字，沿消失点正下方的轴。实测：

        行      y 中心  距消失点   行距          字高
        CODING   359.5   103.5      —            24
        MY WAY   395.5   139.5   36  (×2.14)     44
        SINCE    472.5   216.5   77  (×1.87)     58
        1997     616.5   360.5  144  (×1.87)    172

      **行距和字高都是每行翻一倍。** 拟合 d(j) = 72.5 + 36·2^j，四行全中。
      这不是挑出来的曲线：等比靠近相机，屏幕上的 k 就按 2^j 走，而字高 ∝ k、
      行距 ∝ Δk ∝ k，两条同时成立。所以下面直接写 pow(2,j)，换行数不用重调。
      字是**单层实心**（放大 3 倍核过，没有叠影），向右倾。

   配色没有照抄原片。原片是**亮井壁 + 深色刻字**；这里是深蓝的夜，反过来做：
   配色是照原片量的（_logs/_fxt_ref.py），不是照感觉调的：
     底    #F40B3E   纯粹的鲜红
     棱线  #B5001E   只比底暗一档的暗红，**全部 1px**、同色、不透明
     字    #150001   纯黑
     灭点  那里什么也没画 —— 看着像个"亮盘"，其实是**棱线不穿过去**造成的：
           周围密布线所以显暗，中间干净所以显亮。在那里加光晕是反的。
   立体感全部来自"所有棱线汇聚于一点"这一个事实，颜色只是陪衬。
   （早先凭印象定了深蓝底 + 蓝白光晕 + 粗细混搭的线，出图是一团宇宙星光。） */
/* 井是**静态的**：底色、棱线、那四行字，一秒里一个像素都不会变。所以整口井
   只画一次到离屏 canvas，之后每帧一次 drawImage 贴回来。

   ★ 这不是提前优化。加了纵向透视之后每个字要切成 ~35 条横带（4 行 × 6 字
   × ~35 ≈ 每帧 800 次 clip+fillText，每个字还要栅格化 240×5px），而它压根
   不变 —— 每帧重做纯属白烧。判据：wellArt 里没有一个字用到 t。 */
/* 井壁一层、字一层，**分开缓存** —— 因为纸要夹在中间。
   ★ 为什么非要夹：纸的左右两条边正好落在两条棱线上（"被某两条黑线约束"），
   所以棱线必须画在纸**上面**那条边才看得见。都烘在一张里的话，纸压棱线，
   屏幕上就是"一块浮着的白"，用户 2026-10-07 的原话是「纸现在真的是被两个
   黑线约束吗，边界不在黑线上啊」—— 他要看见线。
   顺序：backdrop（背景+棱线）→ 纸 → textLayer（字）。字仍在最上面，
   所以纸永远不会压字，这一条不靠角度让位也成立。 */
var wellCv = null, textCv = null;

/* 把 drawFn 画进一张全屏离屏 canvas，再贴回主 canvas。slot 选缓存槽。
   缓存按**设备像素**开（W*DPR），内部坐标系也乘 DPR —— 跟主 canvas 一套。
   开成 W×H 的话，贴回来时被主 ctx 的 DPR 变换放大，整口井糊一倍。 */
function layer(slot, drawFn){
  var bw = Math.round(W*DPR), bh = Math.round(H*DPR);
  var cv = slot === "text" ? textCv : wellCv;
  if (!cv || cv.width !== bw || cv.height !== bh){
    cv = document.createElement("canvas");
    cv.width = bw; cv.height = bh;
    /* 这几层都是照着外层的 ctx 写的，这里临时把它指到离屏上。
       finally 是必需的：漏了还原，整页会静默画进那块看不见的 canvas，屏幕上
       只剩一片黑，而且不报任何错。 */
    var outer = ctx;
    try {
      ctx = cv.getContext("2d");
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      drawFn();
    } finally { ctx = outer; }
    if (slot === "text") textCv = cv; else wellCv = cv;
  }
  /* ★ 目标尺寸显式写 W,H。主 ctx 已经被乘了 DPR，只写 (0,0) 的话 drawImage 会
     拿源的**像素**数当 CSS 单位用，整口井被放大 DPR 倍。 */
  ctx.drawImage(cv, 0, 0, W, H);
}

/* 底层 = 背景 + 光晕 + **全部**棱线。中间那几条棱线就该被纸盖住 ——
   压在纸上的只有纸自己的两条边界，那两条由 drawSheet 单独重画。 */
function backdrop(){ layer("well", function(){ wellArt(1, false); }); }
function textLayer(){ layer("text", function(){ wellText(1); }); }

/* prog：入场进度 0..1，不给就是终态。
   ★ 井原来是**静态**的（draw 里一个像素都不变），所以整口井只画一次到离屏、
   之后每帧一次 drawImage。入场把这条打破了 —— 线和字每帧都在动 —— 所以
   入场那两秒走的是每帧重画的另一条路（见 frame）。代价用降精度抵掉
   （见 wellIntro）。 */
/* 背景 + 光晕。最底的一层，纸和棱线都画在它上面。
   从 wellArt 里抽出来，是因为棱线要挪到**纸上面**去（见 wellRays 与 frame）。 */
function wellBase(){
  ctx.fillStyle = P.bg; ctx.fillRect(0,0,W,H);
  /* 可选的光晕。默认关 —— 见 P.hole 那行的注释。 */
  if (P.hole > 0){
    var ox = VP.x, oy = VP.y, holeR = Math.min(W,H)*0.048;
    var R = holeR*5.0, a = P.hole;
    var g = ctx.createRadialGradient(ox, oy, 0, ox, oy, R);
    g.addColorStop(0,    "rgba(255,120,150," + (0.30*a).toFixed(3) + ")");
    g.addColorStop(0.30, "rgba(255, 90,128," + (0.13*a).toFixed(3) + ")");
    g.addColorStop(1,    "rgba(255, 70,110,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ox, oy, R, 0, 6.2832); ctx.fill();
  }
}

/* 井壁的棱线。全部 1px、同色、不透明 —— 原片就是这样。
   早先混了 2.6px 的"粗线"还加了蓝白光晕，出图整个是"宇宙星光"：
   粗细和颜色一有变化，眼睛就读成"发光体"而不是"一堵墙上的经线"。
   ★★ 它**不进 backdrop 那张缓存**，而是每帧重画一遍、画在纸**上面**。
   这是"被某两条黑线约束"唯一看得见的排法：纸的左右两条边正好落在第 i 与
   第 i+span 条棱线上，棱线要是被纸压住，屏幕上就只剩"一块浮着的白"——
   用户 2026-10-07 的原话是「纸现在真的是被两个黑线约束吗，边界不在黑线上啊」。
   96 条 1px 线的重画成本远低于一次全屏 drawImage，不值得再为它开一层缓存。 */
function wellRays(prog){
  if (prog === undefined) prog = 1;
  if (!(P.rayA > 0)) return;
  var ox = VP.x, oy = VP.y;
  var holeR = Math.min(W,H)*0.048;
  var N = Math.max(6, P.rays);
  var len = Math.sqrt(W*W + H*H)*1.35;
  /* 入场：**内端**从画布外收进来，外端一直钉在画布外 —— 看上去就是"线从
     四面八方向中间进发"。所有内端停在同一半径 holeR*0.9 上，那个圆就是井口；
     它不是我另外画的一个圆，是线收完的自然结果。
     棱线在字出来之前就该就位，所以它只占总进度的前 55%，两条时间线叠一段。 */
  var pr = clamp(prog/0.55, 0, 1);
  ctx.lineWidth = 1;
  ctx.strokeStyle = P.line;
  ctx.globalAlpha = P.rayA;
  for (var i=0;i<N;i++){
    var th = (i/N)*6.283185307 + 0.37;
    var ca = Math.cos(th), sa = Math.sin(th);
    /* 每条线晚一点出发（按角度错峰 0.25 个总进度），否则 96 条一起动像一块
       帘子齐刷刷拉开，而不是"进发"。 */
    var pi = clamp((pr - (i/N)*0.25)/0.75, 0, 1);
    pi = pi*pi*(3 - 2*pi);                       // smoothstep
    var rin = holeR*0.90 + (len - holeR*0.90)*(1 - pi);
    if (rin >= len) continue;                    // 还没进画面
    ctx.beginPath();
    ctx.moveTo(ox + ca*rin, oy + sa*rin);
    ctx.lineTo(ox + ca*len, oy + sa*len);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* 入场那条路要一帧画全（背景+棱线+字），所以保留这个合体版本；
   终态走的是分开的三层，见 frame。 */
function wellArt(prog, withText){
  if (prog === undefined) prog = 1;
  if (withText === undefined) withText = true;
  wellBase();
  wellRays(prog);
  if (withText) wellText(prog);
}

/* 入场那两秒专用的井。线和字每帧都在动，用不了离屏那张缓存，只能每帧重画。
   重画的大头是字被切成 NS 条（终态量到 145 条上下，见探针 geo.nsMax）。动的时候
   1px 的台阶看不出来 —— 整行正在位移和缩放 —— 所以临时把 P.step 放大 3 倍，
   条数降到 1/3，重画成本也就降到 1/3。
   ★ 必须 try/finally 还原：P.step 是全局参数，漏还原的话入场结束后整页的字会
     一直带着粗台阶，而且不报任何错。 */
function wellIntro(prog){
  var st = P.step;
  P.step = st*3;
  try { wellArt(prog); } finally { P.step = st; }
}

/* 井里那几行字。和"画几行字"的差别是：**宽度和高度是两条独立的线**。
   原片实测（逐行数像素，见 _logs/_fxt_ref.py）：
     行        距灭点   字高   字宽
     CODING    103.5     21    174
     MY WAY    139.5     42    292
     SINCE     216.5     82    302
     1997      360.5    168    360
   字高 21→42→82→168 是**严格的 ×2**，行距 36→77→144 也 ≈ ×2。
   但字宽只从 174 涨到 360（2.07 倍），**远慢于 ×2**。
   所以每一行都被**纵向拉伸**了，越靠下越狠 —— 1997 那行的 "9" 在屏幕上是个
   窄高的椭圆，比正常字形高两倍多。这不是特效，是"字贴在井壁上"该有的样子：
   横向随距离缩，纵向随深度拉。做成等比就完全没有井的感觉（上一层图里 SINCE
   宽到 527，原片是 302，一眼就不是一个东西）。
   所以下面不拿"字号"驱动，改成**宽度和高度各给一个目标值**：targetW 由
   P.w0·P.kwq[j] 定，cap 由 P.cap0·2^j 定，字号去凑宽度，剩下的缺口由 ky 拉出来。
   ★ 宽度**不再**跟着 kz=2^j 走 —— 理由见 P.kwq。 */
function wellText(prog){
  if (prog === undefined) prog = 1;
  var L = P.lines, n = L.length;
  var cap0 = H*P.cap0;           // 最远那行的字高 —— 原片 21/720
  /* 横向**也**按高度取，乘的是 H*(16/9) 这个"等效宽度"：16:9 下它与 W 完全相等
     （1280×720 时都是 1280），只有画面比例变了才分道扬镳。直接乘 W 的话，宽屏上
     字板会横向拉宽而纵向不动 —— 整个字板跟着变形，而不只是变大。 */
  var w0   = H*(16/9)*P.w0;      // 最远那行的宽度 —— 原片 174/1280
  var y0   = H*0.1437;           // 板上最近那端离消失点多远 —— 原片 103.5/720

  window.__well = [];
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (var j=0;j<n;j++){
    /* ── 入场：整块字板从灭点长出来 ──────────────────────────────
       棱线先收（它占前 55%），字等它收到一半才起步。
       ★★ **位置和尺寸乘同一个 s**，这是这段唯一要紧的一条。第一版不是这么
       写的 —— 那版把每行沿深度往回推（zj -= persp*zback*(1-pe)），听着更"物理"
       （字贴在井壁上，板从井底升上来），但透视对"位置"和"尺寸"的压缩不是一回事：
       推远 540px 之后四行的 kz 从 1:2:4:8 被压成 1:1.45:1.88:2.21，**行距比字高
       塌得更快**，量出来行距/字高只有 0.35（终态 1.37），四行在中段糊成一块黑饼
       —— 出图 ?t=800 一看就看见了，读代码是看不出来的。
       乘同一个 s 则任何时刻的行距/字高都等于终态，从最小到最大一路都读得清，
       观感也仍然是"由小变大、由远及近"（整块板从灭点朝我们过来）。
       s=1 时下面几项全部还原成原值，**终态与入场前逐像素一致**。 */
    var pe = clamp((prog - 0.40)/0.60, 0, 1);
    pe = pe*pe*(3 - 2*pe);                     // smoothstep：末段减速才像"落定"
    var s  = P.s0 + (1 - P.s0)*pe;

    /* 从斜板上取第 j 行（推导见 P.slope 那段注释）。 */
    var zj  = P.persp*(1 - Math.pow(0.5, j));
    var kz  = P.persp/(P.persp - zj);          // = 2^j，斜面的投影系数
    var cap = cap0*kz*s;
    var cy  = VP.y + (y0 + P.slope*zj)*kz*s;
    if (cy - cap > H*1.15) break;        // 已经掉出画面，后面几行只会更靠下

    var txt = L[j].replace(/^\s+|\s+$/g, "");
    if (!txt) continue;

    /* 先在 100px 下量一遍，再反推"正好凑成 targetW"的字号。
       宽度必须是**给定**的，不能靠"字号 × 倍率"去逼近 —— 每行的字数不一样
       （还有带空格的 MY WAY），按字号缩放永远差一截。 */
    /* 宽度单独一条序列。字号 kz 仍然是 2^j（它同时管着 cap 和 cy），只有宽度
       不跟它走 —— 见 P.kwq。行数超过序列长度时沿用最后一档，不报错。 */
    /* × s：入场时整块板还小一号（见上面）。cap 也跟着 s 小了，所以
       ky = cap/(fs·CAP) 这个比值不变 —— 纵向拉伸量不用另外调，正是要的。 */
    var targetW = w0*P.kwq[Math.min(j, P.kwq.length-1)]*s;
    ctx.font = "900 100px " + FONT;
    var ch = txt.split(""), wd = [], probe = 0, k;
    for (k=0;k<ch.length;k++){ probe += ctx.measureText(ch[k]).width; }
    probe = probe*P.ew + (ch.length-1)*100*P.sp;
    var fs = 100*targetW/probe;
    ctx.font = "900 " + fs.toFixed(1) + "px " + FONT;

    /* 逐字量宽。要的不是"能不能画"，是每个字的**中心**在哪 —— 一行横过去时
       两端离观察者更近，位置和大小都要跟着变（见下面 u）。 */
    for (k=0;k<ch.length;k++){ wd[k] = ctx.measureText(ch[k]).width * P.ew; }
    var sp = fs*P.sp, tw = 0;
    for (k=0;k<ch.length;k++) tw += wd[k];
    tw += sp*(ch.length-1);

    /* 纵向那一半：字号是宽度那条线给的，字高是另一条线给的，缺口全在 ky 上。
       cap/(fs*CAP) 就是"还要把字形纵向拉多少才够高"。 */
    var ky = cap/(fs*CAP);

    /* 探针用：这一行的几何。拿图去数像素会被 HUD、棱线一起干扰，
       而这里每个数本来就是算出来的，直接给出来最准。 */
    var geo = { j:j, txt:txt, cy:cy, cap:cap, fs:fs, tw:tw, ky:ky,
                d:cy - VP.y, x0:VP.x - tw/2, nsMax:0 };
    window.__well.push(geo);

    var x = -tw/2;
    for (k=0;k<ch.length;k++){
      var xc = x + wd[k]/2;
      x += wd[k] + sp;
      /* u = 这个字在这一行里的横向位置（-1..1）。两端 u² 大 → 更靠近观察者 →
         kk 更大 → 屏幕上更大、而且**离消失点更远**。后者就是"整行两端往下沉"：
         原片 1997 的顶弧中间高、两端低约 17% 字高，整体 fillText 是平的，
         做不出来。用 kk 同时推大小和位置，两项才是一致的。 */
      var u  = tw > 0 ? xc/(tw/2) : 0;
      var kk = 1 + P.curl*u*u;

      /* ★ 纵向透视：同一个字的**顶边比底边远**，所以顶边窄、底边宽 —— 一个字
         本身是个上窄下宽的梯形，不是上下等宽的贴纸。这是"字贴在斜面上"的直接
         后果：横向尺度 ∝ 离灭点的距离，于是
             k顶/k底 = (dy − 半高) / (dy + 半高)
         算出来 1997 顶比底窄 38%、SINCE 窄 33%、CODING 只窄 18% —— 越靠近我们
         越明显，正是该有的样子。

         canvas 2D 只有仿射变换，画不出梯形，只能把字符切成 NS 条横带、每条按
         自己的系数画一遍。**clip 的路径存的是设备坐标**，所以 clip 之后再 scale
         只缩字形、不缩带子 —— 这是这段能成立的全部理由，顺序反了就废。 */
      var dRow = cy - VP.y;                    // 这一行（字符中心）离灭点多远
      var half = cap*kk*0.56;                  // 屏幕半高，留 12% 余量给描边
      var kTop = dRow > half ? (dRow - half)/(dRow + half) : 1;
      /* 条数由**台阶**反推，不由带高定。这条带的横向位置是 xc*kk*kS，相邻带
         kS 差 (1−kTop)/NS，于是边界处的错位 = (1−kTop)×|离灭点最远的那条边|/NS。
         让它 ≤ P.step 就解出 NS。用"最远的那条边"（|xc*kk| + 半字宽）而不是
         字宽本身：位移项和缩放项叠加，外面那条边永远是台阶最大的地方。
         上限 400 只是防 ?step 被填成 0.01 时炸掉；kTop=1（这一行已经在灭点上）
         时 NS 落到下限 6 —— 那时确实没有透视可切。 */
      var maxX = Math.abs(xc*kk) + wd[k]*kk/2;
      var NS   = clamp(Math.ceil((1 - kTop)*maxX/P.step), 6, 400);
      if (NS > geo.nsMax) geo.nsMax = NS;      // 探针：这一行最费的那个字切了几条

      ctx.save();
      /* 原点放在**灭点的水平位置**上，不是字符自己的中心 —— 理由见下面那条
         translate。纵向那条 curl 修正照旧加在这里（它只跟 kk 有关）。 */
      ctx.translate(VP.x, cy + (cy - VP.y)*(kk - 1));
      ctx.globalAlpha = P.bgop;
      ctx.fillStyle = ctx.strokeStyle = P.bgcol;
      for (var s=0; s<NS; s++){
        var kS = 1 + (kTop - 1)*((NS - 0.5 - s)/NS);   // 顶 = kTop，底 = 1
        ctx.save();
        ctx.beginPath();
        /* 带子之间留 0.75px 重叠，不然相邻两条的边界会露出没画到的发丝缝。 */
        ctx.rect(-1e5, -half + (s/NS)*2*half, 2e5, 2*half/NS + 0.75);
        ctx.clip();
        /* ★★ 这一条横带的横向位置 = 灭点 + 字的世界横向位置 × **这一带的** k。
           透视里"远"是两件事一起发生：变小，**并且向灭点收拢**。原来只写了
           scale(kS,1)，那是围绕**字符自己的中心**缩 —— 字确实变窄了，可位置
           一动不动，于是四个字在屏幕上仍是四根平行的柱子。
           少了收拢这一半，整行反而看着**上宽下窄**：`1` 的旗和 `7` 的横杠本来
           就横伸在顶上，底部往里收的时候它们还杵在外面 —— 正好和"上端在远处"
           相反。用户看了一眼就报了「上下反了」，根子在这里，不在字形上。
           ?pull=0 关掉，对照用。 */
        ctx.translate(xc*kk*(P.pull ? kS : 1), 0);
        ctx.scale(kS, 1);
        /* 先按两轴各自缩放，**再**斜切。顺序反了的话斜切量会被纵向那个 ky 除
           一遍，越靠下的行倾斜越看不出来；而原片四行的倾角是一样的（1997 的
           "1" 实测斜率 0.3，约 17°，和上面几行没差别）。 */
        ctx.scale(P.ew*kk, kk*ky);
        ctx.transform(1, 0, -P.slant, 1, 0, 0);      // 向右倾（原片是斜体）
        if (P.sw > 0){ ctx.lineWidth = fs*P.sw; ctx.strokeText(ch[k], 0, 0); }
        ctx.fillText(ch[k], 0, 0);
        ctx.restore();
      }
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

/* ── 主循环 ──────────────────────────────────────────────────────── */
var last = 0, T0 = 0, demoT = 0;
function frame(now){
  if (!last) last = now;
  var dt = Math.min(0.05, (now-last)/1000); last = now;
  if (PIN !== null){ demoT = PIN; }
  /* ★ demoT 是**页面活了多久**，跟 P.auto 无关。auto 管的是"要不要给书一个横向
     乱飞的初速"，两件事原来混在一个 if 里 —— 于是不加 ?auto=1 直接打开页面，
     demoT 永远停在 0，入场一帧都不播，只能看见灭点上的一个小不点。
     ★ 物理**无条件跑**：书从井口掉过来是场景自己的动作，不打开 auto 也该有。
     定格（PIN）时物理不走 —— 那是预跑那条路干的事（见文件末尾）。 */
  /* `GATE` 期间钟不走，但 `step()` 照跑 —— 入场还没走完时井里本来就没有纸
     （spawn 那道 `demoT < P.wt` 的闸），所以 step 是空转，无害。 */
  else { if (!GATE) demoT += dt; step(dt); }
  /* ?hold= 的定格写在**物理之后**（见 freezeHold 那段）。PIN 那条路走不到这里
     —— ?t= 时物理本来就不跑，而定格要的是"纸已经在手上"这个状态。 */
  if (FR) freezeHold();
  /* 入场那两秒走每帧重画的另一条路（见 wellIntro）。过了就回到离屏那张缓存。
     ★ 别把 demoT 直接当进度用 —— 它跟 wt 是两回事，`wt=0` 时这一步恒不成立。 */
  var intro = (P.wt > 0 && demoT < P.wt);
  if (intro) wellIntro(clamp(demoT/P.wt, 0, 1));
  else backdrop();                        // 只在非入场时贴一次
  /* ★ 纸分两拨画（2026-10-07 用户要求：「纸被拿起后，图层就在下面那个字之上了，
     方便阅读」）——
       ① 井里那些没被碰过的纸还属于**场景**，照旧画在字之前（被字压着）；
       ② 被手拿起来的那张已经脱离井壁、成了**手上的卡片**，要画在最上面
          （压在字上），否则纸上的内容被字盖住就没法读了。
     "被拿起过"判据用 face>0：松手之后它就地晕染，face 仍是 1，正好继续压着字
     —— 消散的全过程都得看得见。held 那一条是补按下到 face 起身之间的第一帧。

     ★★ ② 现在走的是**另一张 canvas**（#cvup，见 drawUpLayer），不再是主画布。
     起因是用户同一天的第二条：「出口…图层要在拿起的纸之下」—— `#exit` 是 DOM、
     纸在 canvas 里，DOM 永远在 canvas 之上，要让纸压住它只能把纸搬到一张
     **排在 #exit 后面**的 canvas 上。顺带把消散从"涂一层底色红"换成了真擦
     （见 drawSheet 那段）。 */
  var up = [];
  if (P.paper){
    /* 井里那拨彼此**不重叠**（每张占自己的角度扇区），所以不用排序，
       也没有画家算法的顺序问题 —— 这正是"好做"省下来的那部分。 */
    for (var j=0;j<sheets.length;j++){
      if (sheets[j].face > 0 || sheets[j].held) up.push(sheets[j]);
      else drawSheet(sheets[j]);
    }
  } else {
    cards.sort(function(a,b){ return a.z - b.z; });
    for (var i=0;i<cards.length;i++) drawCard(cards[i]);
  }
  /* intro 那条路（wellIntro）已经连棱线和字一起画过了，这里不能再贴一遍。
     入场期间井里还没有纸（spawn 要 demoT > wt，见 spawn），所以 up 必是空的。 */
  if (!intro) textLayer();
  drawUpLayer(up);
  hud();
  requestAnimationFrame(frame);
}

/* 拿起的纸画进 #cvup（排在 #exit 之后的那张 canvas）。
   ★ 每帧必须先清：主画布每帧都被 backdrop() 整个盖一遍，不留上一帧的东西；
     这张层没有那样的底，不清的话纸会在上面**拖出一道轨迹**（一帧一张，越叠越多）。
   ★ 清空用设备像素 + 单位变换：setTransform(DPR…) 之后 clearRect(0,0,W,H)
     也对（W/H 乘 DPR 正好铺满），但那样依赖"W/H 和画布属性尺寸是同一个式子算的"
     这条约定；直接清设备像素不依赖任何东西。 */
function drawUpLayer(up){
  ctxup.setTransform(1, 0, 0, 1, 0, 0);
  ctxup.clearRect(0, 0, cvup.width, cvup.height);
  if (!up.length) return;
  /* 跟 layer() 同一套手法：临时把全局 ctx 指过去，drawSheet / poly 都照着它写。
     finally 是必需的 —— 漏还原的话剩下的 hud() 和下一帧会全画进这张纸层，
     而屏幕上只剩"主画布停在最后一帧"，不报任何错。 */
  var outer = ctx;
  try {
    ctx = ctxup;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (var k=0;k<up.length;k++) drawSheet(up[k]);
  } finally { ctx = outer; }
}

function hud(){
  /* 最后一张抽中的纸 —— HUD 里要能看见"抽到第几段、排了几行、纸现在多大"。
     这三件事出图时全靠它读：图上只是一块字，看不出它是不是该有这么大。 */
  var pk = null;
  for (var i=sheets.length-1;i>=0;i--) if (sheets[i].pick){ pk = sheets[i]; break; }
  document.getElementById("hud").textContent =
    "拖拽飞掷 · 样张\n"
    + (P.paper
       ? ("纸 " + sheets.length + "/" + P.n
          + "   跨 " + (P.pSpan|0) + " 条棱线"
          + "   rise " + P.pRise.toFixed(2) + "s / grow " + P.pGrow.toFixed(2) + "s"
          + "   长 " + P.pLen.toFixed(0) + "px   滑 " + P.pSpd.toFixed(0) + "px/s"
          + "   边距 " + P.pEdge.toFixed(1) + "px\n")
       : ("书 " + cards.length + "/" + P.n + "   厚度 "
          + (cards[0] ? cards[0].t.toFixed(0) : "-") + "px"
          + "   封面 " + (P.book|0) + " = " + BOOKS[P.book|0] + "（B 键换）\n"))
    /* 画布尺寸和 DPR 打出来：绘制坐标系少乘一次 DPR 时，画面只剩左上角一块，
       而 HUD 里这两个数**看起来都是对的** —— 有这行才分得清是尺子错了还是画错了。 */
    + "画布 " + W + "×" + H + " css · DPR " + DPR + " → " + cv.width + "×" + cv.height + " 设备"
    + "   纸层 " + cvup.width + "×" + cvup.height + "（拿起的纸走这张）\n"
    + "井 灭点 " + (P.vpw*100).toFixed(0) + "%W / " + (P.vph*100).toFixed(0) + "%H"
    + "   棱线 " + P.rays
    + "   字 " + P.lines.length + " 行（行距×2^j，字高∝距离）\n"
    + (P.paper
       ? (pk
          ? ("抽到 #" + pk.segN + " 《" + pk.pick[0] + "》 " + pk.pick[1].length + " 字 → "
             + pk.lay.lines.length + " 行   排版 " + Math.round(pk.lay.w) + "×"
             + Math.round(pk.lay.h) + "   此刻 " + Math.round(pk.fw*(pk.zx||0)) + "×"
             + Math.round(pk.fh*(pk.zy||0)) + "   face " + pk.face.toFixed(2) + "\n")
          : ("还没抽（拖起来，face ≥ " + P.pick + " 时抽一段）"
             + (P.pseg > 0 ? "   已钉死抽 #" + (P.pseg|0) : "") + "\n"))
         + "    die " + P.die.toFixed(2) + "s   pfol " + P.pfol
         + "   pface " + P.pFace + "   ppuff " + P.pPuff
         + "   pfs " + P.pfs + "   ppw " + P.ppw + "\n"
       : "拖起来甩出去 → 出界时转到侧立消失\n")
    + "errs=" + window.__errs.length
    + (PIN !== null ? "   t=" + PIN.toFixed(2) + "s"
       : (P.auto ? "   auto t=" + demoT.toFixed(2) : ""))
    + (GATE ? "   等闸" : "")
    + (P.wt > 0 && demoT < P.wt ? "   入场 " + (demoT/P.wt*100).toFixed(0) + "%" : "");
}

/* ── 输入 ────────────────────────────────────────────────────────── */
function hit(px, py){
  var wx = px - VP.x, wy = py - VP.y, best = null, bz = -1e9;
  for (var i=0;i<cards.length;i++){
    var c = cards[i];
    if (c.dying>0) continue;
    if (Math.abs(wx-c.x) < c.w*0.72 && Math.abs(wy-c.y) < c.h*0.72 && c.z > bz){ bz=c.z; best=c; }
  }
  return best;
}
cv.addEventListener("pointerdown", function(e){
  /* ★ 包一层 try：CDP 合成的指针事件（探针脚本派发的）pointerId 不是活的，
     setPointerCapture 会抛 NotFoundError，一抛后面整段拾取就都不执行了 ——
     症状是"探针里点不动、真人点得动"，很难查。真人点的时候照常生效。 */
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  pointer.x = e.clientX; pointer.y = e.clientY;
  /* 纸那一套（P.paper=1）：抓到就**冻住生长**、浮到屏幕前转正、跟着手走（见
     stepHold），松手晕染掉。书那一套在下面 —— 两套共用这一个 pointer 对象，
     各记各的"手上是谁"。 */
  if (P.paper){
    var sh = hitSheet(e.clientX, e.clientY);
    if (sh){
      /* 转正的起点：纸心此刻的屏幕位置 + 此刻的尺寸，都**在按下这一刻定下来**。
         尺寸必须冻结 —— 不然转正途中纸会被 r0/r1 牵着走（kill 之外的东西还可能
         动，而且释放后的漂移不是这里要的）。
         fw 是"等效屏幕宽度"：按中段半径把那段弧长算成直线，跟 sheetQuad 里的
         half 同一套算法；fh 直接是 r1-r0。 */
      var g0 = sheetGeom(sh), N2 = Math.max(6, P.rays)|0,
          span0 = clamp(P.pSpan|0, 1, N2-1);
      var rmid0 = Math.max((g0[0]+g0[1])/2, 1);
      sh.fw = (span0/N2)*6.283185307*rmid0 - P.pEdge*2;
      sh.fh = g0[1] - g0[0];
      sh.fx = VP.x + Math.cos(sh.th)*rmid0;
      sh.fy = VP.y + Math.sin(sh.th)*rmid0;
      sh.held = true;
      /* 锚 = 指针相对纸心的偏移。之后全按**这个偏移**走，所以手往哪儿甩纸都不跳
         —— 跳是"按下瞬间纸瞬移到指针底下"那个老毛病。 */
      sh.hold = { ox: e.clientX - sh.fx, oy: e.clientY - sh.fy };
      pointer.sheet = sh;
      cv.classList.add("drag");
    }
    return;
  }
  var c = hit(e.clientX, e.clientY);
  if (c){ c.held = true; pointer.card = c; cv.classList.add("drag"); }
});
cv.addEventListener("pointermove", function(e){
  pointer.x = e.clientX; pointer.y = e.clientY;
});
function release(){
  if (pointer.sheet){
    var sh = pointer.sheet;
    sh.held = false;
    sh.puff = 0;
    /* ★ 松手**立刻开始消散**，不是继续往外飘。原片那句字幕的顺序就是
       「这个图片在松开鼠标之后会有一个影像消失的效果」—— 松手 → 消失。
       手把纸拉过来、松手，它就没了；这是"拉扯过来"这个动作的收尾。
       消散期间生长冻住（stepSheet 里 continue），所以它是**在原地**烂掉的。 */
    sh.dying = 0.001;
    pointer.sheet = null;
    cv.classList.remove("drag");
    return;
  }
  var c = pointer.card;
  if (c){
    c.held = false;
    c.vx *= 1.35; c.vy *= 1.35;          // 甩出去要**比跟手速度再快一点**，不然手感发闷
    c.wz = clamp(c.vx*0.0016, -3.2, 3.2);
    c.wy = clamp(c.vx*0.0011, -2.4, 2.4);
    c.wx = clamp(-c.vy*0.0013, -2.4, 2.4);
    pointer.card = null;
    cv.classList.remove("drag");
  }
}
addEventListener("pointerup", release);
addEventListener("pointercancel", release);
/* R 键重播入场。入场只有 2.2 秒，看一眼就过去了，不重播没法反复看节奏 ——
   刷新页面也行，但那会把卡片的摆位一起重置掉。 */
addEventListener("keydown", function(e){
  /* R = 完整重播：时钟归零之外还要把井**清空**，否则重播时上一轮的书还在飞，
     跟字一起从灭点往外长，看到的是两遍叠在一起。 */
  if (e.key === "r" || e.key === "R"){
    demoT = 0; cards.length = 0; spawnQueue = 0;
    sheets.length = 0; sheetQ = 0;          // 两套都清，省得切 ?paper= 时串台
  }
  /* B 键换封面版式。三版只能**在井里飞着**的时候挑：定格图里书是钉住不动的，
     真实场景里它一直在转、大小不停变、还跟字叠在一起 —— 两个地方看到的不是
     同一件事（这项目已经栽过一次：判"贴不贴边"用缩略图会读反）。 */
  else if (e.key === "b" || e.key === "B") P.book = ((P.book|0) + 1) % 3;
});

/* 演示花活：?auto=1 隔一会儿给某本书一个横向初速，让它飞得乱一点。
   书的"出场"和物理**不归它管**（见 frame 里那一段）—— 它只是个搅局的。 */
if (P.auto){
  var seq = 0;
  setInterval(function(){
    if (seq++ % 2) return;
    if (cards.length < P.n) spawn();
    if (cards.length){
      var c = cards[(seq*3) % cards.length];
      if (c && !c.held && c.dying===0){
        c.vx = (seq%4<2?1:-1) * (420+rnd()*260);
        c.vy = -180 - rnd()*220;
        c.wz = (rnd()-0.5)*4; c.wy = (rnd()-0.5)*3; c.wx = (rnd()-0.5)*3;
      }
    }
  }, 900);
}

resize();
T0 = performance.now();
for (var i0=0;i0<P.n;i0++) spawn();
/* ?t= 定格：把物理**按固定步长从 t=0 跑到该时刻**，而不是"跑一会儿再截图"——
   后者每次出图都不一样，做不了 A/B，也复现不了。种子固定，所以这条路上
   同一个 t 永远得到同一帧。 */
if (PIN !== null){
  /* ★ **必须一起推进 demoT**，否则量到的不是同一件事：书什么时候从井口出来是
     demoT 的函数（见 spawn 开头那道闸），预跑只走 step() 的话 demoT 恒为 0，
     每一本书都被闸挡掉，?t=3000 拍出来是口空井 —— 而且不报任何错。 */
  for (var acc=0; acc<PIN; acc+=1/60){ demoT = acc; step(1/60); }
  demoT = PIN;
}
requestAnimationFrame(frame);

/* ── 出口：点它回小镇 ──────────────────────────────────────────────
   `well-exit` / `well-hello` 是给父页（`town.html`）的暗号。**跨文档只能这么
   说话** —— 读不到对方的变量，也读不到对方的 DOM。
   ⚠ 这一页**单独打开**时 `parent === window`，消息会发给自己。加守卫，
     否则点「出口」会往自己耳朵里喊一声（无害但是脏）。
   ⚠ 那一头**不能拿 `e.origin` 当门**：file:// 丢过去的 origin 是不透明的。 */
function wellSay(what){
  if (window.parent && window.parent !== window)
    window.parent.postMessage({ what: what }, "*");
}
exitEl.addEventListener("click", function(){ wellSay("well-exit"); });
exitEl.addEventListener("keydown", function(e){
  if (e.key === "Enter" || e.key === " "){ e.preventDefault(); wellSay("well-exit"); }
});

/* 父页叫我们起钟（它那边叫 `wellGo()`，在幕开始往下让的那一刻发）。
   这一页**自己不带闸时收到也无害** —— `GATE` 本来就是 false，赋值等于没做。
   ★ 和 `well-exit` 一样**不能拿 `e.origin` 当门**：file:// 下它是空的/不透明的。
   ★ 单向：这边只收不答。`well-hello` 是加载时报到用的，跟这条无关。 */
window.addEventListener("message", function(e){
  var d = e.data;
  if (d && typeof d === "object" && d.what === "well-go") GATE = false;
});

/* 报到。父页拿它当**跨文档的硬判据** —— iframe 的盒子有尺寸时里面完全可能
   是一片空白（在 `display:none` 下建好的那种 0×0 的井就是这样），
   所以"盒子有尺寸"证明不了什么，只有这条消息能。
   双 rAF 是为了等第一帧真的画完再报。 */
requestAnimationFrame(function(){ requestAnimationFrame(function(){
  wellSay("well-hello");
}); });

/* 探针。`dx`/`dy` 是字心离消失点多远 —— **必须恒为 0**（它是判"钉没钉在井口"
   的唯一硬判据，肉眼看两张图差几个像素是看不出来的）。
   `fontLoaded` 只证明**字体文件加载了**，不证明「出口」两个字在子集里 ——
   缺字形这件事 `document.fonts.check` 查不出来（它报 True），
   硬判据只有 canvas 逐像素比。子集有没有漂，看 `pix-subset.py` 打印的"新增/移除"。 */
/* ⚠ 名字里必须带 `Probe`：页面自己**早就有一个** `window.__well`（`:1194` 那个
   几何数组，`:1252` 往里 push）。挂同名会把它整个覆盖掉，而它只写不读 ——
   所以覆盖之后**没有任何症状**，`errs` 是空的、`well-hello` 照发，
   只有探针取值时才炸出一个 `KeyError`。抢注别人的名字是这次真踩到的。 */
window.__wellProbe = {
  state: function(){
    var r = exitEl.getBoundingClientRect();
    return { vp:[+VP.x.toFixed(1), +VP.y.toFixed(1)],
             rect:[Math.round(r.left),Math.round(r.top),
                   Math.round(r.width),Math.round(r.height)],
             dx:+(r.left+r.width/2-VP.x).toFixed(2),
             dy:+(r.top+r.height/2-VP.y).toFixed(2),
             fontLoaded: document.fonts.check("12px Zpix"),
             W:W, H:H, errs:(window.__errs||[]).length };
  },
  say: wellSay
};

/* 纸上那段字的探针。名字里带 Probe —— 理由同上：`window.__paper` 这种短名字
   谁都可能先用掉（这一页自己就有一个 __well 的先例）。
   ★ 出图时图里只有"一块字"，看不出**抽到的是第几段、排了几行、纸该多大、
     此刻长到多大** —— 而"尺寸有没有跟段落适配"这个结论全在这四个数上。
     所以这四个数必须能读出来，不能靠看图猜。 */
window.__paperProbe = {
  list: function(){
    var out = [];
    for (var i=0;i<sheets.length;i++){
      var s = sheets[i];
      if (!s.pick) continue;
      /* ★ sx/sy 是**字**被拉伸的倍数（drawPaperText 里那两个 scale），
         终态该是 1.00 / 1.00。它们不等于 1 就是字被扯变形了 ——
         而"看着扁"这件事在图上只有 40% 以上才读得出来，量出来才有话说。 */
      var Q1 = sheetQuad(s);
      out.push({ seg:s.segN, src:s.pick[0], chars:s.pick[1].length,
                 lines:s.lay.lines.length,
                 sx:+(2*Q1.hv/s.lay.w).toFixed(3), sy:+(2*Q1.hh/s.lay.h).toFixed(3),
                 zx:+(s.zx||0).toFixed(2), zy:+(s.zy||0).toFixed(2),
                 tzx:+(s.tzx||0).toFixed(2), tzy:+(s.tzy||0).toFixed(2),
                 layW:Math.round(s.lay.w), layH:Math.round(s.lay.h),
                 nowW:Math.round(s.fw*(s.zx||0)), nowH:Math.round(s.fh*(s.zy||0)),
                 face:+s.face.toFixed(3), puff:+(s.puff||0).toFixed(3),
                 held:!!s.held, dying:+s.dying.toFixed(3),
                 head:s.lay.lines[0] });
    }
    return out;
  },
  /* 井里那些纸现在在屏幕的哪儿 —— 真鼠标事件要有点击坐标，而这个坐标
     是 rnd() 抽出来的方向 + 长了多久共同决定的，脚本猜不出来。 */
  spots: function(){
    var out = [];
    for (var i=0;i<sheets.length;i++){
      var g = sheetGeom(sheets[i]), qq = sheetQuad(sheets[i]).q;
      var cx=0, cy=0;
      for (var k=0;k<4;k++){ cx += qq[k][0]; cy += qq[k][1]; }
      out.push({ i:i, cx:Math.round(cx/4), cy:Math.round(cy/4),
                 r0:Math.round(g[0]), r1:Math.round(g[1]),
                 face:+(sheets[i].face||0).toFixed(2),
                 held:!!sheets[i].held, seg:sheets[i].segN|0 });
    }
    return out;
  },
  /* 把 37 段**全部**排一遍。"尺寸适配"这件事图上一次只能看一段，
     而"有没有哪一段被缩到看不清 / 撑到出屏"是个**分布**问题 ——
     只能在数据上看。返回每一段的字/行数/纸尺寸/最终字号。 */
  layoutAll: function(){
    var out = [], fsmin = 1e9, wmax = 0, hmax = 0, bad = [];
    for (var i=0;i<PS.length;i++){
      var L = layoutFor(PS[i][1], PS[i][0]);
      out.push({ seg:i+1, chars:PS[i][1].length, lines:L.lines.length,
                 w:Math.round(L.w), h:Math.round(L.h), fs:+L.fs.toFixed(1) });
      fsmin = Math.min(fsmin, L.fs); wmax = Math.max(wmax, L.w); hmax = Math.max(hmax, L.h);
      /* 断行有没有**从词中间劈开**：上一行以 ASCII 结尾、下一行以 ASCII 开头
         就是劈了（"…她有100" / "0种…"）。★ 这一条必须由机器查：它不报错、
         排版看着完全正常，只有**盯着那一行读**才看得出来 —— 出图撞见的那次
         就是这么发现的，而且是翻到第 14 行才看见的。 */
      for (var k=0;k+1<L.lines.length;k++){
        var a = L.lines[k], b = L.lines[k+1];
        if (a && b && WORDRE.test(a.charAt(a.length-1)) && WORDRE.test(b.charAt(0)))
          bad.push({ seg:i+1, line:k+1, tail:a.slice(-14), head:b.slice(0,14) });
      }
    }
    return { rows: out, fsMin:+fsmin.toFixed(1), wMax:Math.round(wmax),
             hMax:Math.round(hmax), W:W, H:H, broken:bad };
  },
  /* 池子本身要在**页面里**核一遍：build-doc.py 报的是它写进文件的内容，
     页面读的是数组 —— 两者之间还隔着一次文件写入（路径写错过一次，
     正是"写了一个、没写另一个"）。 */
  pool: function(){
    var L = PS.map(function(p){ return p[1].length; }).sort(function(a,b){ return a-b; });
    return { n:PS.length, min:L[0], p50:L[L.length>>1], max:L[L.length-1],
             srcs:PS.map(function(p){ return p[0]; })
                    .filter(function(v,i,a){ return a.indexOf(v)===i; }).length };
  },
  /* 洗牌袋：**只看不动** —— 这一轮接下来会发哪些段、还剩几个。
     ★ 这条判据的用途是"跨加载"的：它要回答的问题（"每次进井顺序一样吗"）
       在任何**单次**采样里都看不出来 —— 一次运行内的顺序永远是"看着挺随机"。
       所以判法只能是连开几次、比 `next` 的头一位。
     `bagLeft` 数到 0 就是下一张会触发重洗。 */
  bag: function(n){
    n = clamp(n|0 || 5, 1, PS.length);
    var out = [];
    for (var k=0;k<n && bagIx+k < bag.length;k++) out.push(bag[bagIx+k] + 1);
    return { seed: bagSeed, left: bag.length - bagIx, next: out,
             last: bagLast + 1 };      // last 是**刚发出去**的那段（还没发过 = 0）
  }
};

/* HUD 默认不显示，`?probe` 才开 —— 理由见 CSS 那条 ★。
   ★ **探针不受影响**：`display:none` 的元素 `textContent` 照常读得到。
     `_logs/_wellgate.py` / `_wellintro.py` 读的入场百分比、抽到第几段、`errs`
     全是 textContent。出图想在图里带读数，探针里临时 `style.display="block"`
     一下即可（和"临时藏掉幕"是同一招的反面）。 */
document.getElementById("hud").style.display = Q.has("probe") ? "block" : "none";
</script>
</body>
</html>
